}
function renderMachineModal(){
  const m = allMachines().find(x=>x.code===machineModal);
  const allRows = machineDetailAllRows(machineModal);

  // DÜZELTME: Eskiden bir kaydın TÜM ömrü (ör. 5 gün süren, aralarda duraklamalarla dolu bir
  // iş) tek bir güne — SADECE BAŞLADIĞI güne — yazılıyordu ve o süre hiç duruş düşülmeden
  // "Toplam Süre" diye gösteriliyordu (120 saat gibi anlamsız rakamlar). Artık her kayıt,
  // GERÇEKTEN DOKUNDUĞU her takvim gününe kendi payı kadar bölünüyor, ve duruş süresi o günün
  // payından DÜŞÜLÜYOR — kalan "Net Çalışma" gerçekten o gün çalışılan süreyi gösteriyor. Duruş
  // olaylarının hangi güne ait olduğunu da durusLog'daki gerçek zaman damgalarından buluyoruz.
  const byDayAll = {};
  allRows.forEach(e=>{
    const endClip = e.endTs || nowTick;
    const events = entryDurusEvents(e); // {ts, sureMs, neden} — H2 (durusLog) sayesinde artık gerçek zaman damgalı
    const exclEvents = entryExcludedEvents(e); // Gün Sonu süreleri — AYRICA zaman damgalı (excludedLog)
    let cur = e.startTs;
    let guard = 0;
    while(cur < endClip && guard < 400){ // 400 gün güvenlik sınırı (sonsuz döngüye karşı)
      guard++;
      const dk = dateKey(cur);
      const dayStart = new Date(dk+'T00:00:00').getTime();
      const dayEnd = dayStart + 86400000;
      const segEnd = Math.min(endClip, dayEnd);
      const segWallMs = Math.max(0, segEnd - cur);
      // Bu güne denk gelen duruş olaylarını, olayın KENDİSİNİN de gece yarısını aşabileceğini
      // hesaba katarak (msOverlap) buluyoruz — sadece başlangıç zaman damgasına bakmıyoruz.
      const segEvents = events.filter(ev => msOverlap(ev.ts, ev.sureMs, cur, segEnd) > 0);
      const segDurusMs = events.reduce((s,ev)=>s+msOverlap(ev.ts, ev.sureMs, cur, segEnd), 0);
      // Gün Sonu süresini de AYNI şekilde sadece bu güne denk gelen kısmıyla düşüyoruz —
      // eskiden bu hiç düşülmüyordu (gece boyu bekleme "çalışma" sayılıp gün şişiyordu).
      const segExclMs = exclEvents.reduce((s,ev)=>s+msOverlap(ev.ts, ev.sureMs, cur, segEnd), 0);
      const segWorkMs = Math.max(0, segWallMs - segDurusMs - segExclMs);
      if(!byDayAll[dk]) byDayAll[dk] = {count:0, workMs:0, durusMs:0, durusCount:0, jobs:new Set()};
      byDayAll[dk].count++;
      byDayAll[dk].workMs += segWorkMs;
      byDayAll[dk].durusMs += segDurusMs;
      byDayAll[dk].durusCount += segEvents.length;
      byDayAll[dk].jobs.add(e.isEmriNo);
      cur = segEnd;
    }
  });
  // FİZİKSEL TAVAN: bir makine bir günde, o günün standart mesai süresinden (540 dk) fazla
  // "net çalışmış" görünüyorsa (fazla mesai dahil bile olsa aşırıysa) bunu işaretliyoruz —
  // sessizce yanlış rakam göstermek yerine.
  Object.keys(byDayAll).forEach(dk=>{
    const d = byDayAll[dk];
    const dayCapMs = (WORKDAY_MINUTES + 300) * 60000; // 540 dk + 5 saate kadar makul fazla mesai payı
    d.anomali = d.workMs > dayCapMs;
    if(d.anomali) d.workMs = dayCapMs;
  });
  const allDays = Object.keys(byDayAll).sort(); // eskiden yeniye, timeline soldan sağa akar
  const maxMs = Math.max(1, ...allDays.map(d=>byDayAll[d].workMs+byDayAll[d].durusMs));

  const timelineHtml = `<div class="timeline-strip">
    <div class="timeline-all ${!modalDateFilter?'selected':''}" onclick="setModalDateFilter('')" title="Tüm tarihler">
      <div class="timeline-all-icon">⟷</div><div class="timeline-day-label">Tümü</div>
    </div>
    ${allDays.map(d=>{
      const dayTotalMs = byDayAll[d].workMs + byDayAll[d].durusMs;
      const pct = Math.max(6, Math.round((dayTotalMs/maxMs)*100));
      const [, mm, dd] = d.split('-'); const label = `${dd}.${mm}`; // DD.MM
      return `<div class="timeline-day ${modalDateFilter===d?'selected':''}" onclick="setModalDateFilter('${d}')" title="${d} · Çalışma: ${fmtDur(byDayAll[d].workMs)} · Duruş: ${fmtDur(byDayAll[d].durusMs)} · ${byDayAll[d].jobs.size} iş">
        <div class="timeline-bar-track"><div class="timeline-bar-fill" style="height:${pct}%"></div></div>
        <div class="timeline-day-label">${label}</div>
      </div>`;
    }).join('')}
  </div>`;

  let rows = allRows;
  // DÜZELTME: Eskiden sadece o gün BAŞLAYAN kayıtlar gösteriliyordu — bir iş önceki günden
  // başlayıp seçilen güne devam ediyorsa (ör. 05.08'de başlayıp 10.08'de biten bir iş), o günün
  // görünümünde HİÇ görünmüyordu (10.08 sabahı "boş" görünüyordu, oysa iş orada devam ediyordu).
  // Artık kaydın [başlangıç, bitiş] aralığı seçilen günle KESİŞİYORSA gösteriliyor.
  if(modalDateFilter){
    const fDayStart = new Date(modalDateFilter+'T00:00:00').getTime();
    const fDayEnd = fDayStart + 86400000;
    rows = rows.filter(e=>{
      const eEnd = e.endTs || nowTick;
      return e.startTs < fDayEnd && eEnd >= fDayStart;
    });
  }
  modalVisibleIds = rows.map(e=>e.id);

  // GANTT (saat bazlı zaman çizelgesi) — sadece TEK BİR gün seçiliyken anlamlı (birden fazla
  // gün üst üste binerse saat ekseni anlamsızlaşır). Yukarıdaki "timeline-strip" gün SEÇİCİ,
  // bu ise seçilen günün İÇİNDE hangi saatlerde ne olmuş onu gösteriyor.
  let ganttHtml = '';
  if(modalDateFilter){
    const gDayStartMs = new Date(modalDateFilter+'T00:00:00').getTime();
    const gSegs = rows.map(e=>{
      const endClip = e.endTs || nowTick;
      const segStart = Math.max(e.startTs, gDayStartMs);
      const segEndForSeg = Math.min(endClip, gDayStartMs+86400000);
      const startMin = Math.max(0, (e.startTs - gDayStartMs)/60000);
      const durMin = Math.max(1, (segEndForSeg - segStart)/60000);
      const leftPct = Math.max(0, (startMin/1440)*100);
      const widthPct = Math.min(100-leftPct, (durMin/1440)*100);
      const totalMs = Math.max(0, segEndForSeg - segStart);
      // DÜZELTME: Eskiden effectiveDurusMs/effectiveExcludedMs kaydın TÜM geçmişindeki
      // (birden fazla günü kapsayan) toplam duruş/Gün Sonu süresini döndürüyordu — bu, tek bir
      // günün küçük bir dilimine (totalMs) uygulanınca sonucu negatife düşürüp sıfırlıyordu
      // (ör. dün akşam başlayıp bu sabah biten bir iş, bu sabahki gerçek çalışma saati bile
      // "hiç çalışılmamış" gibi görünüyordu). Artık SADECE bu günün segmentine denk gelen
      // duruş/Gün Sonu olayları (zaman damgalarına göre) hesaba katılıyor.
      const durusMs = entryDurusEvents(e).reduce((s,ev)=>s+msOverlap(ev.ts, ev.sureMs, segStart, segEndForSeg), 0);
      const exclMs = entryExcludedEvents(e).reduce((s,ev)=>s+msOverlap(ev.ts, ev.sureMs, segStart, segEndForSeg), 0);
      const workMs = Math.max(0, totalMs - durusMs - exclMs);
      const workPct = totalMs>0 ? Math.round(workMs/totalMs*100) : 0;
      const durusPct = totalMs>0 ? Math.round(durusMs/totalMs*100) : 0;
      return { e, leftPct, widthPct, workPct, durusPct };
    });
    ganttHtml = `<div class="sec-h" style="margin-top:0">Saat Bazlı Zaman Çizelgesi (Gantt) — ${modalDateFilter}</div>
    <div style="margin-bottom:20px">
      <div style="position:relative;height:16px;margin-bottom:4px">
        ${[0,3,6,9,12,15,18,21].map(h=>`<span style="position:absolute;left:${(h*60/1440)*100}%;font-size:10px;color:var(--text-muted);transform:translateX(-50%)">${String(h).padStart(2,'0')}:00</span>`).join('')}
      </div>
      ${gSegs.length===0 ? `<div style="color:var(--text-muted);font-size:12.5px;padding:8px 0">Bu günde kayıt yok.</div>` : gSegs.map(({e,leftPct,widthPct,workPct,durusPct})=>`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <div style="width:90px;font-size:11px;color:var(--text-muted);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.isEmriNo||'')}">${esc(e.isEmriNo||'—')}</div>
          <div style="position:relative;flex:1;height:20px;background:var(--panel-alt);border-radius:4px;overflow:hidden">
            <div style="position:absolute;left:${leftPct}%;width:${widthPct}%;height:100%;display:flex;border-radius:3px;overflow:hidden" title="${esc(e.operatorName||'')} · ${fmtDT(e.startTs)}${e.endTs?' - '+fmtDT(e.endTs):' (devam ediyor)'}">
              <div style="width:${workPct}%;background:#4ade80"></div>
              <div style="width:${durusPct}%;background:#facc15"></div>
              <div style="flex:1;background:#3a4148"></div>
            </div>
          </div>
        </div>
      `).join('')}
      <div style="display:flex;gap:16px;font-size:11px;color:var(--text-muted);margin-top:6px">
        <span><span style="display:inline-block;width:10px;height:10px;background:#4ade80;border-radius:2px;margin-right:4px"></span>Çalışma</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#facc15;border-radius:2px;margin-right:4px"></span>Duruş</span>
      </div>
    </div>`;
  }

  // DÜZELTME: Artık ham (duruş dahil, gün sınırı gözetmeyen) toplam yerine, yukarıda doğru
  // hesaplanmış byDayAll verisinden (gün bazlı, net, duruş düşülmüş) türetiyoruz — tutarlı olsun.
  const relevantDays = modalDateFilter ? [modalDateFilter] : allDays;
  const totalMs = relevantDays.reduce((s,d)=> s + (byDayAll[d]?.workMs||0), 0);
  const totalDurusMs = relevantDays.reduce((s,d)=> s + (byDayAll[d]?.durusMs||0), 0);
  const jobCount = new Set(rows.map(e=>e.isEmriNo)).size;
  const recordCount = rows.length;

  let dailyTable = '';
  if(!modalDateFilter){
    const days = allDays.slice().reverse();
    dailyTable = `<div class="sec-h" style="margin-top:0">Günlere Göre Özet</div>
      <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:8px;margin-top:-8px">Her gün, o güne denk gelen kısmıyla ayrı ayrı hesaplanıyor — çok günlü/duraklamalı işler artık başladıkları güne toptan yazılmıyor. Verimlilik, standart mesaiye (${WORKDAY_MINUTES} dk) göre.</div>
      <table style="margin-bottom:20px"><thead><tr><th>Tarih</th><th>Kayıt Sayısı</th><th>İş Sayısı</th><th>Net Çalışma</th><th>Duruş</th><th>Verimlilik</th></tr></thead><tbody>
      ${days.map(d=>{
        const dd = byDayAll[d];
        const verim = Math.min(100, Math.round((dd.workMs/60000)/WORKDAY_MINUTES*100));
        return `<tr>
          <td>${d}</td>
          <td>${dd.count}</td>
          <td>${dd.jobs.size}</td>
          <td>${fmtDur(dd.workMs)}${dd.anomali?` <span style="color:var(--danger)" title="Standart mesai + makul fazla mesai payını aştığı için tavana çekildi, kontrol et">${ico('alert',14)}</span>`:''}</td>
          <td style="color:${dd.durusMs>0?'var(--warn)':'inherit'}">${dd.durusCount>0?`${dd.durusCount} kez · ${fmtDur(dd.durusMs)}`:'—'}</td>
          <td><span style="color:${verim>=70?'var(--success)':verim>=40?'var(--warn)':'var(--danger)'};font-weight:700">%${verim}</span></td>
        </tr>`;
      }).join('')}
      </tbody></table>`;
  }

  return `<div class="modal-overlay" onclick="if(event.target===this) closeMachineDetail()">
    <div class="modal-box" style="max-width:1180px">
      <div class="modal-header">
        <div><div class="modal-title">${m.code}</div><div class="modal-sub">${esc(m.name)}</div></div>
        <button class="icon-btn" onclick="closeMachineDetail()">${ico('x',14)}</button>
      </div>
      <div class="modal-body">
        ${timelineHtml}
        <div class="modal-filter-row">
          ${canDeleteReport() && modalSelectedIds.size>0 ? `<button class="btn-ghost" style="border-color:var(--danger);color:var(--danger)" onclick="deleteModalSelected()">${ico('trash',14)} Seçilenleri Sil (${modalSelectedIds.size})</button>` : ''}
          <button class="btn-primary" style="width:auto;margin-left:auto;padding:8px 16px" onclick="exportMachineExcel('${machineModal}')">⬇ Excel'e Aktar (${rows.length})</button>
        </div>
        <div class="modal-stats">
          <div class="modal-stat-box"><div class="modal-stat-num">${recordCount}</div><div class="modal-stat-label">Kayıt</div></div>
          <div class="modal-stat-box"><div class="modal-stat-num">${jobCount}</div><div class="modal-stat-label">Farklı İş Emri</div></div>
          <div class="modal-stat-box"><div class="modal-stat-num">${fmtDur(totalMs)}</div><div class="modal-stat-label">Toplam Süre</div></div>
          <div class="modal-stat-box"><div class="modal-stat-num" style="color:var(--warn)">${fmtDur(totalDurusMs)}</div><div class="modal-stat-label">Toplam Duruş</div></div>
        </div>
        ${totalDurusMs>0 ? renderDurusBreakdown(rows) : ''}
        ${dailyTable}
        ${ganttHtml}
        <div class="sec-h" style="margin-top:0">${modalDateFilter ? modalDateFilter+' — Detay' : 'Tüm Kayıtlar — Detay (eskiden yeniye)'}</div>
        <table><thead><tr>
          ${canDeleteReport() ? `<th style="width:26px"><input type="checkbox" ${modalVisibleIds.length>0 && modalVisibleIds.every(id=>modalSelectedIds.has(id))?'checked':''} onchange="toggleModalSelectAll()"></th>` : ''}
          <th>Tarih</th><th>İş Emri No</th><th>Malzeme</th><th>Operatör</th><th>Başlangıç</th><th>Bitiş</th><th>Süre</th><th>Durum</th>${session.isSuperAdmin ? `<th style="width:36px"></th>` : ''}${canDeleteReport() ? `<th style="width:36px"></th>` : ''}
        </tr></thead><tbody>
        ${(() => { const completedIdsForModal = computeCompletedRouteIds(); return rows.length===0 ? `<tr><td colspan="${8 + (canDeleteReport()?2:0) + (session.isSuperAdmin?1:0)}" style="text-align:center;color:var(--text-muted);padding:20px">Kayıt yok.</td></tr>` : rows.map(e=>{
          if(e._isTadilat){
            const dur = e.endTs ? fmtDur(e.endTs-e.startTs) : fmtElapsed(nowTick-e.startTs)+' (sürüyor)';
            const statusLabel = e.status==='tamamlandi' ? (e._sonOperasyon?'Tadilat Tamamlandı':'Operasyon Bitti (Devamı Var)') : 'Tadilat — Devam Ediyor';
            return `<tr>
              ${canDeleteReport() ? `<td><input type="checkbox" ${modalSelectedIds.has(e.id)?'checked':''} onchange="toggleModalSelect('${e.id}')"></td>` : ''}
              <td>${dateKey(e.startTs)}</td><td class="mono" style="color:var(--tadilat-info)">${ico('wrench',14)} ${esc(e.isEmriNo)}</td><td style="font-size:12.5px">${esc(e.malzemeCinsi||'—')}</td><td>${esc(e.operatorUsername)} · ${esc(e.operatorName)}</td><td>${fmtDT(e.startTs)}</td><td>${e.endTs?fmtDT(e.endTs):'—'}</td><td>${dur}</td><td><span style="color:var(--tadilat-info);font-weight:600">${statusLabel}</span></td>
              ${session.isSuperAdmin ? `<td><button class="del-btn" onclick="openTadilatRowEdit('${e.id}')" title="Düzelt">${ico('edit',14)}</button></td>` : ''}
              ${canDeleteReport() ? `<td>${session.isSuperAdmin ? `<button class="del-btn" onclick="deleteMachineModalTadilatRow('${e.id}')" title="Sil">${ico('trash',14)}</button>` : ''}</td>` : ''}
            </tr>`;
          }
          const isDone = completedIdsForModal.has(e.id);
          const statusColor = isDone ? 'var(--success)' : e.status==='devam'?'var(--accent)':e.status==='duruş'?'var(--warn)':'var(--success-soft)';
          const statusLabel = e.status==='devam'?'Devam Ediyor':e.status==='duruş'?'Duruşta':'Tamamlandı';
          const dur = e.endTs ? fmtDur(e.endTs-e.startTs) : (e.status==='devam' ? fmtElapsed(nowTick-e.startTs)+' (sürüyor)' : '—');
          const malzAdi = e.malzemeCinsi || getTalepInfo(e.talepNo)?.malzemeAdi || '—';
          return `<tr style="${isDone?'background:var(--success-row)':''}">
            ${canDeleteReport() ? `<td><input type="checkbox" ${modalSelectedIds.has(e.id)?'checked':''} onchange="toggleModalSelect('${e.id}')"></td>` : ''}
            <td>${dateKey(e.startTs)}</td><td class="mono" style="color:var(--accent)">${esc(e.talepNo || e.isEmriNo)} ${isDone?ico('check',12):''}</td><td style="font-size:12.5px">${esc(malzAdi)}</td><td>${esc(e.operatorUsername)} · ${esc(e.operatorName)}</td><td>${fmtDT(e.startTs)}</td><td>${e.endTs?fmtDT(e.endTs):'—'}</td><td>${dur}</td><td><span style="color:${statusColor};font-weight:600">${isDone?'Rota Tamamlandı':statusLabel}</span></td>
            ${session.isSuperAdmin ? `<td><button class="del-btn" onclick="openReportEdit('${e.id}')" title="Düzelt">${ico('edit',14)}</button></td>` : ''}
            ${canDeleteReport() ? `<td><button class="del-btn" onclick="deleteModalRecord('${e.id}')" title="Sil">${ico('trash',14)}</button></td>` : ''}
          </tr>`;
        }).join('') })()}
        </tbody></table>
      </div>
    </div>
  </div>`;
}
function renderRouteModal(){
  const tabDefs = [
    { key:'ANA', label:'Ana' },
    { key:'ZARF', label:'_ZARF (Çelik)' },
    { key:'ELMAS', label:'_ELMAS (Karbür)' }
  ].map(t=>({ ...t, list: routesForBaseSuffix(routeModal.base, t.key) })).filter(t=>t.list.length>0);
  if(tabDefs.length===0){ routeModal=null; return ''; }
  let activeTab = tabDefs.find(t=>t.key===routeModal.activeSuffix) || tabDefs[0];
  let route = routeModal.finishedAt ? activeTab.list.find(r=>r.finishedAt===routeModal.finishedAt) : activeTab.list[0];
  if(!route) route = activeTab.list[0];
  if(!route){ routeModal=null; return ''; }

  const malz = route.entries.find(e=>e.malzemeCinsi||e.capBoy) || {};
  const malzText = [malz.malzemeCinsi, malz.capBoy].filter(Boolean).join(' · ');
  const talepNo = route.entries.find(e=>e.talepNo)?.talepNo || '';
  const uKodu = baseIsEmriNo(route.isEmriNo);

  const grandTotalMs = route.entries.reduce((s,e)=>s+(e.endTs?(e.endTs-e.startTs):0),0);
  const grandDurusMs = route.entries.reduce((s,e)=>s+(e.duruşToplamMs||0),0);
  const grandExcludedMs = route.entries.reduce((s,e)=>s+(e.excludedMs||0),0);
  const grandNetMs = grandTotalMs - grandDurusMs - grandExcludedMs;

  const stepsHtml = route.entries.map((e,i)=>{
    const wallMs = e.endTs ? (e.endTs-e.startTs) : 0;
    const durusMs = e.duruşToplamMs||0;
    const netMs = Math.max(0, wallMs - durusMs - (e.excludedMs||0));
    return `<div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:700;font-size:13px">${i+1}. ${esc((e.makine||'').split(' · ')[0]||'—')}</span>
        <span style="color:var(--text-muted);font-size:12px">${esc((e.makine||'').split(' · ')[1]||'')}</span>
      </div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:8px">${esc(e.operatorUsername)} · ${esc(e.operatorName)} &nbsp;·&nbsp; ${fmtDT(e.startTs)} → ${e.endTs?fmtDT(e.endTs):'—'}</div>
      <div style="display:flex;gap:20px;flex-wrap:wrap">
        <div><span style="color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px">Üretim Süresi</span><div style="font-family:'JetBrains Mono',monospace;font-weight:700">${fmtDur(netMs)}</div></div>
        <div><span style="color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px">Duruş Süresi</span><div style="font-family:'JetBrains Mono',monospace;font-weight:700;color:${durusMs>0?'var(--warn)':'var(--text-muted)'}">${fmtDur(durusMs)}</div></div>
        <div><span style="color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px">Toplam (Geçen Zaman)</span><div style="font-family:'JetBrains Mono',monospace;font-weight:700">${fmtDur(wallMs)}</div></div>
      </div>
      ${e.not?`<div style="font-size:12px;color:var(--text-muted);font-style:italic;margin-top:8px">"${esc(e.not)}"</div>`:''}
    </div>`;
  }).join('');

  return `<div class="modal-overlay" onclick="if(event.target===this) closeRouteDetail()">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <div class="modal-title">${esc(talepNo || route.isEmriNo)}</div>
          <div class="modal-sub mono">U kodu: ${esc(uKodu)}${malzText?' · '+esc(malzText):''}</div>
          <div class="modal-sub">Tamamlandı: ${fmtDT(route.finishedAt)}</div>
        </div>
        <button class="icon-btn" onclick="closeRouteDetail()">${ico('x',14)}</button>
      </div>
      ${tabDefs.length>1 ? `<div style="display:flex;gap:6px;padding:0 20px;margin-top:10px">
        ${tabDefs.map(t=>`<button class="tab-btn ${t.key===activeTab.key?'active':''}" style="flex:1;font-size:12.5px" onclick="setRouteModalTab('${t.key}')">${t.label}</button>`).join('')}
      </div>` : ''}
      <div class="modal-body">
        <div class="modal-stats">

function renderGroupScreen(groupId, groupMembers){
  const makine = groupMembers[0]?.makine || '—';
  const anyDurus = groupMembers.some(e=>e.status==='duruş');
  const ref = groupMembers[0];
  const header = `
    <div class="header">
      <div class="header-left">${connDot()}<span style="font-size:20px">${ico('factory',14)}</span><div><div class="brand">ROTA TAKİP</div><div class="brand-sub">${esc(session.username)} · ${esc(session.displayName)}</div></div></div>
      <button class="icon-btn" onclick="doLogout()" title="Çıkış">${ico('logout',14)}</button>
    </div>
    <div style="padding:14px 18px 0">
      <button class="lock-back-btn" onclick="closeGroupDetail()">← Makineler</button>
    </div>`;

  let actionBlock;
  if(anyDurus){
    actionBlock = `<div class="lock-actions" style="display:flex;gap:10px;margin-top:28px">
      <button class="btn-start" style="width:auto;padding:13px 26px" onclick="devamGrup('${groupId}')">${ico('play',14)} Devam Ettir (Tümü)</button>
    </div>`;
  } else {
    // DÜZELTME: durusOpen olsa bile butonlar yerinde kalıyor — asıl seçim artık aşağıda
    // gerçek bir MODAL (renderDurusModal) olarak açılıyor, satır içi değil (bkz. tekli iş
    // akışındaki aynı düzeltmenin açıklaması).
    actionBlock = `<div class="lock-actions" style="display:flex;gap:10px;margin-top:28px">
      <button class="chip" style="padding:13px 22px" onclick="toggleDurus(true)">${ico('clock',14)} Duruşa Al (Tümü)</button>
      <button class="btn-primary" style="width:auto;padding:13px 22px" onclick="bitirGrup('${groupId}')">${ico('stop',14)} Bitir (Tümü)</button>
    </div>`;
  }

  const body = `<div class="lock-screen">
    <div class="lock-label" style="${anyDurus?'color:var(--warn)':''}">${anyDurus?'DURUŞTA':'ÇOKLU İŞ EMRİ'}</div>
    <div class="lock-id">${esc(makine)}</div>
    <div class="lock-machine">${groupMembers.map(e=>esc(e.talepNo || e.isEmriNo)).join(', ')}</div>
    <div class="lock-timer" style="${anyDurus?'color:var(--warn)':''}">${anyDurus?fmtElapsed(nowTick-ref.duruşTs):fmtElapsed(nowTick-ref.startTs)}</div>
    <div class="lock-meta">${anyDurus?'duruş süresi (tüm iş emirleri için ortak)':`${groupMembers.length} iş emri bu makinede aynı anda aktif`}</div>
    ${anyDurus ? `<div class="durus-reason-box" style="${ref.duruşNedeni===GUN_SONU_REASON?'color:var(--gunsonu);background:var(--gunsonu-soft);border-color:var(--gunsonu-border)':isTadilatRelated(ref.duruşNedeni)?'color:var(--tadilat-info);background:var(--tadilat-soft);border-color:var(--tadilat-border)':''}">${ref.duruşNedeni===GUN_SONU_REASON?(ico('moon',13)+' '):isTadilatRelated(ref.duruşNedeni)?(ico('wrench',13)+' '):''}"${esc(ref.duruşNedeni)}"</div>` : ''}
    <div style="margin-top:20px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:8px;text-align:left">
      <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;padding:0 2px">Parti parti dönebilir — her iş emrini ayrı ayrı bitirebilirsin</div>
      ${groupMembers.map(e=>`
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px">
          <div>
            <div class="mono" style="font-weight:700;color:var(--accent)">${esc(e.talepNo || e.isEmriNo)}</div>
            <div style="font-size:11.5px;color:var(--text-muted)">Adet: ${esc(e.adet||'—')}${e.status==='duruş'?' · Duruşta':''}</div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn-ghost" style="padding:8px 10px;font-size:12.5px" onclick="openEditActive('${e.id}')" title="Bilgileri Düzenle">${ico('edit',14)}</button>
            <button class="btn-ghost" style="padding:8px 14px;font-size:12.5px;white-space:nowrap" onclick="bitir('${e.id}')">${ico('stop',14)} Bitir</button>
          </div>
        </div>
      `).join('')}
    </div>
    ${actionBlock}
  </div>`;

  const editingMember = groupMembers.find(e=>e.id===editingActiveId);
  const editBlock = editingMember ? `
    <div class="modal-overlay" onclick="if(event.target===this) cancelEditActive()">
      <div class="modal-box" style="max-width:400px">
        <div class="modal-header">
          <div><div class="modal-title">Bilgileri Düzenle</div><div class="modal-sub">${esc(editingMember.talepNo || editingMember.isEmriNo)} · ${esc(editingMember.makine)}</div></div>
          <button class="icon-btn" onclick="cancelEditActive()">${ico('x',14)}</button>
        </div>
        <div class="modal-body">
          <div class="field"><label>İş Talep No</label><input id="edit-talepno" class="mono" value="${esc(editForm.talepNo)}"></div>
          <div class="field"><label>Malzeme Cinsi</label><input id="edit-malzeme-cinsi" value="${esc(editForm.malzemeCinsi)}"></div>
          <div class="field"><label>Çap ve Boy</label><input id="edit-cap-boy" value="${esc(editForm.capBoy)}"></div>
          <div class="field"><label>Adet</label><input id="edit-adet" inputmode="numeric" value="${esc(editForm.adet)}" oninput="this.value=this.value.replace(/\\D/g,'')"></div>
          <div class="field"><label>Not</label><textarea id="edit-not" style="min-height:60px">${esc(editForm.not)}</textarea></div>
          ${switchRow('edit-son-operasyon', editForm.sonOperasyon, 'Son Operasyon', 'Bitince iş rotası kapanır', {style:'margin-bottom:14px'})}
          <div style="display:flex;gap:10px">
            <button class="btn-primary" onclick="saveEditActive('${editingMember.id}')">${ico('check',14)} Kaydet</button>
            <button class="btn-ghost" onclick="cancelEditActive()">${ico('x',14)} Vazgeç</button>
          </div>
        </div>
      </div>
    </div>` : '';

  return `<div class="root-mobile theme-${resolvedTheme()}">${header}${body}${editBlock}${!anyDurus && durusOpen ? renderDurusModal() : ''}</div>`;
}
function renderLockScreen(active){
  const header = `
    <div class="header">
      <div class="header-left">${connDot()}<span style="font-size:20px">${ico('factory',14)}</span><div><div class="brand">ROTA TAKİP</div><div class="brand-sub">${esc(session.username)} · ${esc(session.displayName)}</div></div></div>

            <button class="btn-primary" onclick="saveEditActive('${active.id}')">${ico('check',14)} Kaydet</button>
            <button class="btn-ghost" onclick="cancelEditActive()">${ico('x',14)} Vazgeç</button>
          </div>
        </div>
      </div>

  if(active.status==='duruş'){
    return `<div class="root-mobile theme-${resolvedTheme()}">${header}

        <div class="lock-label" style="color:var(--warn)">DURUŞTA</div>
        <div class="lock-id">${esc(active.talepNo || active.isEmriNo)}</div>

        <div class="lock-machine">${esc(active.makine)}</div>
        <div class="lock-timer" style="color:var(--warn)">${fmtElapsed(nowTick-active.duruşTs)}</div>
        <div class="lock-meta">duruş süresi</div>
        <div class="durus-reason-box" style="${active.duruşNedeni===GUN_SONU_REASON?'color:var(--gunsonu);background:var(--gunsonu-soft);border-color:var(--gunsonu-border)':isTadilatRelated(active.duruşNedeni)?'color:var(--tadilat-info);background:var(--tadilat-soft);border-color:var(--tadilat-border)':''}">${active.duruşNedeni===GUN_SONU_REASON?(ico('moon',13)+' '):isTadilatRelated(active.duruşNedeni)?(ico('wrench',13)+' '):''}"${esc(active.duruşNedeni)}"</div>
        <div class="lock-actions" style="display:flex;gap:10px;margin-top:28px">
          <button class="btn-start" style="width:auto;padding:13px 26px" onclick="devamEt('${active.id}')">${ico('play',14)} Devam Ettir</button>

  // DÜZELTME: Eskiden durusOpen true olunca "Duruşa Al/Bitir" butonları YOK OLUP yerine satır
  // içi bir panel açılıyordu — bu panel gerçek bir modal olmadığı için arkadaki lock-screen
  // (canlı sayaç, diğer tıklanabilir alanlar) hâlâ üstteydi/etkileşilebilirdi: "arka plan
  // hareket ediyor, birkaç saniye tıklayamıyorum" şikayetinin kaynağı buydu. Artık durusOpen
  // olsa bile bu butonlar YERİNDE KALIYOR (görünmez olmuyor) — asıl seçim ekranı, aşağıda

  // hiçbir şeyle etkileşime izin vermeyen) olarak açılıyor.
  const durusBlock = `<div class="lock-actions" style="display:flex;gap:10px;margin-top:28px;flex-wrap:wrap;justify-content:center">

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
        <button class="chip" onclick="setGecmisPreset(7)">Son 7 Gün</button>
        <button class="chip" onclick="setGecmisPreset(30)">Son 30 Gün</button>
        ${(gecmisFrom||gecmisTo||gecmisSearch) ? `<button class="btn-ghost" onclick="clearGecmisFilter()">${ico('x',14)} Temizle</button>` : ''}
      </div>
      ${myAll.length===0 ? `<div style="text-align:center;color:var(--text-muted);padding:40px 0">Bu aralıkta kayıt yok.</div>` : myAll.map(e=>{
        if(e._isTadilat){
          const durT = e.endTs ? fmtDur(e.endTs-e.startTs) : fmtElapsed(nowTick-e.startTs)+' (sürüyor)';
          const statusLabelT = e.status==='tamamlandi' ? (e._sonOperasyon?'Tadilat Tamamlandı':'Operasyon Bitti (Devamı Var)') : 'Tadilat — Devam Ediyor';
          return `<div class="card" style="border-color:var(--tadilat-info);border-left:4px solid var(--tadilat-info);cursor:pointer" onclick="openTadilatHistoryDetail('${e.id}')">
            <div class="card-header"><span class="card-id" style="color:var(--tadilat-info)">${ico('wrench',14)} ${esc(e.isEmriNo)}</span><span class="card-meta">${dateKey(e.startTs)}</span></div>
            ${e.malzemeCinsi ? `<div style="font-size:11.5px;color:var(--text-muted);margin:-4px 0 4px">${esc(e.malzemeCinsi)}</div>` : ''}
            <div class="op-top"><span class="op-code">${esc(e.makine||'—')}</span></div>
            <div class="op-foot">${ico('clock',14)} ${fmtDT(e.startTs)} → ${e.endTs?fmtDT(e.endTs):'—'} · ${durT}</div>
            <div style="margin-top:6px;font-size:12px;font-weight:600;color:var(--tadilat-info)">${statusLabelT}</div>
          </div>`;
        }
        const statusColor = e.status==='devam'?'var(--accent)':e.status==='duruş'?'var(--warn)':'var(--success)';
        const statusLabel = e.status==='devam'?'Devam Ediyor':e.status==='duruş'?'Duruşta':'Tamamlandı';
        const dur = e.endTs ? fmtDur(e.endTs-e.startTs) : (e.status==='devam' ? fmtElapsed(nowTick-e.startTs)+' (sürüyor)' : '—');
        return `<div class="card" style="cursor:pointer" onclick="openEntryDetail('${e.id}')">
          <div class="card-header"><span class="card-id">${esc(e.talepNo || e.isEmriNo)}</span><span class="card-meta">${dateKey(e.startTs)}</span></div>
          ${e.talepNo ? `<div style="font-size:11.5px;color:var(--text-muted);margin:-4px 0 4px" class="mono">U kodu: ${esc(e.isEmriNo)}</div>` : ''}
          <div class="op-top"><span class="op-code">${esc(e.makine||'—')}</span></div>
          <div class="op-foot">${ico('clock',14)} ${fmtDT(e.startTs)} → ${e.endTs?fmtDT(e.endTs):'—'} · ${dur}</div>
          <div style="margin-top:6px;font-size:12px;font-weight:600;color:${statusColor}">${statusLabel}</div>
        </div>`;
      }).join('')}
      ${entryDetailId ? renderEntryDetailModal() : ''}
      ${tadilatHistoryDetailId ? renderTadilatHistoryDetailModal() : ''}
    </div>`;
  } else if(view==='settings'){
    const chev = `<span class="chev">${ico('chevronRight',17)}</span>`;
    const pushOn = pushPermissionState==='granted';
    body = `<div class="body-pad">
      <div class="set-card" style="display:flex;align-items:center;gap:13px">
        <span class="avatar">${esc(initials(session.displayName))}</span>
        <span>
          <span style="display:block;font-size:16px;font-weight:700">${esc(session.displayName)}</span>
          <span style="display:block;font-size:12px;color:var(--text-muted);margin-top:2px">${esc(session.username)} · ${myRoleLabel()}</span>
        </span>
      </div>

      <div class="set-sec">GÖRÜNÜM</div>
      <div class="theme-pick">
        ${themeOptHtml('dark','Koyu','#15181c','#15181c')}
        ${themeOptHtml('light','Açık','#ffffff','#ffffff')}
        ${themeOptHtml('system','Sistem','#15181c','#ffffff')}
      </div>

      <div style="display:flex;flex-direction:column;gap:9px;margin-top:14px">
        ${pushConfigured() ? (
          pushPermissionState==='denied'
            ? `<div class="set-card" style="border-color:var(--danger)"><div style="font-size:14px;font-weight:600;margin-bottom:4px">${ico('bell',15)} Bildirimler kapalı</div><div style="font-size:12px;color:var(--text-muted)">Tarayıcı bu site için bildirimi engellemiş. Telefon ayarlarından izin vermen gerekiyor.</div></div>`
            : switchRow('set-push', pushOn, 'Bildirimler', pushOn ? 'Uzun duruş hatırlatması açık' : 'Uzun duruş hatırlatması', { ok:true, onchange:'onPushToggle(this)' })
        ) : ''}
        <button class="set-row" onclick="togglePwPanel()">${ico('lock',17)} Şifre değiştir ${pwOpen?'<span class="chev">−</span>':chev}</button>
        ${pwOpen ? `<div class="set-card">
          <div class="field"><label>Mevcut Şifre</label><input id="pw-current" type="password" placeholder="••••"></div>
          <div class="field"><label>Yeni Şifre (max 8 hane, sadece rakam)</label><input id="pw-next" type="password" inputmode="numeric" maxlength="8" placeholder="ör. 4821"></div>
          <div class="field" style="margin-bottom:12px"><label>Yeni Şifre (tekrar)</label><input id="pw-confirm" type="password" inputmode="numeric" maxlength="8" placeholder="ör. 4821"></div>
          <button class="btn-primary" onclick="changePassword()">${ico('check',15)} Şifreyi Güncelle</button>
        </div>` : ''}
        <button class="set-row" onclick="openSendMessage()">${ico('mail',17)} Mesaj / öneri gönder ${chev}</button>
      </div>

      ${renderMyPushHistoryList()}

      <button class="btn-ghost" style="width:100%;margin-top:26px;min-height:52px;border-color:var(--danger);color:var(--danger);font-size:15px;font-weight:700" onclick="doLogout()">${ico('logout',16)} Çıkış Yap</button>
    </div>`;
  } else {
    const mine = myActiveEntries();
    // Aynı groupId'ye sahip kayıtları TEK kart olarak göster (çoklu iş emri).
    const groups = [];
    const seenGroups = new Set();
    mine.forEach(e=>{
      if(e.groupId){
        if(seenGroups.has(e.groupId)) return;
        seenGroups.add(e.groupId);
        groups.push({ groupId: e.groupId, members: mine.filter(x=>x.groupId===e.groupId) });
      } else {
        groups.push({ groupId: null, members: [e] });
      }
    });
    body = `<div class="body-pad">`;
    // Madde 3+4 ile ilgili "gölgede kalan iş" riskine karşı: tadilat sonrası ayar bekleyen
    // işler sadece arka planda durmasın, operatör buraya her girdiğinde göze çarpsın.
    const bekleyenAyar = mine.filter(e => e.status==='duruş' && e.duruşNedeni===TADILAT_SONRASI_REASON);
    if(bekleyenAyar.length>0){
      body += `<div style="background:var(--tadilat-soft);border:2px solid var(--tadilat-info);border-radius:12px;padding:14px 16px;margin-bottom:16px">
        <div style="font-size:13.5px;font-weight:700;color:var(--tadilat-info);margin-bottom:8px">${ico('wrench',14)} Devam Etmeyi Bekleyen ${bekleyenAyar.length} Duraklatılmış İş Var</div>
        ${bekleyenAyar.map(e=>`
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border-radius:8px;padding:8px 12px;margin-top:6px;cursor:pointer" onclick="openActiveDetail('${e.id}')">
            <div><span class="mono" style="color:var(--accent);font-weight:700">${esc(e.talepNo || e.isEmriNo)}</span> <span style="font-size:11.5px;color:var(--text-muted)">${esc(e.makine)}</span></div>
            <span style="font-size:11.5px;color:var(--tadilat-info)">Tadilat sonrası ayar →</span>
          </div>
        `).join('')}
      </div>`;
    }
    // Bir operatör aynı anda birden fazla iş açık bırakıp (ör. çoklu iş izni olan biri tadilatı
    // kapattım sanıp üstüne yeni bir üretim işi de açarsa) birini unutabiliyor — hepsini tek
    // bakışta gösteren bir uyarı + tadilatları da bu listeye dahil ediyoruz, sadece Tadilat
    // sekmesinde gizli kalmasın. Kesinti zinciri yüzünden BİRDEN FAZLA yarım tadilat olabilir
    // (biri aktif, diğerleri duraklatılmış) — hepsi ayrı ayrı listeleniyor.
    const myTadilatSessions = myAllTadilatSessions();
    const totalActiveCount = groups.length + myTadilatSessions.length;
    if(totalActiveCount>1){
      body += `<div style="background:var(--warn-soft);border:2px solid var(--warn);border-radius:12px;padding:14px 16px;margin-bottom:16px">
        <div style="font-size:13.5px;font-weight:700;color:var(--warn);margin-bottom:6px">${ico('alert',14)} Aynı anda ${totalActiveCount} aktif işin var</div>
        <div style="font-size:12.5px;color:var(--text-muted)">${groups.length>0?(ico('factory',13)+` ${groups.length} üretim işi`):''}${groups.length>0 && myTadilatSessions.length>0?' · ':''}${myTadilatSessions.length>0?(ico('wrench',13)+` ${myTadilatSessions.length} tadilat`):''}</div>
      </div>`;
    }
    if(groups.length===0 && myTadilatSessions.length===0) body += `<div style="text-align:center;color:var(--text-muted);padding:40px 0">Henüz aktif işlem yok.<br><span style="font-size:12px">"+ Yeni Kayıt" ile bir makine başlat.</span></div>`;
    myTadilatSessions.forEach(({tadilat: mt, operasyon: mop})=>{
      const isPaused = mop.status==='duruş';
      body += `<div class="card" style="cursor:pointer;border-color:${isPaused?'var(--warn)':'var(--tadilat-info)'};border-left:4px solid ${isPaused?'var(--warn)':'var(--tadilat-info)'}" onclick="setView('tadilat')">
        <div class="card-header"><span class="card-id" style="color:${isPaused?'var(--warn)':'var(--tadilat-info)'}">${ico('wrench',14)} ${esc(mt.uKodu)}</span><span class="matrix-dot" style="background:${isPaused?'var(--warn)':'var(--tadilat-info)'};width:9px;height:9px;border-radius:50%;display:inline-block"></span></div>
        <div class="op-top" style="margin-bottom:6px"><span class="op-code">${esc(mop.makine||'—')}</span></div>
        <div class="op-foot">${isPaused ? (mop.duruşTs ? `${fmtElapsed(nowTick-mop.duruşTs)} duruşta · "${esc(mop.duruşNedeni)}"` : `seçim yapılıyor · "${esc(mop.duruşNedeni)}"`) : `${fmtElapsed(nowTick-mop.baslamaTs)} çalışıyor · Tadilat${mt.adet?` · Adet: ${esc(mt.adet)}`:''}`}</div>
      </div>`;
    });
    groups.forEach(g=>{
      if(g.members.length===1){
        const e = g.members[0];
        const dotColor = e.status==='duruş'?'var(--warn)':'var(--success)';
        const subInfo = e.status==='duruş' ? `Duruşta: "${esc(e.duruşNedeni)}"` : `${fmtElapsed(nowTick-e.startTs)} çalışıyor`;
        body += `<div class="card" style="cursor:pointer" onclick="openActiveDetail('${e.id}')">
          <div class="card-header"><span class="card-id">${esc(e.talepNo || e.isEmriNo)}</span><span class="matrix-dot" style="background:${dotColor};width:9px;height:9px;border-radius:50%;display:inline-block"></span></div>
          ${e.talepNo ? `<div style="font-size:11px;color:var(--text-muted);margin:-4px 0 4px" class="mono">U kodu: ${esc(e.isEmriNo)}</div>` : ''}
          <div class="op-top" style="margin-bottom:6px"><span class="op-code">${esc(e.makine)}</span></div>
          <div class="op-foot">${subInfo}${e.adet?` · Adet: ${esc(e.adet)}`:''}</div>
        </div>`;
      } else {
        const makine = g.members[0].makine;
        const anyDurus = g.members.some(m=>m.status==='duruş');
        const dotColor = anyDurus ? 'var(--warn)' : 'var(--success)';
        body += `<div class="card" style="cursor:pointer" onclick="openGroupDetail('${g.groupId}')">
          <div class="card-header"><span class="card-id">${g.members.length} İş Emri Aktif</span><span class="matrix-dot" style="background:${dotColor};width:9px;height:9px;border-radius:50%;display:inline-block"></span></div>
          <div class="op-top" style="margin-bottom:6px"><span class="op-code">${esc(makine)}</span></div>
          <div class="op-foot">${g.members.map(m=>`${esc(m.talepNo || m.isEmriNo)} (${m.status==='duruş'?'duruşta':fmtElapsed(nowTick-m.startTs)})`).join(', ')}</div>
        </div>`;
      }
    });
    body += `</div>`;
  }

  return `<div class="root-mobile theme-${resolvedTheme()}">${header}${body}${bottomNavHtml()}${messagesModalOpen ? renderMessagesModal() : ''}${sendMsgOpen ? renderSendMessageModal() : ''}${resimAramaOpen ? renderResimAramaModal() : ''}</div>`;
}

        <button class="icon-btn-labeled" onclick="doLogout()" style="padding:10px 20px;font-size:14px;font-weight:600">${ico('logout',14)} Çıkış</button>

      ${canCreateTadilat() && isAdminTabVisible('tadilat') ? `<button class="tab-btn ${view==='tadilatYonetim'?'active':''}" onclick="setView('tadilatYonetim')">${ico('wrench',14)} Tadilat</button>` : ''}

            <span>${reportOperatorFilter.size===0?'Tüm Operatörler':`${reportOperatorFilter.size} Operatör Seçili`}</span>
            <span style="font-size:10px;color:var(--text-muted)">${ico('chevronDown',10)}</span>
          </button>
          ${reportOperatorDropdownOpen ? `<div class="dropdown-panel">
            ${reportOperatorFilter.size>0 ? `<button class="btn-ghost" style="width:100%;margin-bottom:6px;font-size:12px" onclick="clearReportOperatorFilter()">${ico('x',14)} Seçimi Temizle</button>` : ''}
            ${operatorEntries.map(([code,v])=>`
              <label class="dropdown-item"><input type="checkbox" ${reportOperatorFilter.has(code)?'checked':''} onchange="toggleReportOperatorSelect('${code}')"><span>${code} · ${esc(v.displayName)}</span></label>
            `).join('')}
          </div>` : ''}
        </div>
        <input id="report-search-isemri" class="filter-input" placeholder="İş Emri No / Talep No ara…" value="${esc(reportFilter.isEmriNo)}" oninput="setReportFilterFieldLight('isEmriNo', this.value)">
        <div style="position:relative">
          <button class="filter-input" style="cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px" onclick="toggleReportMakineDropdown()">
            <span>${reportMakineFilter.size===0?'Tüm Makineler':`${reportMakineFilter.size} Makine Seçili`}</span>
            <span style="font-size:10px;color:var(--text-muted)">${ico('chevronDown',10)}</span>
          </button>
          ${reportMakineDropdownOpen ? `<div class="dropdown-panel">
            ${reportMakineFilter.size>0 ? `<button class="btn-ghost" style="width:100%;margin-bottom:6px;font-size:12px" onclick="clearReportMakineFilter()">${ico('x',14)} Seçimi Temizle</button>` : ''}
            ${allMachines().map(m=>{ const label=`${m.code} · ${m.name}`; return `<label class="dropdown-item"><input type="checkbox" ${reportMakineFilter.has(label)?'checked':''} onchange="toggleReportMakineSelect('${esc(label)}')"><span>${esc(label)}</span></label>`; }).join('')}
          </div>` : ''}
        </div>
        <input type="date" class="filter-input" value="${esc(reportFilter.tarihFrom)}" onchange="setReportFilterField('tarihFrom', this.value)" title="Başlangıç">
        <input type="date" class="filter-input" value="${esc(reportFilter.tarihTo)}" onchange="setReportFilterField('tarihTo', this.value)" title="Bitiş">
        <button class="chip" onclick="setReportDatePreset(1)">Bugün</button>
        <button class="chip" onclick="setReportDatePreset(7)">Son 7 Gün</button>
        <button class="chip" onclick="setReportDatePreset(30)">Son 30 Gün</button>
        <button class="chip" onclick="setReportDatePreset(90)">Son 3 Ay</button>
        ${(reportOperatorFilter.size>0||reportFilter.isEmriNo||reportMakineFilter.size>0||reportFilter.tarihFrom||reportFilter.tarihTo) ? `<button class="btn-ghost" onclick="clearReportFilter()">${ico('x',14)} Temizle</button>` : ''}
        ${canDeleteReport() && reportSelectedIds.size>0 ? `<button class="btn-ghost" style="border-color:var(--danger);color:var(--danger)" onclick="deleteReportSelected()">${ico('trash',14)} Seçilenleri Sil (${reportSelectedIds.size})</button>` : ''}
        <button class="btn-primary" style="width:auto;margin-left:auto;padding:8px 16px" onclick="exportExcel()">⬇ Excel'e Aktar (${fe.length})</button>
      </div>
      <div class="table-wrap"><table><thead><tr>
        ${canDeleteReport() ? `<th style="width:26px"><input type="checkbox" ${reportVisibleIds.length>0 && reportVisibleIds.every(id=>reportSelectedIds.has(id))?'checked':''} onchange="toggleReportSelectAll()"></th>` : ''}
        ${["İş Emri No (U kodu)","İş Talep No","Operasyon No","Malzeme Adı","Malzeme Cinsi","Çap ve Boy","Adet","Makine","Operatör","Başlangıç","Bitiş","Süre","Durum","Not"].map(h=>`<th>${h}</th>`).join('')}
        ${canEditReport() ? `<th style="width:36px"></th>` : ''}
        ${canDeleteReport() ? `<th style="width:36px"></th>` : ''}
      </tr></thead><tbody>`;
    const reportColCount = 14 + (canDeleteReport()?1:0) + (canEditReport()?1:0);
    if(fe.length===0){ body += `<tr><td colspan="${reportColCount}" style="text-align:center;color:var(--text-muted);padding:30px">Filtreyle eşleşen kayıt yok.</td></tr>`; }
    fe.forEach(e=>{
      const isDone = completedRoutes.has(e.id);
      const statusColor = isDone ? 'var(--success)' : e.status==='devam'?'var(--accent)':e.status==='duruş'?'var(--warn)':'var(--success-soft)';
      const statusLabel = e.status==='devam'?'Devam Ediyor':e.status==='duruş'?'Duruşta':'Tamamlandı';
      const rowStyle = isDone ? 'background:var(--success-row)' : '';
      const malzAdi = getTalepInfo(e.talepNo)?.malzemeAdi || '';
      body += `<tr style="${rowStyle}">
        ${canDeleteReport() ? `<td><input type="checkbox" ${reportSelectedIds.has(e.id)?'checked':''} onchange="toggleReportSelect('${e.id}')"></td>` : ''}
        <td class="mono" style="color:var(--accent);cursor:pointer" onclick="openEntryDetail('${e.id}')">${esc(e.isEmriNo)} ${isDone?ico('check',12):''}</td>
        <td class="mono">${esc(e.talepNo||'—')}</td>
        <td style="font-weight:700">${e._seq||'—'}</td>
        <td style="font-size:12.5px">${esc(malzAdi||'—')}</td>
        <td>${esc(e.malzemeCinsi||'—')}</td>
        <td>${esc(e.capBoy||'—')}</td>
        <td>${esc(e.adet||'—')}</td>
        <td>${esc(e.makine||'—')}</td>
        <td>${esc(e.operatorUsername)} · ${esc(e.operatorName)}</td>
        <td>${fmtDT(e.startTs)}</td>
        <td>${e.endTs?fmtDT(e.endTs):'—'}</td>
        <td>${e.endTs?fmtDur(e.endTs-e.startTs):'—'}</td>
        <td><span style="color:${statusColor};font-weight:600">${isDone?'Rota Tamamlandı':statusLabel}</span></td>
        <td style="color:var(--text-muted);font-style:italic">${esc(e.not||'')}</td>
        ${canEditReport() ? `<td><button class="del-btn" onclick="openReportEdit('${e.id}')" title="Düzelt">${ico('edit',14)}</button></td>` : ''}
        ${canDeleteReport() ? `<td><button class="del-btn" onclick="deleteReportRecord('${e.id}')" title="Sil">${ico('trash',14)}</button></td>` : ''}
      </tr>`;
    });
    body += `</tbody></table></div>${entryDetailId ? renderEntryDetailModal() : ''}`;
  }

  return `<div class="root-wide theme-${resolvedTheme()}">${header}${body}${machineModal ? renderMachineModal() : ''}${tadilatEditId ? renderTadilatEditModal() : ''}${malzemeAramaOpen ? renderMalzemeAramaModal() : ''}${reportEditId ? renderReportEditModal() : ''}${tadilatRowEditId ? renderTadilatRowEditModal() : ''}${machineAccessModalCode ? renderMachineAccessModal() : ''}${resimAramaOpen ? renderResimAramaModal() : ''}</div>`;
}
function setReportFilterFieldLight(field, val){ reportFilter[field]=val; renderTableOnly(); }
function renderTableOnly(){ render(); } // basit yaklaşım: filtre değişince tam yeniden çizim yeterli hızda çalışır

/* ===================== ANA RENDER ===================== */
function render(){
  const app = document.getElementById('app');
  // DÜZELTME (arka plan kayıyor sorunu): Duruş modalı sabit konumlu (position:fixed) bir
  // overlay olsa da, ALTINDAKİ SAYFA hâlâ kaydırılabilir durumda kalıyordu — bu yüzden
  // modal üzerindeki bazı dokunuşlar (özellikle üstteki tutamaç/boşluk bölgesi) mobilde
  // ARKA PLANI kaydırabiliyordu (fixed overlay'in üstünden "sızan" dokunma kaydırması,
  // bilinen bir mobil-web davranışı). Artık modal açıkken sayfanın kendisi tamamen
  // kilitleniyor — kaydıracak bir şey kalmıyor.
  const shouldLockScroll = durusOpen || tadilatDurusPickerOpen;
  document.body.style.overflow = shouldLockScroll ? 'hidden' : '';

  // Periyodik (saniyelik) yeniden çizim, açık bir modal veya tablo varsa kaydırma
  // konumunu sıfırlamasın diye önce mevcut scroll konumlarını kaydediyoruz.
  const scrollSel = ['.modal-body', '.table-wrap', '.body-pad', '.completed-wrap', '.matrix-wrap', '.settings-wrap', '.lock-screen', '.durus-sheet'];
  const savedScroll = scrollSel.map(sel => { const el = document.querySelector(sel); return el ? el.scrollTop : null; });
  // DÜZELTME: .root-mobile'ın yüksekliği sabit değil (min-height:100vh) — yani .lock-screen'in
  // kendi iç scroll'u (overflow-y:auto) aslında hiç devreye girmiyor, içerik viewport'tan
  // uzun olduğunda kaydırma SAYFA (window) seviyesinde oluyor. Yukarıdaki liste bunu hiç
  // kapsamıyordu — canlı sayaç her saniye tetiklediği render'da sayfa scroll'u telafi
  // edilmiyordu (özellikle Duruş panelinde, "onayla" butonuna ulaşmak için kaydırınca bir
  // sonraki tik'te tepeye sıçrama sorununun asıl kaynağı buydu).
  const savedWinScroll = window.scrollY;

  // Odak koruması: bir input/textarea'da yazarken herhangi bir yeniden çizim
  // o kutuyu sıfırdan oluşturup imleci/odağı kaybettirmesin diye, hangi kutuda
  // olduğumuzu ve imlecin nerede durduğunu kaydedip render sonrası geri koyuyoruz.
  const activeEl = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if(activeEl && (activeEl.tagName==='INPUT' || activeEl.tagName==='TEXTAREA') && activeEl.id){
    focusId = activeEl.id;
    try { selStart = activeEl.selectionStart; selEnd = activeEl.selectionEnd; } catch(e){}
  }

  if(!session){ app.innerHTML = renderLogin(); return; }
  app.innerHTML = session.isAdmin ? renderAdmin() : renderOperator();
  scrollSel.forEach((sel,i) => { if(savedScroll[i]!=null){ const el = document.querySelector(sel); if(el) el.scrollTop = savedScroll[i]; } });
  if(savedWinScroll>0) window.scrollTo(0, savedWinScroll);

  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }

  if(session && session.isAdmin && view==='analiz'){ initAnalizCharts(computeAnalizData(analizFrom, analizTo)); }
}
let analizTickCounter = 0;
// Firebase'den arka planda gelen HERHANGİ bir güncelleme (başka bir kullanıcının işlemi bile
// olsa) tüm ekranı yeniden çiziyordu — bu da o an açık olan bir <select>/<input> dropdown'ını ya
// da yazılmakta olan bir form alanını anında kapatıp sıfırlıyordu. Kullanıcı bir alanla aktif
// olarak uğraşırken (odaklanmış input/select/textarea varsa, ya da bilinen "düzenleme" durumları
// açıksa) otomatik render'ları erteliyoruz; odak/etkileşim bitince bir sonraki tetiklemede
// (periyodik tik ya da yeni bir Firebase güncellemesi) ekran zaten güncel hale gelir.
let lastPointerDownAt = 0;
document.addEventListener('pointerdown', ()=>{ lastPointerDownAt = Date.now(); }, true);
function isUserInteracting(){
  if(editingActiveId) return true;
  // DÜZELTME: Eskiden sadece "Diğer" yazarken meşgul sayılıyordu — panel açıkken (neden
  // seçerken, aşağı kaydırıp onay butonuna ulaşmaya çalışırken) ATÖLYEDEKİ BAŞKA BİR
  // OPERATÖRÜN herhangi bir işlemi (Firebase güncellemesi geldiğinde) ya da her saniye
  // tetiklenen canlı sayaç, ekranı sessizce yeniden çizip tam o anki kaydırma konumunu
  // bozabiliyordu — özellikle "aşağı kaydırırken tepeye sıçrama" şikayetinin en olası
  // kaynağı buydu. Artık panel TAMAMEN AÇIKKEN (neden seçilmiş olsun olmasın) hiçbir
  // arka plan yeniden çizimi araya girmiyor.
  if(durusOpen) return true;
  if(sendMsgOpen) return true;
  if(tadilatMakineSecimId) return true;
  const ae = document.activeElement;
  if(ae && ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)) return true;
  // Bir düğmeye tıklandığının hemen ardından (kısa bir "koruma penceresi" içinde) arka plandaki
  // otomatik yeniden çizimi erteliyoruz — yoksa tam o anda DOM değişip tıklamayı "yutabiliyor",
  // kullanıcı iki kere tıklamak zorunda kalıyordu.
  if(Date.now() - lastPointerDownAt < 500) return true;
  return false;
}
let pendingSafeRender = false;
function safeRender(){
  if(isUserInteracting()){ pendingSafeRender = true; return; }
  pendingSafeRender = false;
  render();
}
function renderLiveBits(){
  // Sadece kilit ekranındaki / matristeki canlı sayaçları güncellemek için tam render yeterli (veri seti küçük).
  // Ama bir form açıkken (düzenleme, duruş nedeni yazma, serbest mesaj, aktif input/select) tam render
  // odağı (focus) kaybettiriyor / açık dropdown'ı kapatıyor — o an atla.
  if(isUserInteracting()) return;
  if(activeDetailId || activeGroupId || (session && !session.isAdmin && (view==='list' || (view==='tadilat' && myActiveTadilatSession()))) || (session && session.isAdmin && (view==='matrix' || (view==='tadilatYonetim' && tadilatSubTab==='canli')))){ render(); return; }
  // Analiz'deki sayılar artık duraklamış işler için canlı hesaplanıyor, ama grafikleri (Chart.js)
  // her saniye yeniden çizmek titremeye sebep olur — o yüzden burayı daha seyrek (15 sn) yeniliyoruz.
  if(session && session.isAdmin && view==='analiz'){
    analizTickCounter++;
    if(analizTickCounter>=15){ analizTickCounter=0; render(); }
  }
}

/* ===================== BAŞLAT ===================== */
window.addEventListener('DOMContentLoaded', ()=>{
  document.documentElement.className = 'theme-'+resolvedTheme();
  try{ window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{ if(theme==='system'){ document.documentElement.className='theme-'+resolvedTheme(); render(); } }); }catch(e){}
  if(!fbConfigured()){
    document.getElementById('app').innerHTML = `<div class="root-mobile theme-${resolvedTheme()}"><div class="auth-wrap"><div class="error-text" style="max-width:400px;margin:0 auto">Firebase databaseURL henüz girilmemiş. Lütfen KURULUM_BULUT.md dosyasındaki adımları izleyip bu HTML dosyasının başındaki FIREBASE_CONFIG içine databaseURL'i yapıştırın.</div></div></div>`;
    return;
  }
  initFirebase();
  render();

  // K2 (klavye/duruş modalı): --kb, o an açık olan sanal klavyenin yüksekliğini tutan bir CSS
  // değişkeni. Sadece bunu yazıyor — hiçbir DOM'u yeniden çizmiyor, render()'ın scroll/focus
  // koruma mantığıyla hiç kesişmiyor. iOS'ta klavye layout viewport'unu küçültmediği için
  // (sadece görsel viewport'u kaydırır), position:fixed öğeler bunu otomatik hesaba katmaz —
  // bu değişken, .durus-modal-overlay/.durus-modal-panel'in klavyenin üstünde kalmasını sağlıyor.
  if(window.visualViewport){
    const vv = window.visualViewport;
    const syncKb = () => {
      const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb', kb + 'px');
    };
    vv.addEventListener('resize', syncKb);
    vv.addEventListener('scroll', syncKb);
    syncKb();
  }

  // Giriş ekranındayken, sayfanın herhangi bir yerinde (bir kutuya odaklanmış
  // olmasan bile) Enter'a basınca giriş yapmayı dener.
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !session){ doLogin(); }
  });
});
</script>

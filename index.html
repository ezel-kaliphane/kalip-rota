          const toplamMs = ops.reduce((s,o)=>s+((o.bitisTs&&o.baslamaTs)?(o.bitisTs-o.baslamaTs):0),0);
          const yapanlar = [...new Set(ops.map(o=>o.operatorName))].join(', ');
          const makineler = [...new Set(ops.map(o=>o.makine).filter(Boolean))].join(', ');
          const sonBitis = ops[ops.length-1]?.bitisTs;
          return `<tr>
            <td>${(t.atolye||'imalat')==='tadilat'?'🔧 Tadilat':'🏭 İmalat'}</td>
            <td class="mono" style="color:var(--accent)">${esc(t.uKodu)}</td>
            <td>${esc(t.adet||'—')}</td>
            <td style="font-size:12.5px">${esc(t.talepEdenKisi||'—')}</td>
            <td>${esc(t.bolum||'—')}</td>
            <td style="font-size:12.5px">${esc(t.aciklama)}</td>
            <td style="text-align:center">${ops.length}</td>
            <td style="font-size:12.5px">${esc(yapanlar||'—')}</td>
            <td style="font-size:12.5px">${esc(makineler||'—')}</td>
            <td>${fmtDur(toplamMs)}</td>
            <td>${sonBitis?fmtDT(sonBitis):'—'}</td>
          </tr>`;
        }).join('')}
      </tbody></table></div>
      </div>`;
    } else {
      body += `
      <div style="font-size:16px;font-weight:600;margin-bottom:6px">Tadilat Talepleri</div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:16px;max-width:900px">Operatörler bu listeden bekleyen bir talebi alıp çalışır. "Son Operasyon" işaretlenene kadar talep tekrar tekrar bekleyenlere düşebilir (çok operasyonlu tadilatlar için). Bitirdiklerinde, varsa duraklattıkları üretim işi otomatik olarak "${TADILAT_SONRASI_REASON}" duruşuna geçer.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start">
        <div>
          <div style="font-size:16px;font-weight:700;margin-bottom:14px">Yeni Tadilat Talebi</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
            <input id="tad-ukodu" class="mono" placeholder="U kodu" style="flex:1;min-width:120px;padding:12px 14px;font-size:14.5px">
            <input id="tad-adet" inputmode="numeric" placeholder="Adet" style="width:110px;padding:12px 14px;font-size:14.5px" oninput="this.value=this.value.replace(/\\D/g,'')">
          </div>
          <input id="tad-kisi" placeholder="Talep eden kişi (ad soyad)" style="margin-bottom:10px;padding:12px 14px;font-size:14.5px">
          <input id="tad-bolum" placeholder="Talep eden bölüm" style="margin-bottom:10px;padding:12px 14px;font-size:14.5px">
          ${myAtolyelerAdmin.length>1 ? `
          <select id="tad-atolye" style="margin-bottom:10px;padding:12px 14px;font-size:14.5px" onchange="tadilatFormAtolyeSet(this.value)">
            ${myAtolyelerAdmin.includes('imalat') ? `<option value="imalat" ${tadilatFormAtolyeGet()==='imalat'?'selected':''}>🏭 İmalat Atölye</option>` : ''}
            ${myAtolyelerAdmin.includes('tadilat') ? `<option value="tadilat" ${tadilatFormAtolyeGet()==='tadilat'?'selected':''}>🔧 Tadilat Atölye</option>` : ''}
          </select>` : `
          <input type="hidden" id="tad-atolye" value="${myAtolyelerAdmin[0]}">
          <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:10px">Atölye: ${myAtolyelerAdmin[0]==='tadilat'?'🔧 Tadilat Atölye':'🏭 İmalat Atölye'} <span style="opacity:.7">(tek atölyene açılıyor)</span></div>`}
          <textarea id="tad-aciklama" placeholder="Ne işlem yapılacak?" style="min-height:110px;margin-bottom:14px;padding:12px 14px;font-size:14.5px"></textarea>
          <button class="btn-primary" style="width:100%;padding:15px 0;font-size:15.5px" onclick="addTadilat()">+ Talep Oluştur</button>
        </div>
        <div style="max-height:calc(100vh - 300px);overflow-y:auto;padding-right:4px">
          ${myAtolyelerAdmin.map(a=>{
            const list = tadilatBekleyenler(a);
            return `<div style="font-size:13px;font-weight:600;margin-bottom:8px">${a==='tadilat'?'🔧 Tadilat Atölye':'🏭 İmalat Atölye'} — Bekleyen (${list.length})</div>
            <div style="margin-bottom:20px">
              ${list.length===0 ? `<div style="font-size:12.5px;color:var(--text-muted)">Bekleyen talep yok.</div>` : list.map(renderBekleyenCard).join('')}
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }
    body += `</div>`;
  } else {
    const entries = entriesArray();
    const statOperator = new Set(entries.map(e=>e.operatorUsername)).size;
    const statMakine = new Set(entries.map(e=>e.makine)).size;
    const fe = filteredEntries();
    reportVisibleIds = fe.map(e=>e.id);
    const completedRoutes = computeCompletedRouteIds();
    const toplamDurusMs = fe.reduce((s,e)=>s+effectiveDurusMs(e),0);
    body = `
      <div class="admin-stats">
        <span><b style="color:var(--accent)">${statOperator}</b> operatör kayıt girmiş</span>
        <span><b style="color:var(--accent)">${statMakine}</b> / ${allMachines().length} makine kullanılmış</span>
        <span><b style="color:var(--accent)">${entries.length}</b> toplam kayıt</span>
        <span><b style="color:var(--warn)">${fmtDur(toplamDurusMs)}</b> toplam duruş (filtreye göre)</span>
        <button class="btn-ghost" style="margin-left:auto" onclick="toggleMachineListView()">${showMachineList?'Makine Kodlarını Gizle':'Makine Kodlarını Göster'}</button>
      </div>
      ${toplamDurusMs>0 ? `<div style="padding:12px 24px;border-bottom:1px solid var(--border)">${renderDurusBreakdown(fe)}</div>` : ''}
      ${showMachineList ? `<div class="machine-grid" style="padding:12px 24px;border-bottom:1px solid var(--border)">${allMachines().map(m=>`<div class="machine-chip"><span class="mono" style="color:var(--accent);font-weight:700">${m.code}</span> ${esc(m.name)}</div>`).join('')}</div>` : ''}
      <div class="filter-bar" style="position:relative">
        <div style="position:relative">
          <button class="filter-input" style="cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px" onclick="toggleReportOperatorDropdown()">
            <span>${reportOperatorFilter.size===0?'Tüm Operatörler':`${reportOperatorFilter.size} Operatör Seçili`}</span>
            <span style="font-size:10px;color:var(--text-muted)">▼</span>
          </button>
          ${reportOperatorDropdownOpen ? `<div class="dropdown-panel">
            ${reportOperatorFilter.size>0 ? `<button class="btn-ghost" style="width:100%;margin-bottom:6px;font-size:12px" onclick="clearReportOperatorFilter()">✕ Seçimi Temizle</button>` : ''}
            ${operatorEntries.map(([code,v])=>`
              <label class="dropdown-item"><input type="checkbox" ${reportOperatorFilter.has(code)?'checked':''} onchange="toggleReportOperatorSelect('${code}')"><span>${code} · ${esc(v.displayName)}</span></label>
            `).join('')}
          </div>` : ''}
        </div>
        <input id="report-search-isemri" class="filter-input" placeholder="İş Emri No / Talep No ara…" value="${esc(reportFilter.isEmriNo)}" oninput="setReportFilterFieldLight('isEmriNo', this.value)">
        <div style="position:relative">
          <button class="filter-input" style="cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px" onclick="toggleReportMakineDropdown()">
            <span>${reportMakineFilter.size===0?'Tüm Makineler':`${reportMakineFilter.size} Makine Seçili`}</span>
            <span style="font-size:10px;color:var(--text-muted)">▼</span>
          </button>
          ${reportMakineDropdownOpen ? `<div class="dropdown-panel">
            ${reportMakineFilter.size>0 ? `<button class="btn-ghost" style="width:100%;margin-bottom:6px;font-size:12px" onclick="clearReportMakineFilter()">✕ Seçimi Temizle</button>` : ''}
            ${allMachines().map(m=>{ const label=`${m.code} · ${m.name}`; return `<label class="dropdown-item"><input type="checkbox" ${reportMakineFilter.has(label)?'checked':''} onchange="toggleReportMakineSelect('${esc(label)}')"><span>${esc(label)}</span></label>`; }).join('')}
          </div>` : ''}
        </div>
        <input type="date" class="filter-input" value="${esc(reportFilter.tarihFrom)}" onchange="setReportFilterField('tarihFrom', this.value)" title="Başlangıç">
        <input type="date" class="filter-input" value="${esc(reportFilter.tarihTo)}" onchange="setReportFilterField('tarihTo', this.value)" title="Bitiş">
        <button class="chip" onclick="setReportDatePreset(1)">Bugün</button>
        <button class="chip" onclick="setReportDatePreset(7)">Son 7 Gün</button>
        <button class="chip" onclick="setReportDatePreset(30)">Son 30 Gün</button>
        <button class="chip" onclick="setReportDatePreset(90)">Son 3 Ay</button>
        ${(reportOperatorFilter.size>0||reportFilter.isEmriNo||reportMakineFilter.size>0||reportFilter.tarihFrom||reportFilter.tarihTo) ? `<button class="btn-ghost" onclick="clearReportFilter()">✕ Temizle</button>` : ''}
        ${canDeleteReport() && reportSelectedIds.size>0 ? `<button class="btn-ghost" style="border-color:var(--danger);color:var(--danger)" onclick="deleteReportSelected()">🗑 Seçilenleri Sil (${reportSelectedIds.size})</button>` : ''}
        <button class="btn-primary" style="width:auto;margin-left:auto;padding:8px 16px" onclick="exportExcel()">⬇ Excel'e Aktar (${fe.length})</button>
      </div>
      <div class="table-wrap"><table><thead><tr>
        ${canDeleteReport() ? `<th style="width:26px"><input type="checkbox" ${reportVisibleIds.length>0 && reportVisibleIds.every(id=>reportSelectedIds.has(id))?'checked':''} onchange="toggleReportSelectAll()"></th>` : ''}
        ${["İş Emri No (U kodu)","İş Talep No","Operasyon No","Malzeme Adı","Malzeme Cinsi","Çap ve Boy","Adet","Makine","Operatör","Başlangıç","Bitiş","Süre","Durum","Not"].map(h=>`<th>${h}</th>`).join('')}
        ${canEditReport() ? `<th style="width:36px"></th>` : ''}
        ${canDeleteReport() ? `<th style="width:36px"></th>` : ''}
      </tr></thead><tbody>`;
    const reportColCount = 14 + (canDeleteReport()?1:0) + (canEditReport()?1:0);
    if(fe.length===0){ body += `<tr><td colspan="${reportColCount}" style="text-align:center;color:var(--text-muted);padding:30px">Filtreyle eşleşen kayıt yok.</td></tr>`; }
    fe.forEach(e=>{
      const isDone = completedRoutes.has(e.id);
      const statusColor = isDone ? 'var(--success)' : e.status==='devam'?'var(--accent)':e.status==='duruş'?'var(--warn)':'var(--success-soft)';
      const statusLabel = e.status==='devam'?'Devam Ediyor':e.status==='duruş'?'Duruşta':'Tamamlandı';
      const rowStyle = isDone ? 'background:var(--success-row)' : '';
      const malzAdi = getTalepInfo(e.talepNo)?.malzemeAdi || '';
      body += `<tr style="${rowStyle}">
        ${canDeleteReport() ? `<td><input type="checkbox" ${reportSelectedIds.has(e.id)?'checked':''} onchange="toggleReportSelect('${e.id}')"></td>` : ''}
        <td class="mono" style="color:var(--accent);cursor:pointer" onclick="openEntryDetail('${e.id}')">${esc(e.isEmriNo)} ${isDone?'✓':''}</td>
        <td class="mono">${esc(e.talepNo||'—')}</td>
        <td style="font-weight:700">${e._seq||'—'}</td>
        <td style="font-size:12.5px">${esc(malzAdi||'—')}</td>
        <td>${esc(e.malzemeCinsi||'—')}</td>
        <td>${esc(e.capBoy||'—')}</td>
        <td>${esc(e.adet||'—')}</td>
        <td>${esc(e.makine||'—')}</td>
        <td>${esc(e.operatorUsername)} · ${esc(e.operatorName)}</td>
        <td>${fmtDT(e.startTs)}</td>
        <td>${e.endTs?fmtDT(e.endTs):'—'}</td>
        <td>${e.endTs?fmtDur(e.endTs-e.startTs):'—'}</td>
        <td><span style="color:${statusColor};font-weight:600">${isDone?'Rota Tamamlandı':statusLabel}</span></td>
        <td style="color:var(--text-muted);font-style:italic">${esc(e.not||'')}</td>
        ${canEditReport() ? `<td><button class="del-btn" onclick="openReportEdit('${e.id}')" title="Düzelt">✏️</button></td>` : ''}
        ${canDeleteReport() ? `<td><button class="del-btn" onclick="deleteReportRecord('${e.id}')" title="Sil">🗑</button></td>` : ''}
      </tr>`;
    });
    body += `</tbody></table></div>${entryDetailId ? renderEntryDetailModal() : ''}${reportEditId ? renderReportEditModal() : ''}`;
  }

  return `<div class="root-wide theme-${theme}">${header}${body}${machineModal ? renderMachineModal() : ''}</div>`;
}
function setReportFilterFieldLight(field, val){ reportFilter[field]=val; renderTableOnly(); }
function renderTableOnly(){ render(); } // basit yaklaşım: filtre değişince tam yeniden çizim yeterli hızda çalışır

/* ===================== ANA RENDER ===================== */
function render(){
  const app = document.getElementById('app');
  // Periyodik (saniyelik) yeniden çizim, açık bir modal veya tablo varsa kaydırma
  // konumunu sıfırlamasın diye önce mevcut scroll konumlarını kaydediyoruz.
  const scrollSel = ['.modal-body', '.table-wrap', '.body-pad', '.completed-wrap', '.matrix-wrap', '.settings-wrap'];
  const savedScroll = scrollSel.map(sel => { const el = document.querySelector(sel); return el ? el.scrollTop : null; });

  // Odak koruması: bir input/textarea'da yazarken herhangi bir yeniden çizim
  // o kutuyu sıfırdan oluşturup imleci/odağı kaybettirmesin diye, hangi kutuda
  // olduğumuzu ve imlecin nerede durduğunu kaydedip render sonrası geri koyuyoruz.
  const activeEl = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if(activeEl && (activeEl.tagName==='INPUT' || activeEl.tagName==='TEXTAREA') && activeEl.id){
    focusId = activeEl.id;
    try { selStart = activeEl.selectionStart; selEnd = activeEl.selectionEnd; } catch(e){}
  }

  if(!session){ app.innerHTML = renderLogin(); return; }
  app.innerHTML = session.isAdmin ? renderAdmin() : renderOperator();
  scrollSel.forEach((sel,i) => { if(savedScroll[i]!=null){ const el = document.querySelector(sel); if(el) el.scrollTop = savedScroll[i]; } });

  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }

  if(session && session.isAdmin && view==='analiz'){ initAnalizCharts(computeAnalizData(analizFrom, analizTo)); }
}
let analizTickCounter = 0;
// Firebase'den arka planda gelen HERHANGİ bir güncelleme (başka bir kullanıcının işlemi bile
// olsa) tüm ekranı yeniden çiziyordu — bu da o an açık olan bir <select>/<input> dropdown'ını ya
// da yazılmakta olan bir form alanını anında kapatıp sıfırlıyordu. Kullanıcı bir alanla aktif
// olarak uğraşırken (odaklanmış input/select/textarea varsa, ya da bilinen "düzenleme" durumları
// açıksa) otomatik render'ları erteliyoruz; odak/etkileşim bitince bir sonraki tetiklemede
// (periyodik tik ya da yeni bir Firebase güncellemesi) ekran zaten güncel hale gelir.
let lastPointerDownAt = 0;
document.addEventListener('pointerdown', ()=>{ lastPointerDownAt = Date.now(); }, true);
function isUserInteracting(){
  if(editingActiveId) return true;
  if(durusOpen && durusReasonSel==='Diğer') return true;
  if(sendMsgOpen) return true;
  if(tadilatMakineSecimId) return true;
  const ae = document.activeElement;
  if(ae && ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)) return true;
  // Bir düğmeye tıklandığının hemen ardından (kısa bir "koruma penceresi" içinde) arka plandaki
  // otomatik yeniden çizimi erteliyoruz — yoksa tam o anda DOM değişip tıklamayı "yutabiliyor",
  // kullanıcı iki kere tıklamak zorunda kalıyordu.
  if(Date.now() - lastPointerDownAt < 500) return true;
  return false;
}
function safeRender(){ if(!isUserInteracting()) render(); }
function renderLiveBits(){
  // Sadece kilit ekranındaki / matristeki canlı sayaçları güncellemek için tam render yeterli (veri seti küçük).
  // Ama bir form açıkken (düzenleme, duruş nedeni yazma, serbest mesaj, aktif input/select) tam render
  // odağı (focus) kaybettiriyor / açık dropdown'ı kapatıyor — o an atla.
  if(isUserInteracting()) return;
  if(activeDetailId || activeGroupId || (session && !session.isAdmin && (view==='list' || (view==='tadilat' && myActiveTadilatSession()))) || (session && session.isAdmin && (view==='matrix' || (view==='tadilatYonetim' && tadilatSubTab==='canli')))){ render(); return; }
  // Analiz'deki sayılar artık duraklamış işler için canlı hesaplanıyor, ama grafikleri (Chart.js)
  // her saniye yeniden çizmek titremeye sebep olur — o yüzden burayı daha seyrek (15 sn) yeniliyoruz.
  if(session && session.isAdmin && view==='analiz'){
    analizTickCounter++;
    if(analizTickCounter>=15){ analizTickCounter=0; render(); }
  }
}

/* ===================== BAŞLAT ===================== */
window.addEventListener('DOMContentLoaded', ()=>{
  document.documentElement.className = 'theme-'+theme;
  if(!fbConfigured()){
    document.getElementById('app').innerHTML = `<div class="root-mobile theme-${theme}"><div class="auth-wrap"><div class="error-text" style="max-width:400px;margin:0 auto">Firebase databaseURL henüz girilmemiş. Lütfen KURULUM_BULUT.md dosyasındaki adımları izleyip bu HTML dosyasının başındaki FIREBASE_CONFIG içine databaseURL'i yapıştırın.</div></div></div>`;
    return;
  }
  initFirebase();
  render();

  // Giriş ekranındayken, sayfanın herhangi bir yerinde (bir kutuya odaklanmış
  // olmasan bile) Enter'a basınca giriş yapmayı dener.
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !session){ doLogin(); }
  });
});
</script>
</body>
</html>

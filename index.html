<script>
/* ===================== SABİT VERİLER ===================== */
const MACHINE_LIST = [
  { code:"UF01", name:"Freze" }, { code:"SM01", name:"Sütun Matkap" },
  { code:"TE01", name:"Tel Erezyon Sodick" }, { code:"TE02", name:"Tel Erezyon Sammlite" },
  { code:"TES01", name:"Testere" }, { code:"DDTE01", name:"Delik Delme Tel Erozyon" },
  { code:"KM01", name:"Kumlama Makinası" }, { code:"PT01", name:"Parlatma Tezgahı" },
  { code:"PT02", name:"Parlatma Tezgahı" }, { code:"KCM01", name:"Kılavuz Makinesi" },
  { code:"ODT01", name:"Silindirik Taşlama" }, { code:"ODT02", name:"Silindirik Taşlama" },
  { code:"ODT03", name:"Silindirik Taşlama" }, { code:"P01", name:"Pres" },
  { code:"DE01", name:"Dalma Erezyon" }, { code:"DE02", name:"Dalma Erezyon" },
  { code:"DE03", name:"Dalma Erezyon" }, { code:"F01", name:"Fırın" }, { code:"F02", name:"Fırın" },
  { code:"C02", name:"CNC Dik İşleme Merkezi" }, { code:"C01", name:"CNC Torna" },
  { code:"UST01", name:"Satıh Taşlama" }, { code:"UST02", name:"Satıh Taşlama" },
  { code:"UT01", name:"Torna" }, { code:"UT02", name:"Torna" }, { code:"UT03", name:"Torna" },
  { code:"FII01", name:"Fason Isıl İşlem" }, { code:"SAL01", name:"Şaloma" },
];
const machineLabelFor = c => { const m = MACHINE_LIST.find(x=>x.code===c); return m ? `${m.code} · ${m.name}` : ""; };
const ALL_MACHINE_CODES = MACHINE_LIST.map(m=>m.code);

// NOT: Buradaki eski sabit operatör/şifre listesi kaldırıldı — Firebase'e bir kere
// yazıldıktan sonra kaynak kodda durmasının hiçbir faydası yoktu, sadece herkesin
// "Sayfa Kaynağını Görüntüle" ile şifreleri (ADMIN dahil) okuyabilmesine yol açıyordu.
// Yeni operatörler artık Ayarlar → "+ Kullanıcı Ekle" panelinden eklenir.

const DURUS_REASONS = ["Arıza / Bakım","Malzeme Bekleniyor","Kalıp/Takım Değişimi","Program/Ayar Değişimi","Kalite Kontrol Bekleniyor","Elektrik/Basınçlı Hava Kesintisi","Operatör Molası","Farklı İş Emrine Geçiş","Tuvalet","Gün Sonu (Mesai Bitti, yarın devam edilecek)","Diğer"];
const GUN_SONU_REASON = "Gün Sonu (Mesai Bitti, yarın devam edilecek)";

/* ===================== YARDIMCI FONKSİYONLAR ===================== */
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDT = ts => new Date(ts).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
const fmtDur = ms => { const m=Math.round(ms/60000); return m<60?`${m} dk`:`${Math.floor(m/60)} sa ${m%60} dk`; };
const fmtElapsed = ms => { const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; const p=n=>String(n).padStart(2,"0"); return h>0?`${p(h)}:${p(m)}:${p(sec)}`:`${p(m)}:${p(sec)}`; };
const dateKey = ts => new Date(ts).toISOString().slice(0,10);

function saveEditActive(id){
  const before = STATE.entries[id] || {};
  const isEmriNo = (document.getElementById('edit-isemri').value||'').trim();
  const malzemeCinsi = (document.getElementById('edit-malzeme-cinsi').value||'').trim();
  const capBoy = (document.getElementById('edit-cap-boy').value||'').trim();
  const adet = (document.getElementById('edit-adet').value||'').trim();
  const not = (document.getElementById('edit-not').value||'').trim();
  const sonOperasyon = !!document.getElementById('edit-son-operasyon')?.checked;
  if(!isEmriNo){ toast('İş Emri No boş olamaz'); return; }
  if(Object.keys(STATE.validIsEmri||{}).length>0 && !STATE.validIsEmri[isEmriNo.toUpperCase()]){
    toast('Bu iş emri bulunamadı, lütfen kodunuzu kontrol edin'); return;
  }
  if(!adet){ toast('Adet boş olamaz'); return; }
  if(!/^\d+$/.test(adet)){ toast('Adet sadece rakam olmalı'); return; }

  const fieldLabels = { isEmriNo:'İş Emri No', malzemeCinsi:'Malzeme Cinsi', capBoy:'Çap ve Boy', adet:'Adet', not:'Not', sonOperasyon:'Son Operasyon' };
  const after = { isEmriNo, malzemeCinsi, capBoy, adet, not, sonOperasyon };
  const changes = [];
  Object.keys(fieldLabels).forEach(f=>{
    const oldV = f==='sonOperasyon' ? (before[f]?'Evet':'Hayır') : (before[f]||'');
    const newV = f==='sonOperasyon' ? (after[f]?'Evet':'Hayır') : (after[f]||'');
    if(oldV !== newV) changes.push({ field: fieldLabels[f], oldValue: oldV||'—', newValue: newV||'—' });
  });

  DB.ref('entries/'+id).update(after);

  if(changes.length>0){
    const mid = uid();
    DB.ref('messages/'+mid).set({
      type: 'edit', isEmriNo: before.isEmriNo, operatorUsername: session.username, operatorName: session.displayName,
      makine: before.makine||'', changes, ts: Date.now(), read: false
    });
  }

  toast('Güncellendi');
  editingActiveId = null;
  render();
}

function fbConfigured(){ return FIREBASE_CONFIG.databaseURL && FIREBASE_CONFIG.databaseURL.indexOf('BURAYA')<0; }
function initFirebase(){
  if(typeof firebase==='undefined'){ console.warn('Firebase SDK yüklenemedi (internet yok mu?)'); return false; }
  if(!fbConfigured()){ console.warn('Firebase databaseURL girilmemiş'); return false; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    DB = firebase.database();
    FB_OK = true;
    DB.ref('.info/connected').on('value', snap=>{
      connOK = snap.val() === true;
      render();
    });
    DB.ref('operators').on('value', snap=>{
      STATE.operators = snap.val() || {};
      seedIfNeeded();
      render();
    });
    DB.ref('entries').on('value', snap=>{
      STATE.entries = snap.val() || {};
      render();
    });
    DB.ref('machines_extra').on('value', snap=>{
      extraMachines = snap.val() || {};
      render();
    });
    DB.ref('machines_hidden').on('value', snap=>{
      hiddenMachines = snap.val() || {};
      render();
    });
    DB.ref('messages').on('value', snap=>{
      STATE.messages = snap.val() || {};
      render();
    });
    DB.ref('validIsEmri').on('value', snap=>{
      STATE.validIsEmri = snap.val() || {};
      render();
    });
    return true;
  }catch(e){ console.warn('Firebase init hatası', e); return false; }
}

function doLogin(){
  const uname = (document.getElementById('login-username').value||'').trim().toUpperCase();
  const pass = document.getElementById('login-password').value||'';
  const remember = !!document.getElementById('login-remember')?.checked;
  const op = STATE.operators[uname];
  if(!op || op.password !== pass){
    loginError = 'Kullanıcı adı veya şifre hatalı';
    toast(loginError);
    render();
    return;
  }
  loginError = '';
  session = { username: uname, displayName: op.displayName, isAdmin: !!op.isAdmin, isSuperAdmin: !!op.isSuperAdmin, isSef: !!op.isSef };
  if(remember){ save('rota_remember', true); save('rota_session', session); }
  else { save('rota_remember', false); save('rota_session', null); }
  view = session.isAdmin ? (session.isSef ? 'matrix' : 'report') : 'list';
  if(!session.isAdmin) newForm.makine = op.defaultMachine || '';
  render();
}

function myActiveEntries(){
  if(!session || session.isAdmin) return [];
  return entriesArray().filter(e => e.operatorUsername===session.username && (e.status==='devam'||e.status==='duruş')).sort((a,b)=>a.startTs-b.startTs);
}
function getAllowedMachines(){
  if(!session || session.isAdmin) return allMachines().map(m=>`${m.code} · ${m.name}`);
  const op = STATE.operators[session.username] || {};
  const allowedCodes = op.allowedMachines ? Object.keys(op.allowedMachines).filter(k=>op.allowedMachines[k]) : allMachineCodes();
  return allMachines().filter(m=>allowedCodes.includes(m.code)).map(m=>`${m.code} · ${m.name}`);
}

function baslat(){
  const makine = document.getElementById('nf-makine').value||'';
  const malzemeCinsi = (document.getElementById('nf-malzeme-cinsi').value||'').trim();
  const capBoy = (document.getElementById('nf-cap-boy').value||'').trim();
  const not = (document.getElementById('nf-not').value||'').trim();
  const sonOperasyon = !!document.getElementById('nf-son-operasyon')?.checked;
  const canCoklu = !!(STATE.operators[session.username]||{}).cokluIsEmri;

  if(!getAllowedMachines().includes(makine)){ toast('Listeden geçerli bir makine seçin'); return; }

  if(canCoklu && newForm.cokluMode){
    // Çoklu İş Emri: aynı makinede, aynı anda birden fazla İş Emri No — her birinin kendi adediyle
    const items = newForm.cokluItems.map((it,i)=>({
      isEmriNo: (document.getElementById('nf-coklu-isemri-'+i)?.value||'').trim(),
      adet: (document.getElementById('nf-coklu-adet-'+i)?.value||'').trim()
    }));
    if(items.length===0){ toast('En az bir İş Emri No girin'); return; }
    for(const it of items){
      if(!it.isEmriNo){ toast('Tüm İş Emri No alanlarını doldurun'); return; }
      if(!it.adet){ toast('Tüm Adet alanlarını doldurun'); return; }
      if(!/^\d+$/.test(it.adet)){ toast('Adet sadece rakam olmalı'); return; }
      if(Object.keys(STATE.validIsEmri||{}).length>0 && !STATE.validIsEmri[it.isEmriNo.toUpperCase()]){
        toast(`"${it.isEmriNo}" bulunamadı, lütfen kodunuzu kontrol edin`); return;
      }
    }
    const groupId = uid();
    items.forEach(it=>{
      const id = uid();
      const entry = { isEmriNo: it.isEmriNo, makine, malzemeCinsi, capBoy, adet: it.adet, not, sonOperasyon, operatorUsername:session.username, operatorName:session.displayName, startTs:Date.now(), endTs:null, status:'devam', duruşToplamMs:0, excludedMs:0, groupId };
      DB.ref('entries/'+id).set(entry);
    });
    toast(`${items.length} iş emri birlikte başlatıldı`);
    newForm = { isEmriNo:'', makine: (STATE.operators[session.username]||{}).defaultMachine || '', malzemeCinsi:'', capBoy:'', adet:'', not:'', sonOperasyon:false, cokluMode:false, cokluItems:[{isEmriNo:'',adet:''},{isEmriNo:'',adet:''}] };
    activeGroupId = groupId;
    activeDetailId = null;
    view = 'list';
    render();
    return;
  }

  // Tekli mod (varsayılan)
  const isEmriNo = (document.getElementById('nf-isemri').value||'').trim();
  const adet = (document.getElementById('nf-adet').value||'').trim();
  const allowMulti = !!(STATE.operators[session.username]||{}).multiJob;
  if(!allowMulti && myActiveEntries().length>0){ toast('Bu hesap aynı anda tek iş açabilir. Önce mevcut işi bitirmelisin.'); return; }
  if(!isEmriNo){ toast('İş Emri No girin'); return; }
  if(!adet){ toast('Adet girin'); return; }
  if(!/^\d+$/.test(adet)){ toast('Adet sadece rakam olmalı'); return; }
  if(Object.keys(STATE.validIsEmri||{}).length>0 && !STATE.validIsEmri[isEmriNo.toUpperCase()]){
    toast('Bu iş emri bulunamadı, lütfen kodunuzu kontrol edin'); return;
  }
  const machineBusy = entriesArray().some(e => e.makine === makine && e.status === 'devam');
  if(machineBusy){ toast('Bu makinede zaten aktif bir iş var. Önce o iş bitirilmeli ya da duraklatılmalı.'); return; }
  const id = uid();
  const entry = { isEmriNo, makine, malzemeCinsi, capBoy, adet, not, sonOperasyon, operatorUsername:session.username, operatorName:session.displayName, startTs:Date.now(), endTs:null, status:'devam', duruşToplamMs:0, excludedMs:0 };

function groupMembersOf(groupId){ return entriesArray().filter(e=>e.groupId===groupId && (e.status==='devam'||e.status==='duruş')); }
function duraklatGrup(groupId){
  const reason = durusReasonSel==='Diğer' ? (document.getElementById('durus-custom')?.value||'').trim() : durusReasonSel;
  if(!reason){ toast('Duruş nedeni seçmelisin'); return; }

  groupMembersOf(groupId).forEach(e=>{
    DB.ref('entries/'+e.id).update({ status:'duruş', duruşNedeni: reason, duruşTs: now });
  });
  toast('Tüm iş emirleri duraklatıldı');
  durusOpen=false; durusReasonSel=''; durusCustom='';
}
function devamGrup(groupId){
  const members = groupMembersOf(groupId);
  if(members.length===0) return;
  const makine = members[0].makine;
  const machineBusy = entriesArray().some(o => o.groupId!==groupId && o.makine===makine && o.status==='devam');
  if(machineBusy){ toast('Bu makinede zaten aktif başka bir iş var. Önce onu bitir ya da duraklat.'); return; }
  const now = Date.now();
  members.forEach(e=>{
    const extra = e.duruşTs ? (now - e.duruşTs) : 0;
    const isGunSonu = e.duruşNedeni===GUN_SONU_REASON;
    const duruşToplamMs = (e.duruşToplamMs||0) + (isGunSonu?0:extra);
    const excludedMs = (e.excludedMs||0) + (isGunSonu?extra:0);
    DB.ref('entries/'+e.id).update({ status:'devam', duruşNedeni:'', duruşToplamMs, excludedMs });
  });
  toast('Tüm iş emirleri devam ediyor');
}
function bitirGrup(groupId){
  const members = groupMembersOf(groupId);
  if(members.length===0) return;
  const now = Date.now();
  // Duraklatılmışsa önce ortak duruş süresini kapat (Gün Sonu hariç tutma kuralı aynı şekilde uygulanır).
  const withDurus = members.map(e=>{
    let extra = 0;
    if(e.status==='duruş' && e.duruşTs) extra = now - e.duruşTs;
    const isGunSonu = e.duruşNedeni===GUN_SONU_REASON;
    return { e, duruşToplamMs: (e.duruşToplamMs||0) + (isGunSonu?0:extra), excludedMs: (e.excludedMs||0) + (isGunSonu?extra:0) };
  });
  const totalAdet = withDurus.reduce((s,x)=>s+(Number(x.e.adet)||0), 0);
  const n = withDurus.length;
  withDurus.forEach(x=>{
    const share = totalAdet>0 ? (Number(x.e.adet)||0)/totalAdet : 1/n;
    const wallMs = now - x.e.startTs;
    const allocatedWallMs = Math.round(wallMs*share);
    const allocatedDurusMs = Math.round(x.duruşToplamMs*share);
    const allocatedExcludedMs = Math.round(x.excludedMs*share);
    DB.ref('entries/'+x.e.id).update({
      endTs: x.e.startTs + allocatedWallMs,
      status: 'tamamlandi',
      duruşToplamMs: allocatedDurusMs,
      excludedMs: allocatedExcludedMs
    });
  });
  toast('Tüm iş emirleri tamamlandı');
  activeGroupId = null; view='list'; render();
}

function uploadIsEmriListesi(){
  if(!canManageIsEmriList()) return;
  const fileInput = document.getElementById('isemri-file-input');
  const file = fileInput?.files?.[0];
  const statusEl = document.getElementById('isemri-upload-status');
  const colName = (document.getElementById('isemri-col-name')?.value||'Malzeme kodu').trim().toLowerCase();
  if(!file){ toast('Bir dosya seçin'); return; }
  if(statusEl) statusEl.textContent = 'Okunuyor…';
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheetName = wb.SheetNames.find(n => n.toUpperCase().includes('İŞ EMRİ') || n.toUpperCase().includes('IS EMRI')) || wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      if(rows.length===0){ if(statusEl) statusEl.textContent='Dosya boş görünüyor.'; return; }
      const header = rows[0].map(h=>String(h||'').trim().toLowerCase());
      let colIdx = header.findIndex(h => h===colName);
      if(colIdx===-1) colIdx = header.findIndex(h => h.includes(colName));
      if(colIdx===-1){ if(statusEl) statusEl.textContent = `"${colName}" başlıklı sütun bulunamadı (sayfa: ${sheetName}). Sütun adını kontrol edin.`; return; }
      const codes = {};
      for(let i=1;i<rows.length;i++){
        const v = rows[i][colIdx];
        if(v==null) continue;
        const s = String(v).trim().toUpperCase();
        if(s) codes[s] = true;
      }
      const codeCount = Object.keys(codes).length;
      if(codeCount===0){ if(statusEl) statusEl.textContent = 'Sütunda hiç veri bulunamadı.'; return; }
      DB.ref('validIsEmri').set(codes).then(()=>{
        toast(`${codeCount} İş Emri No yüklendi`);
        if(statusEl) statusEl.textContent = `${codeCount} kayıt başarıyla yüklendi (sayfa: ${sheetName}).`;
        fileInput.value = '';
      });
    } catch(err){
      console.warn(err);
      if(statusEl) statusEl.textContent = 'Dosya okunamadı, .xlsx formatında olduğundan emin olun.';
    }
  };
  reader.readAsArrayBuffer(file);
}

function computeAnalizData(fromDate, toDate){
  const rangeEntries = entriesArray().filter(e => { const dk = dateKey(e.startTs); return dk>=fromDate && dk<=toDate; });
  const isSingleDay = fromDate===toDate;
  const dayStartMs = isSingleDay ? new Date(fromDate+'T00:00:00').getTime() : null;

  const byMachine = {};
  rangeEntries.forEach(e=>{
    const dk = dateKey(e.startTs);
    if(!byMachine[e.makine]) byMachine[e.makine] = { entries: [], operators: new Set(), byDay: {} };
    byMachine[e.makine].entries.push(e);
    byMachine[e.makine].operators.add(`${e.operatorUsername} · ${e.operatorName}`);
    (byMachine[e.makine].byDay[dk] ||= []).push(e);
  });

  const overtimeList = [];
  const perMachine = Object.entries(byMachine).map(([label, data])=>{
    let workMs = 0, durusMs = 0, overtimeMs = 0, availMs = 0;
    Object.entries(data.byDay).forEach(([dk, dayList])=>{
      const dStartMs = new Date(dk+'T00:00:00').getTime();
      const cutoffMs = dStartMs + WORKDAY_END_MINUTE*60000;
      let dayOvertimeMs = 0;
      dayList.forEach(e=>{
        const endClip = e.endTs || nowTick;
        const wallMs = Math.max(0, endClip - e.startTs);
        const eDurusMs = e.duruşToplamMs || 0;
        const eExcludedMs = e.excludedMs || 0;
        workMs += Math.max(0, wallMs - eDurusMs - eExcludedMs);
        durusMs += eDurusMs;
        // Şu an duraklatılmış (ör. gün sonu bekleyen) bir iş "hâlâ çalışıyor" sayılıp
        // fazla mesai üretmesin — mesai aşımı sadece fiilen devam eden işler için hesaplanır.
        if(e.status!=='duruş' && endClip > cutoffMs){
          const otMs = endClip - Math.max(cutoffMs, e.startTs);
          if(otMs > 0){
            dayOvertimeMs += otMs;
            overtimeList.push({ makine: label, operatorUsername: e.operatorUsername, operatorName: e.operatorName, isEmriNo: e.isEmriNo, overtimeMin: Math.round(otMs/60000), tarih: dk });
          }
        }
      });
      overtimeMs += dayOvertimeMs;
      availMs += WORKDAY_MINUTES*60000 + dayOvertimeMs; // her kullanılan gün için 540 dk + o günün fazla mesaisi
    });
    const workMin = Math.round(workMs/60000);
    const durusMin = Math.round(durusMs/60000);
    const overtimeMin = Math.round(overtimeMs/60000);
    const availMin = Math.round(availMs/60000);
    const verimlilik = availMin>0 ? Math.min(100, Math.round((workMin/availMin)*100)) : 0;
    return { label, code: label.split(' · ')[0], name: label.split(' · ')[1]||'', operators: [...data.operators], entries: data.entries, workMin, durusMin, overtimeMin, availMin, verimlilik, daysUsed: Object.keys(data.byDay).length };
  }).sort((a,b)=>b.workMin-a.workMin);

  const totals = perMachine.reduce((t,m)=>({
    workMin: t.workMin+m.workMin, durusMin: t.durusMin+m.durusMin, overtimeMin: t.overtimeMin+m.overtimeMin, availMin: t.availMin+m.availMin
  }), {workMin:0, durusMin:0, overtimeMin:0, availMin:0});
  totals.verimlilik = totals.availMin>0 ? Math.min(100, Math.round((totals.workMin/totals.availMin)*100)) : 0;
  totals.bostaMin = Math.max(0, totals.availMin - totals.workMin - totals.durusMin);

  return { perMachine, totals, overtimeList, isSingleDay, dayStartMs, fromDate, toDate };
}

// her İş Emri No'nun kayıtlarını kronolojik sırayla "tur"lara bölüyoruz. Bir tur,
// sonOperasyon=true VE status='tamamlandi' olan kayıtla kapanır. Kapanan turdaki
// tüm kayıtlar "tamamlanmış rota" sayılır; o turdan SONRA gelen yeni kayıtlar
// otomatik olarak yepyeni, boş bir tur başlatır — eskisinden bağımsız kalır.
function computeCompletedRoutes(){
  const byIsEmri = {};
  entriesArray().forEach(e=>{ (byIsEmri[e.isEmriNo] ||= []).push(e); });
  const routes = [];
  Object.entries(byIsEmri).forEach(([isEmriNo,list])=>{
    list.sort((a,b)=>a.startTs-b.startTs);
    let segment = [];
    list.forEach(e=>{
      segment.push(e);
      if(e.sonOperasyon && e.status==='tamamlandi'){
        routes.push({ isEmriNo, entries: segment.slice(), finishedAt: e.endTs, startedAt: segment[0].startTs });
        segment = [];
      }
    });
  });
  routes.sort((a,b)=> b.finishedAt - a.finishedAt); // en son tamamlanan üstte
  return routes;
}
function renderDurusBreakdown(entries){
  const byReason = {};
  entries.forEach(e=>{
    if((e.duruşToplamMs||0) <= 0) return;
    const r = e.duruşNedeni || 'Belirtilmemiş';
    byReason[r] = (byReason[r]||0) + e.duruşToplamMs;
  });
  const rows = Object.entries(byReason).sort((a,b)=>b[1]-a[1]);
  if(rows.length===0) return '';
  return `<div style="margin-bottom:16px">
    <div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Duruş Nedenlerine Göre Dağılım</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      ${rows.map(([reason,ms])=>`<div class="chip" style="color:var(--warn);border-color:var(--warn)55;background:#facc1518">${esc(reason)}: <b>${fmtDur(ms)}</b></div>`).join('')}
    </div>
  </div>`;
}
function computeCompletedRouteIds(){
  const ids = new Set();
  computeCompletedRoutes().forEach(r=>r.entries.forEach(e=>ids.add(e.id)));
  return ids;
}

function filteredEntries(){
  const sm = seqMap();
  return entriesArray().filter(e=>{
    if(reportOperatorFilter.size>0 && !reportOperatorFilter.has(e.operatorUsername)) return false;
    if(reportFilter.isEmriNo && !e.isEmriNo.toLowerCase().includes(reportFilter.isEmriNo.toLowerCase())) return false;
    if(reportMakineFilter.size>0 && !reportMakineFilter.has(e.makine)) return false;
    if(reportFilter.tarihFrom && dateKey(e.startTs) < reportFilter.tarihFrom) return false;
    if(reportFilter.tarihTo && dateKey(e.startTs) > reportFilter.tarihTo) return false;
    return true;
  }).map(e=>({...e, _seq: sm[e.id]||''})).sort((a,b)=>b.startTs-a.startTs);
}
function exportExcel(){
  const rows = filteredEntries().map(e=>({
    "İş Emri No": e.isEmriNo, "Operasyon No": e._seq, "Malzeme Cinsi": e.malzemeCinsi, "Çap ve Boy": e.capBoy, "Adet": e.adet, "Makine Kodu": (e.makine||'').split(' · ')[0]||'', "Makine Adı": (e.makine||'').split(' · ')[1]||'',
    "Operatör Kodu": e.operatorUsername, "Operatör Adı": e.operatorName,

    "Duruş Nedeni": e.duruşNedeni||"", "Not": e.not,
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();

  XLSX.writeFile(wb, `rota_disaaktarim_${new Date().toISOString().slice(0,10)}.xlsx`);

function renderMachineModal(){

    if(!byDayAll[dk]) byDayAll[dk] = {count:0, ms:0, jobs:new Set()};

function renderRouteModal(){
  const route = computeCompletedRoutes().find(r => r.isEmriNo===routeModal.isEmriNo && r.finishedAt===routeModal.finishedAt);

  const malz = route.entries.find(e=>e.malzemeCinsi||e.capBoy) || {};
  const malzText = [malz.malzemeCinsi, malz.capBoy].filter(Boolean).join(' · ');

  const grandTotalMs = route.entries.reduce((s,e)=>s+(e.endTs?(e.endTs-e.startTs):0),0);
  const grandDurusMs = route.entries.reduce((s,e)=>s+(e.duruşToplamMs||0),0);
  const grandExcludedMs = route.entries.reduce((s,e)=>s+(e.excludedMs||0),0);
  const grandNetMs = grandTotalMs - grandDurusMs - grandExcludedMs;

      if(e.groupId){
        if(seenGroups.has(e.groupId)) return;
        seenGroups.add(e.groupId);
        groups.push({ groupId: e.groupId, members: mine.filter(x=>x.groupId===e.groupId) });

        groups.push({ groupId: null, members: [e] });

    });
    body = `<div class="body-pad">`;
    if(groups.length===0) body += `<div style="text-align:center;color:var(--text-muted);padding:40px 0">Henüz aktif işlem yok.<br><span style="font-size:12px">"+ Yeni Kayıt" ile bir makine başlat.</span></div>`;
    groups.forEach(g=>{
      if(g.members.length===1){
        const e = g.members[0];

        body += `<div class="card" style="cursor:pointer" onclick="openActiveDetail('${e.id}')">
          <div class="card-header"><span class="card-id">${esc(e.isEmriNo)}</span><span class="matrix-dot" style="background:${dotColor};width:9px;height:9px;border-radius:50%;display:inline-block"></span></div>

          <div class="op-foot">${subInfo}${e.adet?` · Adet: ${esc(e.adet)}`:''}</div>
        </div>`;
      } else {
        const makine = g.members[0].makine;
        const anyDurus = g.members.some(m=>m.status==='duruş');
        const dotColor = anyDurus ? 'var(--warn)' : 'var(--success)';
        body += `<div class="card" style="cursor:pointer" onclick="openGroupDetail('${g.groupId}')">
          <div class="card-header"><span class="card-id">${g.members.length} İş Emri Aktif</span><span class="matrix-dot" style="background:${dotColor};width:9px;height:9px;border-radius:50%;display:inline-block"></span></div>
          <div class="op-top" style="margin-bottom:6px"><span class="op-code">${esc(makine)}</span></div>
          <div class="op-foot">${g.members.map(m=>`${esc(m.isEmriNo)} (${m.status==='duruş'?'duruşta':fmtElapsed(nowTick-m.startTs)})`).join(', ')}</div>
        </div>`;
      }
    });
    body += `</div>`;
  }

  return `<div class="root-mobile theme-${theme}">${header}${body}${messagesModalOpen ? renderMessagesModal() : ''}${sendMsgOpen ? renderSendMessageModal() : ''}</div>`;
}

          <label style="display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px;cursor:pointer">
            <input id="new-op-sef" type="checkbox" style="width:auto">

          ${allOps.map(([code,v])=>`

              <div class="op-settings-id">${esc(code)}</div>
              <div class="op-settings-name">${esc(v.displayName)}${v.isSuperAdmin?' · <span style="color:var(--accent)">Süper Admin</span>':v.isSef?' · <span style="color:#38bdf8">Şef</span>':v.isAdmin?' · <span style="color:var(--accent)">Yönetici</span>':''}</div>
              ${code===session.username ? `<span style="font-size:11.5px;color:var(--text-muted)">(bu hesap — silinemez)</span>` : `<button class="del-btn" onclick="deleteOperator('${code}')" title="Sil">🗑</button>`}

        <div style="max-width:400px">
          <div class="field"><label>Makine Kodu</label><input id="new-mk-code" placeholder="ör. SM02"></div>
          <div class="field"><label>Makine Adı</label><input id="new-mk-name" placeholder="ör. Sütun Matkap 2"></div>
          <button class="btn-primary" onclick="addMachine()">+ Makineyi Ekle</button>
        </div>
        <div style="margin-top:24px;font-size:13px;font-weight:600;margin-bottom:8px">Mevcut Makineler (${allMachines().length})</div>
        <div class="machine-grid">${allMachines().map(m=>`<div class="machine-chip" style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span><span class="mono" style="color:var(--accent);font-weight:700">${m.code}</span> ${esc(m.name)}</span><button class="del-btn" onclick="deleteMachine('${m.code}')" title="Sil">🗑</button></div>`).join('')}</div>`;
    } else if(settingsSubTab==='isEmriListesi'){
      const count = Object.keys(STATE.validIsEmri||{}).length;
      body += `<div style="font-size:16px;font-weight:600;margin-bottom:6px">İş Emri Listesi (ERP Doğrulaması)</div>
        <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:18px;max-width:640px">ERP'den aldığınız Excel dosyasını buraya yükleyin. Operatörler İş Emri No (U kodu) girdiğinde, sistem bu listede olup olmadığını kontrol eder — listede yoksa "bu iş emri bulunamadı" uyarısı verir. Excel'inizde yeni iş emirleri oluştukça, dosyayı tekrar buraya yükleyip listeyi güncelleyebilirsiniz (eskisinin üzerine yazılır).</div>
        <div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;max-width:480px;margin-bottom:18px">
          <div style="font-size:13px;margin-bottom:10px">Şu an listede <b style="color:var(--accent)">${count}</b> adet İş Emri No kayıtlı.${count===0?' <span style="color:var(--warn)">(Liste boşsa doğrulama yapılmaz, herkes serbestçe girebilir.)</span>':''}</div>
          <div class="field"><label>Sütun Başlığı (varsayılan: Malzeme kodu)</label><input id="isemri-col-name" value="Malzeme kodu" placeholder="Malzeme kodu"></div>
          <input type="file" id="isemri-file-input" accept=".xlsx,.xls" style="margin-bottom:12px;font-size:12.5px">
          <div style="display:flex;gap:10px">

            ${count>0 ? `<button class="btn-ghost" onclick="clearIsEmriListesi()">🗑 Listeyi Temizle</button>` : ''}
          </div>
          <div id="isemri-upload-status" style="font-size:12px;color:var(--text-muted);margin-top:10px"></div>
        </div>`;
    }
    body += `</div>`;
  } else if(view==='matrix'){
    const entries = entriesArray();
    const workMsFor = (code) => {
      const label = resolveMachineLabel(code);
      return entries.filter(e=>e.makine===label).reduce((s,e)=>{
        const endClip = e.endTs || nowTick;
        const wallMs = Math.max(0, endClip - e.startTs);
        return s + Math.max(0, wallMs - (e.duruşToplamMs||0));
      }, 0);
    };
    const statusPriority = (code) => {
      const label = resolveMachineLabel(code);
      const machineEntries = entries.filter(e=>e.makine===label);
      if(machineEntries.some(e=>e.status==='devam')) return 0;
      if(machineEntries.some(e=>e.status==='duruş')) return 1;
      return 2;
    };
    const sortedMachines = allMachines().slice().sort((a,b)=>{
      if(matrixSort==='calisma') return workMsFor(b.code) - workMsFor(a.code);
      if(matrixSort==='renk') return statusPriority(a.code) - statusPriority(b.code) || a.code.localeCompare(b.code);
      return a.code.localeCompare(b.code);
    });
    body = `<div class="matrix-wrap">
      <div class="matrix-legend">
        <span><span class="legend-dot" style="background:var(--success)"></span>Çalışıyor</span>
        <span><span class="legend-dot" style="background:var(--warn)"></span>Duruşta</span>
        <span><span class="legend-dot" style="background:var(--danger)"></span>Boşta</span>
        <span style="margin-left:auto;display:flex;gap:8px">
          <button class="chip ${matrixSort==='alpha'?'active':''}" onclick="setMatrixSort('alpha')">Alfabetik</button>
          <button class="chip ${matrixSort==='calisma'?'active':''}" onclick="setMatrixSort('calisma')">Çalışma Süresine Göre</button>
          <button class="chip ${matrixSort==='renk'?'active':''}" onclick="setMatrixSort('renk')">Renge Göre</button>
        </span>
      </div>
      <div class="matrix-grid">`;
    sortedMachines.forEach(m=>{
      const label = `${m.code} · ${m.name}`;
      const machineEntries = entries.filter(e=>e.makine===label);
      const runningEntries = machineEntries.filter(e=>e.status==='devam');
      const stoppedEntries = machineEntries.filter(e=>e.status==='duruş');
      const running = runningEntries.length>0;
      const stopped = !running && stoppedEntries.length>0;
      const bg = theme==='light'
        ? (running?'#d1fae5':stopped?'#fef3c7':'#fee2e2')
        : (running?'#1a4d2e':stopped?'#4a3f0a':'#3d1f1f');
      const border = running?'var(--success)':stopped?'var(--warn)':'var(--danger)';
      const dotColor = running?'var(--success)':stopped?'var(--warn)':'var(--danger)';
      const lastFinished = (!running&&!stopped) ? machineEntries.slice().sort((a,b)=>b.startTs-a.startTs)[0] : null;
      body += `<div class="matrix-card" style="background:${bg};border-color:${border}" onclick="openMachineDetail('${m.code}')">
        <div class="matrix-card-top"><span class="matrix-code">${m.code}</span><span class="matrix-dot" style="background:${dotColor}"></span></div>
        <div class="matrix-name">${esc(m.name)}</div>`;
      if(running){
        if(runningEntries.length===1){
          const info = runningEntries[0];
          body += `<div class="matrix-sub">${esc(info.isEmriNo)} · ${esc(info.operatorUsername)}</div>
            <div class="matrix-sub">${fmtElapsed(nowTick-info.startTs)} çalışıyor</div>`;
        } else {
          body += `<div class="matrix-sub" style="font-weight:700">${runningEntries.length} İş Emri Aktif</div>
            <div class="matrix-sub">${runningEntries.map(e=>`${esc(e.isEmriNo)} (${fmtElapsed(nowTick-e.startTs)})`).join(', ')}</div>`;
        }
      } else if(stopped){
        if(stoppedEntries.length===1){
          const info = stoppedEntries[0];
          body += `<div class="matrix-sub">${esc(info.isEmriNo)} · ${esc(info.operatorUsername)}</div>
            <div class="matrix-sub">Duruş: "${esc(info.duruşNedeni)}"</div>`;
        } else {
          body += `<div class="matrix-sub" style="font-weight:700">${stoppedEntries.length} İş Duraklatıldı</div>
            <div class="matrix-sub">${stoppedEntries.map(e=>esc(e.isEmriNo)).join(', ')}</div>`;
        }
      } else if(lastFinished){
        body += `<div class="matrix-sub">Son: ${esc(lastFinished.operatorUsername)} · ${fmtDT(lastFinished.startTs)}</div>`;
      } else {
        body += `<div class="matrix-sub">Hiç kullanılmadı</div>`;
      }
      body += `</div>`;
    });
    body += `</div></div>`;
  } else if(view==='completed'){
    const routes = computeCompletedRoutes().filter(r => !completedSearch || r.isEmriNo.toLowerCase().includes(completedSearch.toLowerCase()));
    body = `<div class="completed-wrap">
      <input id="completed-search-input" class="filter-input completed-search" placeholder="İş Emri No ara…" value="${esc(completedSearch)}" oninput="setCompletedSearch(this.value)">
      <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:16px">${routes.length} tamamlanmış rota</div>`;
    if(routes.length===0){ body += `<div style="text-align:center;color:var(--text-muted);padding:40px 0">Henüz tamamlanan rota yok.</div>`; }
    routes.forEach(r=>{
      const totalMs = r.entries.reduce((sum,e)=>sum+(e.endTs?(e.endTs-e.startTs):0),0);
      const chain = r.entries.map(e=>(e.makine||'').split(' · ')[0]||'—');
      const malz = r.entries.find(e=>e.malzemeCinsi||e.capBoy) || {};
      const malzText = [malz.malzemeCinsi, malz.capBoy].filter(Boolean).join(' · ');
      body += `<div class="completed-card" onclick="openRouteDetail('${r.isEmriNo.replace(/'/g,"\\'")}', ${r.finishedAt})">
        <div class="completed-header">
          <span class="completed-id">${esc(r.isEmriNo)} ✓${malzText?` · <span style="color:var(--text-muted);font-weight:400;font-size:13px">${esc(malzText)}</span>`:''}</span>
          <span class="completed-meta">Tamamlandı: ${fmtDT(r.finishedAt)} · Toplam süre: ${fmtDur(totalMs)} · ${r.entries.length} adım</span>
        </div>
        <div class="route-chain">${chain.map((c,i)=>`<span class="route-chip">${esc(c)}</span>${i<chain.length-1?'<span class="route-arrow">→</span>':''}`).join('')}</div>

        <td>${esc(e.makine||'—')}</td>
        <td>${esc(e.operatorUsername)} · ${esc(e.operatorName)}</td>
        <td>${fmtDT(e.startTs)}</td>
        <td>${e.endTs?fmtDT(e.endTs):'—'}</td>
        <td>${e.endTs?fmtDur(e.endTs-e.startTs):'—'}</td>
        <td><span style="color:${statusColor};font-weight:600">${isDone?'Rota Tamamlandı':statusLabel}</span></td>
        <td style="color:var(--text-muted);font-style:italic">${esc(e.not||'')}</td>
        ${session.isSuperAdmin ? `<td><button class="del-btn" onclick="deleteReportRecord('${e.id}')" title="Sil">🗑</button></td>` : ''}
      </tr>`;
    });
    body += `</tbody></table></div>${entryDetailId ? renderEntryDetailModal() : ''}`;
  }

  return `<div class="root-wide theme-${theme}">${header}${body}${machineModal ? renderMachineModal() : ''}</div>`;
}
function setReportFilterFieldLight(field, val){ reportFilter[field]=val; renderTableOnly(); }
function renderTableOnly(){ render(); } // basit yaklaşım: filtre değişince tam yeniden çizim yeterli hızda çalışır

/* ===================== ANA RENDER ===================== */
function render(){
  const app = document.getElementById('app');
  // Periyodik (saniyelik) yeniden çizim, açık bir modal veya tablo varsa kaydırma
  // konumunu sıfırlamasın diye önce mevcut scroll konumlarını kaydediyoruz.
  const scrollSel = ['.modal-body', '.table-wrap', '.body-pad', '.completed-wrap', '.matrix-wrap', '.settings-wrap'];
  const savedScroll = scrollSel.map(sel => { const el = document.querySelector(sel); return el ? el.scrollTop : null; });

  // Odak koruması: bir input/textarea'da yazarken herhangi bir yeniden çizim
  // o kutuyu sıfırdan oluşturup imleci/odağı kaybettirmesin diye, hangi kutuda
  // olduğumuzu ve imlecin nerede durduğunu kaydedip render sonrası geri koyuyoruz.
  const activeEl = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if(activeEl && (activeEl.tagName==='INPUT' || activeEl.tagName==='TEXTAREA') && activeEl.id){
    focusId = activeEl.id;
    try { selStart = activeEl.selectionStart; selEnd = activeEl.selectionEnd; } catch(e){}
  }

  if(!session){ app.innerHTML = renderLogin(); return; }
  app.innerHTML = session.isAdmin ? renderAdmin() : renderOperator();
  scrollSel.forEach((sel,i) => { if(savedScroll[i]!=null){ const el = document.querySelector(sel); if(el) el.scrollTop = savedScroll[i]; } });

  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }

  if(session && session.isAdmin && view==='analiz'){ initAnalizCharts(computeAnalizData(analizFrom, analizTo)); }
}
function renderLiveBits(){
  // Sadece kilit ekranındaki / matristeki canlı sayaçları güncellemek için tam render yeterli (veri seti küçük).
  // Ama bir form açıkken (düzenleme, duruş nedeni yazma, serbest mesaj) tam render odağı (focus) kaybettiriyor — o an atla.
  const editingSomething = !!editingActiveId || (durusOpen && durusReasonSel==='Diğer') || sendMsgOpen;
  if(editingSomething) return;
  if(activeDetailId || activeGroupId || (session && !session.isAdmin && view==='list') || (session && session.isAdmin && view==='matrix')) render();
}

/* ===================== BAŞLAT ===================== */
window.addEventListener('DOMContentLoaded', ()=>{
  document.documentElement.className = 'theme-'+theme;
  if(!fbConfigured()){
    document.getElementById('app').innerHTML = `<div class="root-mobile theme-${theme}"><div class="auth-wrap"><div class="error-text" style="max-width:400px;margin:0 auto">Firebase databaseURL henüz girilmemiş. Lütfen KURULUM_BULUT.md dosyasındaki adımları izleyip bu HTML dosyasının başındaki FIREBASE_CONFIG içine databaseURL'i yapıştırın.</div></div></div>`;
    return;
  }
  initFirebase();
  render();

  // Giriş ekranındayken, sayfanın herhangi bir yerinde (bir kutuya odaklanmış
  // olmasan bile) Enter'a basınca giriş yapmayı dener.
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !session){ doLogin(); }
  });
});
</script>

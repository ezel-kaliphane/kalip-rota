<style>
:root{
  --bg:#0F1214; --panel:#171C20; --panel-alt:#1F262C; --border:#293138;
  --text:#EDF1F3; --text-muted:#8B959D;
  --accent:#FF9046; --accent-dim:#FF904618; --success:#46D07F; --success-soft:#8FDDB2; --warn:#F2C14E; --danger:#F4726A;
  --btn-primary-bg:var(--accent); --btn-primary-text:#1A1408;
  --chip-active-bg:#F2C14E1a; --chip-active-border:var(--warn); --chip-active-text:var(--warn);
  --card-shadow:0 1px 2px rgba(0,0,0,.32); --radius-pill:20px;
  --success-row:#46D07F1f;
  --warn-soft:#F2C14E12; --warn-med:#F2C14E1f; --warn-border:#F2C14E44;
  --gunsonu:#4FB6EF; --gunsonu-soft:#4FB6EF14; --gunsonu-med:#4FB6EF22; --gunsonu-border:#4FB6EF44; --gunsonu-active-bg:#4FB6EF55;
  --tadilat-info:#B98CFA; --tadilat-soft:#B98CFA14; --tadilat-med:#B98CFA22; --tadilat-border:#B98CFA44; --tadilat-active-bg:#B98CFA55;
  /* K3: --warn/--success açık temada koyulaşıyor (#F2C14E→#96601A, #46D07F→#167A3D), ama
     bu iki butonun metin rengi koyu tema için sabit kodlanmıştı (#241c04/#062910) — açık
     temada koyu-üstüne-koyu oluşup WCAG AA'nın (4.5:1) altına düşüyordu. Ayrı bir "metin bu
     rengin üstünde" tokeni tanımlayıp temaya göre değiştiriyoruz. */
  --on-warn:#241c04; --on-success:#062910;
}
.theme-light{
  --bg:#F3F4F6; --panel:#FFFFFF; --panel-alt:#EDEFF2; --border:#DFE3E8;
  --text:#16191D; --text-muted:#5C666F;
  --accent:#C25A12; --accent-dim:#FDEEE2; --success:#167A3D; --success-soft:#3E9C63; --warn:#96601A; --danger:#C0362C;
  --on-warn:#FFFFFF; --on-success:#FFFFFF;
  --btn-primary-bg:#C25A12; --btn-primary-text:#FFFFFF;
  --chip-active-bg:#FDEEE2; --chip-active-border:#C25A12; --chip-active-text:#C25A12;
  --card-shadow:0 1px 2px rgba(16,24,40,.07);
  --radius-pill:14px;
  --success-row:#E4F5EA;
  --warn-soft:#FDF3E0; --warn-med:#FBE9CB; --warn-border:#E7C68B;
  --gunsonu:#1D6FB8; --gunsonu-soft:#E6F1FA; --gunsonu-med:#D3E6F6; --gunsonu-border:#9AC4E4; --gunsonu-active-bg:#1D6FB855;
  --tadilat-info:#6D45C9; --tadilat-soft:#EFE9FB; --tadilat-med:#E2D8F7; --tadilat-border:#BFA9EE; --tadilat-active-bg:#6D45C955;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
button{cursor:pointer;font-family:'Inter',sans-serif}
input,select,textarea{font-family:'Inter',sans-serif;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;width:100%}
::placeholder{color:var(--text-muted)}
table{border-collapse:collapse;width:100%}
.mono{font-family:'JetBrains Mono',monospace}
.brand{font-family:'Oswald',sans-serif;font-size:17px;letter-spacing:1.5px;font-weight:600}

/* O2: iOS Safari'de 100vh, URL çubuğu görünürken bile yokmuş gibi hesaplanır — sayfa gerçek
   ekrandan ~60-90px fazla uzun olur, içerik sığsa bile lastik bant gibi zıplar. 100dvh
   (destekleyen tarayıcılarda otomatik devreye girer) gerçek görünür yüksekliği kullanır. */
.root-mobile{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);color:var(--text)}
.root-wide{width:100%;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);color:var(--text)}

.header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.header-left{display:flex;align-items:center;gap:10px}
.brand-sub{font-size:11px;color:var(--text-muted);margin-top:1px}
.icon-btn{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:15px}
.icon-btn-labeled{display:flex;align-items:center;gap:6px;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text-muted);font-size:13px}

.tabs{display:flex;gap:6px;padding:12px 18px 0}
.tab-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 0;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:12.5px;font-weight:500}
.tab-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

.body-pad{flex:1;padding:18px;overflow-y:auto}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.row{display:flex;gap:10px}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--btn-primary-bg);color:var(--btn-primary-text);font-weight:700;font-size:14px;border:none;border-radius:10px;padding:12px 0;width:100%;box-shadow:var(--card-shadow)}
.btn-start{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--success);color:var(--on-success);font-weight:700;font-size:14px;border:none;border-radius:10px;padding:13px 0;width:100%}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:8px;padding:7px 12px;font-size:12.5px}
.chip{font-size:12.5px;color:var(--text-muted);background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-pill);padding:8px 14px}
.chip.active{background:var(--chip-active-bg);border-color:var(--chip-active-border);color:var(--chip-active-text);font-weight:600}
.badge{font-size:12.5px;color:var(--accent);background:var(--accent-dim);border:1px solid #ff8a3d55;border-radius:8px;padding:8px 10px}
/* Tek tip ikon sistemi — tüm glifler currentColor ile çizilen inline SVG (emoji yok). */
.ic{flex:none;vertical-align:-3px}
button .ic,.tab-btn .ic,.chip .ic{pointer-events:none}
/* Tek tip durum rozeti — nokta + etiket, her ekranda aynı görünüm. */
.sbadge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;line-height:1;color:var(--sb);background:color-mix(in srgb,var(--sb) 13%,transparent);border:1px solid color-mix(in srgb,var(--sb) 40%,transparent);border-radius:var(--radius-pill);padding:5px 10px;white-space:nowrap}
.sbadge-dot{width:7px;height:7px;border-radius:50%;background:var(--sb);flex:none}
/* Tek tip aç/kapa anahtarı */
.sw{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px 15px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.sw input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.sw-track{flex:none;width:52px;height:31px;border-radius:999px;background:var(--panel-alt);border:1px solid var(--border);position:relative;transition:background .18s,border-color .18s}
.sw-knob{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .18s}
.sw input:checked + .sw-track{background:var(--accent);border-color:var(--accent)}
.sw input:checked + .sw-track .sw-knob{transform:translateX(21px)}
.sw-ok input:checked + .sw-track{background:var(--success);border-color:var(--success)}
.sw input:focus-visible + .sw-track{outline:2px solid var(--accent);outline-offset:2px}
.sw-title{font-size:14px;font-weight:600;line-height:1.25}
.sw-sub{font-size:12px;color:var(--text-muted);margin-top:2px;line-height:1.3}

/* Ayarlar ekranı */
.set-sec{font-size:11.5px;font-weight:700;letter-spacing:.7px;color:var(--text-muted);margin:22px 0 9px}
.set-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:15px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;min-height:54px}
.set-row .chev{margin-left:auto;color:var(--text-muted);display:flex}
.set-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:15px}
.theme-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.theme-opt{background:var(--panel);border:2px solid var(--border);border-radius:14px;padding:9px 9px 10px;cursor:pointer;font-family:'Inter',sans-serif;color:var(--text-muted);font-size:12px;font-weight:700;display:flex;flex-direction:column;gap:8px;align-items:center}
.theme-opt.on{border-color:var(--accent);color:var(--accent)}
.theme-swatch{width:100%;height:42px;border-radius:9px;border:1px solid var(--border);overflow:hidden;display:flex}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex:none;letter-spacing:.5px}

.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--card-shadow)}
.card-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.card-id{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--accent);font-weight:600}
.card-meta{font-size:12px;color:var(--text-muted)}
.timeline-row{display:flex;gap:12px}
.timeline-rail{display:flex;flex-direction:column;align-items:center;width:14px}
.dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0}
.line{width:2px;flex:1;background:var(--border);min-height:30px}
.op-content{flex:1;padding-bottom:14px}
.op-top{display:flex;align-items:center;gap:8px}
.op-code{font-size:13px;color:var(--accent);font-weight:600}
.del-btn{margin-left:auto;background:transparent;border:none;padding:2px;color:var(--text-muted)}
.op-note{font-size:12px;color:var(--text-muted);margin-top:2px;font-style:italic}
.op-foot{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:11.5px;color:var(--text-muted)}
.done-tag{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:12px;color:var(--success);font-weight:600}
.durus-tag{margin-top:6px;font-size:12px;color:var(--warn);font-style:italic}
.finish-btn{margin-top:8px;display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border);color:var(--text);font-size:12px;border-radius:8px;padding:6px 10px}

.lock-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:32px 24px;gap:6px;overflow-y:auto}
.lock-label{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:700}
.lock-id{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;margin-top:10px}
.lock-machine{font-size:18px;color:var(--accent);font-weight:600;margin-top:4px}
.lock-timer{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;margin-top:22px;letter-spacing:1px}
.lock-meta{font-size:12.5px;color:var(--text-muted);margin-top:6px}
.lock-note{font-size:13px;color:var(--text-muted);font-style:italic;margin-top:14px;max-width:320px}
.durus-reason-box{font-size:13px;color:var(--warn);font-style:italic;margin-top:16px;max-width:320px;background:var(--warn-soft);border:1px solid var(--warn-border);border-radius:8px;padding:10px 14px}
.lock-hint{font-size:11.5px;color:var(--text-muted);margin-top:18px;max-width:260px;line-height:1.5}
.durus-chip-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px}

.admin-header{display:flex;align-items:center;justify-content:space-between;padding:11px 24px;border-bottom:1px solid var(--border)}
.admin-stats{display:flex;gap:24px;padding:8px 24px;font-size:13px;color:var(--text-muted);border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
.filter-bar{display:flex;gap:10px;align-items:center;padding:10px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.filter-input{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;width:auto}
.dropdown-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:50;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;width:340px;max-height:320px;overflow-y:auto;overflow-x:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.dropdown-item{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 4px;cursor:pointer;border-radius:6px;width:100%;text-align:left;justify-content:flex-start}
.dropdown-item input{flex-shrink:0;width:auto}
.dropdown-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropdown-item:hover{background:var(--panel-alt)}
.table-wrap{flex:1;overflow:auto;padding:0 24px 24px}
th{text-align:left;padding:10px 12px;color:var(--text-muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg)}
td{padding:10px 12px;color:var(--text);vertical-align:top;border-bottom:1px solid var(--border)}

.matrix-wrap{padding:20px 24px;overflow-y:auto;flex:1}
.matrix-legend{display:flex;gap:10px;align-items:center;margin-bottom:18px;font-size:12.5px;color:var(--text-muted);flex-wrap:wrap}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.matrix-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.matrix-card{border:1px solid;border-radius:12px;padding:12px 14px;min-height:92px;cursor:pointer;transition:transform .1s;box-shadow:var(--card-shadow)}
.matrix-card:hover{transform:translateY(-1px)}
.matrix-card-top{display:flex;align-items:center;justify-content:space-between}
.matrix-code{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px}
.matrix-dot{width:10px;height:10px;border-radius:50%}
.matrix-name{font-size:12px;color:var(--text-muted);margin-top:2px;margin-bottom:8px}
.matrix-sub{font-size:11.5px;opacity:.9;margin-top:2px}

.modal-overlay{position:fixed;inset:0;background:#000000a0;display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
/* Duruş nedeni seçici — alttan açılan sheet (mockup tasarımı). Gerçek bir modal (arka planı
   karartan, sabit konumlu) olduğu için altındaki içerik (canlı sayaç, matris vb.) hareket
   etmeye devam etse bile kullanıcı ARTIK ONU GÖRMÜYOR/ETKİLEŞEMİYOR — eski inline panel
   tasarımında "arka plan hareket ediyor, birkaç saniye tıklayamıyorum" şikayeti muhtemelen
   buradan kaynaklanıyordu (arkadaki lock-screen'in kendi tıklanabilir alanları hâlâ üstteydi). */
/* K2: iOS'ta klavye açılınca layout viewport'u küçültmüyor, sadece görsel viewport'u
   kaydırıyor — position:fixed olan overlay yerinde kalıp "Duruşu Başlat" butonu klavyenin
   arkasına gömülüyordu (ör. "Diğer" seçilip #durus-custom'a odaklanınca). --kb, aşağıdaki
   visualViewport dinleyicisiyle (DOMContentLoaded içinde) klavye yüksekliğine göre canlı
   güncelleniyor; klavye kapalıyken 0px, render()/scroll koruma mantığıyla hiç kesişmiyor. */
.durus-modal-overlay{position:fixed;inset:0;background:#000000b0;z-index:700;display:flex;align-items:flex-end;justify-content:center;bottom:var(--kb,0px)}
.durus-modal-panel{background:var(--panel);width:100%;max-width:480px;border-radius:22px 22px 0 0;max-height:min(90dvh, calc(100dvh - var(--kb,0px) - 24px));display:flex;flex-direction:column;box-shadow:0 -8px 40px #0008}
.durus-modal-handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0;flex-shrink:0}
.durus-modal-header{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 20px 10px;flex-shrink:0}
.durus-modal-title{font-size:19px;font-weight:700}
.durus-modal-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.durus-modal-list{overflow-y:auto;padding:2px 16px 4px;flex:1;-webkit-overflow-scrolling:touch}
.durus-option-card{display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:14px;border:1.5px solid var(--border);margin-bottom:9px;cursor:pointer;background:var(--panel-alt);text-align:left;width:100%}
.durus-option-card.dashed{border-style:dashed;background:transparent}
.durus-radio{width:21px;height:21px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .12s}
.durus-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:transparent;transition:background .12s}
.durus-option-name{font-size:14.5px;font-weight:600;color:var(--text)}
.durus-option-desc{font-size:11.5px;color:var(--text-muted);margin-top:1px}
.durus-option-divider{display:flex;align-items:center;gap:10px;margin:14px 4px 10px;font-size:10.5px;color:var(--text-muted);letter-spacing:.6px;font-weight:600}
.durus-option-divider::before,.durus-option-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.durus-modal-footer{padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);flex-shrink:0}
.durus-modal-footer-btn{width:100%;padding:15px;border-radius:14px;border:none;background:var(--warn);color:var(--on-warn);font-weight:700;font-size:15.5px}
.durus-modal-footer-btn:disabled{opacity:.4}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:100%;max-width:840px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--card-shadow)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-title{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--accent)}
.modal-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.modal-body{padding:18px 22px;overflow-y:auto;overflow-x:auto;flex:1}
.modal-filter-row{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.modal-stats{display:flex;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.modal-stat-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 16px;min-width:120px;text-align:center}

/* =============== MOBİL DOKUNMA HEDEFİ İYİLEŞTİRMELERİ =============== */
/* iOS Safari, 16px'in altındaki input font-size'larda alanı otomatik yakınlaştırır — bu can
   sıkıcı davranışı engellemek için mobilde tüm form alanlarını 16px'e çıkarıyoruz. Ayrıca
   Apple/Google dokunma hedefi önerisi (~44px) altında kalan küçük butonları büyütüyoruz. */
@media (max-width:768px){
  input,select,textarea{font-size:16px!important}
  .filter-input{font-size:16px!important;padding:10px 12px!important}
  .icon-btn{width:42px;height:42px;font-size:16px}
  .icon-btn-labeled{padding:12px 18px!important;font-size:14px!important}
  .btn-ghost{padding:11px 16px;font-size:13px;min-height:40px}
  .chip{padding:11px 16px;min-height:38px}
  .del-btn{padding:8px;min-width:36px;min-height:36px}
  button,.card,.matrix-card,.completed-card,[onclick]{touch-action:manipulation}

  /* C5 düzeltmesi: bu yorum eskiden "Ana sekme çubuğu (Makineler/Yeni Kayıt/Geçmiş/Fason/
     Tadilat)" diyip OPERATÖR sekmelerini tarif ediyordu — ama operatörün üst sekme çubuğu
     mobilde zaten .root-mobile > .tabs{display:none} ile tamamen gizleniyor (yerini
     bottom-nav alıyor). Bu kurallar sadece .root-wide (admin, dar ekran) görünümünde
     kullanılan sekmeler (Rapor/Analiz/Ayarlar alt sekmeleri vb.) için geçerli oluyor. */
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab-btn{flex:0 0 auto;white-space:nowrap;padding:12px 16px;font-size:13px;min-height:44px}

  /* Ayarlar alt sekmeleri (Veri Listeleri / Bildirimlerim / vs.) — aynı sıkışma sorunu. */
  .sub-tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .sub-tabs::-webkit-scrollbar{display:none}
  .sub-tab-btn{flex:0 0 auto;white-space:nowrap;padding:10px 16px;min-height:40px}

  /* Admin üst başlığı (logo + buton grubu) — dar ekranda taşıyordu, artık alt satıra sarıyor. */
  .admin-header{flex-wrap:wrap;gap:10px;padding:14px 16px}

  /* K1 (çentik telafisi, 2. yarı): apple-mobile-web-app-status-bar-style=black-translucent
     PWA olarak ana ekrandan açıldığında içeriği durum çubuğunun altına uzatıyor — üst safe
     area telafisi olmadan başlık, saatin/çentiğin arkasına giriyordu. */
  .header,.admin-header{padding-top:calc(14px + env(safe-area-inset-top))}

  /* K4 düzeltmesi: yukarıdaki dokunma hedefi kuralları padding üzerinden çalışıyordu, ama
     şablonlarda çoğu buton inline style="padding:…" ile yazılmış — inline stil her zaman
     kazanır, kural sessizce yutuluyordu. min-height + !important ile (padding'e dokunmadan)
     dokunma alanını garantiliyoruz; inline padding görünümü aynı kalıyor. */
  .btn-ghost,.chip,.del-btn,.durus-option-card,.dropdown-item,.machine-check-row{min-height:44px!important}
  .icon-btn{width:44px!important;height:44px!important}
  .btn-ghost{display:inline-flex;align-items:center;justify-content:center}
  /* Duruş modalının tutamacı görünümde 38×4px kalsın ama dokunma alanı 44px olsun. */
  .durus-modal-handle{position:relative}
  .durus-modal-handle::after{content:'';position:absolute;left:-46px;right:-46px;top:-20px;bottom:-20px}

  /* O7 düzeltmesi: operatör tarafı 18px yatay dolgu kullanırken, bu sarmalayıcılar mobilde
     de 24px'te kalıyordu (mobil geçersiz kılma yoktu) — sekmeler arası geçişte 6px'lik bir
     kenar hattı kayması/titremesi oluyordu, 360px ekranda da 12px içerik kaybı demekti. */
  .matrix-wrap,.settings-wrap,.completed-wrap,.analiz-wrap,.admin-stats,.filter-bar{padding-left:18px;padding-right:18px}

  /* Formlardaki iki sütunlu (yan yana) yerleşimler — telefonda tek sütuna düşüyor.
     Bu, sınıf yerine inline style kullanan yerleri de (ör. Yeni Tadilat Talebi ekranı,
     Personel Ayarları formu) kapsıyor. */
  div[style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important}
}
</style>

<div id="toast-big" class="toast-big"></div>

<script>
/* ===================== SABİT VERİLER ===================== */
const MACHINE_LIST = [
  { code:"UF01", name:"Freze" }, { code:"SM01", name:"Sütun Matkap" },
  { code:"TE01", name:"Tel Erezyon Sodick" }, { code:"TE02", name:"Tel Erezyon Sammlite" },
  { code:"TES01", name:"Testere" }, { code:"DDTE01", name:"Delik Delme Tel Erozyon" },
  { code:"KM01", name:"Kumlama Makinası" }, { code:"PT01", name:"Parlatma Tezgahı" },
  { code:"PT02", name:"Parlatma Tezgahı" }, { code:"KCM01", name:"Kılavuz Makinesi" },
  { code:"ODT01", name:"Silindirik Taşlama" }, { code:"ODT02", name:"Silindirik Taşlama" },
  { code:"ODT03", name:"Silindirik Taşlama" }, { code:"P01", name:"Pres" },
  { code:"DE01", name:"Dalma Erezyon" }, { code:"DE02", name:"Dalma Erezyon" },
  { code:"DE03", name:"Dalma Erezyon" }, { code:"F01", name:"Fırın" }, { code:"F02", name:"Fırın" },
  { code:"C02", name:"CNC Dik İşleme Merkezi" }, { code:"C01", name:"CNC Torna" },
  { code:"UST01", name:"Satıh Taşlama" }, { code:"UST02", name:"Satıh Taşlama" },
  { code:"UT01", name:"Torna" }, { code:"UT02", name:"Torna" }, { code:"UT03", name:"Torna" },
  { code:"FII01", name:"Fason Isıl İşlem" }, { code:"SAL01", name:"Şaloma" },
];
const machineLabelFor = c => { const m = MACHINE_LIST.find(x=>x.code===c); return m ? `${m.code} · ${m.name}` : ""; };
const ALL_MACHINE_CODES = MACHINE_LIST.map(m=>m.code);

// NOT: Buradaki eski sabit operatör/şifre listesi kaldırıldı — Firebase'e bir kere
// yazıldıktan sonra kaynak kodda durmasının hiçbir faydası yoktu, sadece herkesin
// "Sayfa Kaynağını Görüntüle" ile şifreleri (ADMIN dahil) okuyabilmesine yol açıyordu.
// Yeni operatörler artık Ayarlar → "+ Kullanıcı Ekle" panelinden eklenir.

const DEFAULT_DURUS_REASONS = ["Arıza / Bakım","Malzeme Bekleniyor","Kalıp/Takım Değişimi","Program/Ayar Değişimi","Kalite Kontrol Bekleniyor","Elektrik/Basınçlı Hava Kesintisi","Operatör Molası","Farklı İş Emrine Geçiş","Tuvalet"];
const GUN_SONU_REASON = "Gün Sonu (Mesai Bitti, yarın devam edilecek)";
const TADILAT_REASON = "Tadilat";
const TADILAT_SONRASI_REASON = "Tadilat Sonrası Ayar";
function getDurusReasons(){
  const custom = (STATE.durusReasons && STATE.durusReasons.length>0) ? STATE.durusReasons : DEFAULT_DURUS_REASONS;
  const hasTadilat = custom.some(r=>isTadilatReason(r));
  return [...custom, ...(hasTadilat?[]:[TADILAT_REASON]), GUN_SONU_REASON, "Diğer"];
}
// Admin'in Duruş Nedenleri listesine "Tadilat", "Tadilat Duruşu" gibi kendi yazdığı bir metin
// eklemiş olması ihtimaline karşı esnek (bulanık) eşleştirme — birebir "Tadilat" yazmasına gerek yok.
function isTadilatReason(r){
  if(!r) return false;
  const s = String(r).toLowerCase();
  return s.includes('tadilat') && r!==TADILAT_SONRASI_REASON;
}
// Stil amaçlı: hem "Tadilat" hem "Tadilat Sonrası Ayar" için (ikisi de tadilatla ilgili duruş).
function isTadilatRelated(r){ return !!r && String(r).toLowerCase().includes('tadilat'); }
function effectiveDurusMs(e){
  let d = e.duruşToplamMs||0;
  if(e.status==='duruş' && e.duruşTs && e.duruşNedeni!==GUN_SONU_REASON) d += Math.max(0, nowTick - e.duruşTs);
  return d;
}
function effectiveExcludedMs(e){
  let d = e.excludedMs||0;
  if(e.status==='duruş' && e.duruşTs && e.duruşNedeni===GUN_SONU_REASON) d += Math.max(0, nowTick - e.duruşTs);
  return d;
}
function effectiveDurusReason(e){
  // Duraklatılmış bir işin en son nedeni Gün Sonu olabilir ama duruşToplamMs'de daha
  // önceki (Gün Sonu'ndan önceki) GERÇEK bir duruştan kalma süre birikmiş olabilir.
  // Bu durum sadece "şu an duraklı" iken değil, iş sonradan devam edip bitse bile
  // kalıcı olarak veride kalıyor — o yüzden statüden bağımsız olarak düzeltiyoruz.
  if(e.duruşNedeni===GUN_SONU_REASON && (e.duruşToplamMs||0)>0) return 'Belirtilmemiş (önceki duraklama)';
  return e.duruşNedeni || 'Belirtilmemiş';
}
// H DÜZELTMESİ — Duruş Olay Listesi: Eskiden bir kaydın duruş bilgisi TEK bir kümülatif sayı
// (duruşToplamMs) + TEK bir "son neden" (duruşNedeni) olarak tutuluyordu. Bir iş birden fazla
// kez farklı nedenlerle duraklarsa, eski nedenin KENDİSİ ve SÜRESİ kalıcı olarak kayboluyordu.
// Artık HER duruş periyodu, bittiği anda ayrı bir olay olarak durusLog dizisine ekleniyor —
// {ts, neden, sureMs}. Eski (bu alan eklenmeden önce oluşmuş) kayıtlarda durusLog olmayabilir,
// okuyan taraflar bu durumda eski (tek-neden) davranışa otomatik geri düşüyor.
function appendDurusLog(currentLog, neden, sureMs, ts){
  if(!sureMs || sureMs<=0) return currentLog || null;
  const log = Array.isArray(currentLog) ? currentLog.slice() : [];
  log.push({ ts: ts||Date.now(), neden: neden||'Belirtilmemiş', sureMs: Math.round(sureMs) });
  return log;
}
// Bir duruş/Gün Sonu OLAYININ KENDİSİ de gece yarısını aşabilir (ör. dün 17:30'da başlayıp
// bugün 08:00'de biten bir Gün Sonu bekleyişi, 14.5 saat, iki günü kapsıyor). Gün bazlı bölme
// yaparken bu olayı SADECE başladığı güne yazmak, bir kademe daha aynı hatayı tekrarlıyordu —
// bu yüzden olayın [ts, ts+sureMs] aralığıyla ilgili günün [segStart, segEnd] aralığının
// KESİŞEN kısmını hesaplıyoruz, olayın tamamını değil.
function msOverlap(evTs, evSureMs, segStart, segEnd){
  const evStart = evTs, evEnd = evTs + evSureMs;
  const overlapStart = Math.max(evStart, segStart);
  const overlapEnd = Math.min(evEnd, segEnd);
  return Math.max(0, overlapEnd - overlapStart);
}
function entryDurusEvents(e){
  const events = [];
  if(Array.isArray(e.durusLog) && e.durusLog.length>0){
    e.durusLog.forEach(ev => events.push({ neden: ev.neden||'Belirtilmemiş', sureMs: ev.sureMs, ts: ev.ts }));
  } else if((e.duruşToplamMs||0) > 0){
    events.push({ neden: effectiveDurusReason(e), sureMs: e.duruşToplamMs, ts: e.startTs });
  }
  if(e.status==='duruş' && e.duruşTs && e.duruşNedeni!==GUN_SONU_REASON){
    const liveExtra = Math.max(0, nowTick - e.duruşTs);
    if(liveExtra>0) events.push({ neden: e.duruşNedeni||'Belirtilmemiş', sureMs: liveExtra, ts: e.duruşTs, live:true });
  }
  return events;
}
// GÜN SONU süreleri için entryDurusEvents'in eşdeğeri — ayrı tutuyoruz çünkü Gün Sonu bir
// "duruş nedeni" olarak RAPORLANMIYOR (Duruş Analizi'nde görünmemesi bilinçli bir tasarım),
// ama gün-bazlı bölme sırasında (Günlere Göre Özet, Gantt) HANGİ GÜNE ait olduğunu bilmemiz
// lazım — yoksa bu süre bazen çalışma gibi sayılıp şişiriyor, bazen yanlış günden düşülüp
// o günü sıfırlıyordu. Eski (excludedLog eklenmeden önceki) kayıtlar için, tek bir zaman
// damgası bilinemediğinden, kalan cumulative excludedMs'i kaydın BAŞLANGICINA atfediyoruz —
// tam isabetli olmayabilir ama en azından "çalışma" olarak sayılmasını önlüyor.
function entryExcludedEvents(e){
  const events = [];
  if(Array.isArray(e.excludedLog) && e.excludedLog.length>0){
    e.excludedLog.forEach(ev => events.push({ neden: ev.neden||GUN_SONU_REASON, sureMs: ev.sureMs, ts: ev.ts }));
  } else if((e.excludedMs||0) > 0){
    events.push({ neden: GUN_SONU_REASON, sureMs: e.excludedMs, ts: e.startTs });
  }
  if(e.status==='duruş' && e.duruşTs && e.duruşNedeni===GUN_SONU_REASON){
    const liveExtra = Math.max(0, nowTick - e.duruşTs);
    if(liveExtra>0) events.push({ neden: GUN_SONU_REASON, sureMs: liveExtra, ts: e.duruşTs, live:true });
  }
  return events;
}
function collectDurusEvents(entries){
  const seen = new Set();
  const out = [];
  entries.forEach(e=>{
    entryDurusEvents(e).forEach(ev=>{
      const key = e.groupId ? `${e.groupId}|${ev.ts}|${ev.sureMs}|${ev.neden}` : `${e.id||e.startTs}|${ev.ts}|${ev.sureMs}`;
      if(seen.has(key)) return;
      seen.add(key);
      out.push({ ...ev, entry: e });
    });
  });
  return out;
}

/* ===================== YARDIMCI FONKSİYONLAR ===================== */
const uid = () => Math.random().toString(36).slice(2,10);
/* Şifreler artık düz metin yerine SHA-256 hash olarak saklanıyor (bkz. doLogin/changePassword/
   addOperator). Tarayıcının kendi Web Crypto API'si kullanılıyor, ek kütüphane gerekmiyor.
   Eski (henüz hash'lenmemiş) kayıtlarla geriye dönük uyumluluk için doLogin, düz metin eşleşmesi
   olursa girişe izin verip o an sessizce hash'e yükseltiyor — ayrı bir "şifre sıfırlama" göçü
   gerekmiyor, her operatör bir sonraki girişinde otomatik olarak güvenli hale geliyor. */
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDT = ts => new Date(ts).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
const fmtDur = ms => { const m=Math.round(ms/60000); return m<60?`${m} dk`:`${Math.floor(m/60)} sa ${m%60} dk`; };
const fmtElapsed = ms => { const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; const p=n=>String(n).padStart(2,"0"); return h>0?`${p(h)}:${p(m)}:${p(sec)}`:`${p(m)}:${p(sec)}`; };
// ÖNEMLİ DÜZELTME: Eskiden toISOString() kullanıyordu — bu HER ZAMAN UTC döndürür. Türkiye
// UTC+3 olduğu için, yerel saatle 00:00-03:00 arası başlayan işler yanlışlıkla BİR ÖNCEKİ
// güne yazılıyordu (Analiz'de kaybolma, Gantt'ta görünmeme, "Bugün" filtresinin gece 3'ten
// önce dünü seçmesi gibi sorunlara yol açıyordu). Artık tarayıcının YEREL tarih bileşenleri
// (getFullYear/getMonth/getDate) kullanılıyor — dateKey artık gerçekten "bu yerel gün" demek.
function dateKey(ts){
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function clampDateKey(dk, fromDate, toDate){ return dk<fromDate ? fromDate : (dk>toDate ? toDate : dk); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'; clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',2200); }
function bigToast(msg){ const t=document.getElementById('toast-big'); if(!t) return; t.textContent=msg; t.className='toast-big show'; clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast-big',3800); }
function connDot(){ return `<span class="conn-dot ${connOK?'on':'off'}" title="${connOK?'Buluta bağlı (senkron)':'Bağlantı yok — internet kontrol edin'}"></span>`; }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }

/* ===================== DURUM (STATE) ===================== */
let STATE = { operators: {}, entries: {}, messages: {}, validIsEmri: {}, durusReasons: [], manualPushRequests: {}, tadilatOnHazirIstekler: {}, pushLog: {} };
/* ===================== BİLEŞEN (KOVAN/KARBÜR) AYRIMI =====================
   Bazı malzemelerde kalıp iki farklı yarı mamulden oluşuyor (kovan/sıkma çemberi ve karbür),
   bunlar farklı rotalarda ayrı ayrı işlenip sonra shrink-fit ile birleşiyor. ERP (Canias)
   bu iki yarı mamulü _ZARF (kovan) ve _ELMAS (karbür) ekleriyle ayırıyor; aynı mantığı
   burada da kullanıyoruz ki rotalar birbirine karışmasın. */
const BILESEN_SUFFIX = { ZARF: '_ZARF', ELMAS: '_ELMAS' };
const BILESEN_LABEL = { ZARF: 'Çelik', ELMAS: 'Karbür' };
function baseIsEmriNo(code){
  const s = String(code||'').trim().toUpperCase();
  for(const suf of Object.values(BILESEN_SUFFIX)){ if(s.endsWith(suf)) return s.slice(0, -suf.length); }
  return s;
}
function bilesenOfCode(code){
  const s = String(code||'').trim().toUpperCase();
  for(const key of Object.keys(BILESEN_SUFFIX)){ if(s.endsWith(BILESEN_SUFFIX[key])) return key; }
  return null;
}
function isEmriValid(code){
  if(Object.keys(STATE.validIsEmri||{}).length===0) return true; // liste boşsa doğrulama yapılmaz
  const upper = String(code||'').trim().toUpperCase();
  if(STATE.validIsEmri[upper]) return true;
  const base = baseIsEmriNo(upper);
  return base !== upper && !!STATE.validIsEmri[base];
}
// Girilen İş Emri No (Talep No) için, ERP listesinden eşleşen malzeme kodu/adı bilgisini döner
// (varsa) — operatöre/şefe "bu talep no hangi malzemeye ait" bilgisini anında göstermek için.
function getTalepInfo(code){
  if(!code) return null;
  const upper = String(code||'').trim().toUpperCase();
  let v = STATE.validIsEmri && STATE.validIsEmri[upper];
  if(!v){ const base = baseIsEmriNo(upper); if(base!==upper) v = STATE.validIsEmri && STATE.validIsEmri[base]; }
  return (v && typeof v === 'object') ? v : null;
}
let extraMachines = {}; // admin tarafından sonradan eklenen makineler (Firebase 'machines_extra')
let hiddenMachines = {}; // silinen dahili makineler (Firebase 'machines_hidden')
let fasonMachines = {}; // "Fason / Dışarı Gönderim" olarak işaretlenen makineler (Firebase 'machines_fason')
function allMachines(){ return MACHINE_LIST.filter(m=>!hiddenMachines[m.code]).concat(Object.entries(extraMachines).map(([code,v])=>({code, name:v.name}))); }
// Fason makinede (ör. dışarıya ısıl işleme giden) aynı anda birden fazla parti/iş emri açılabilir;
// "makine meşgul" kısıtı burada uygulanmaz. Ayrıca bu makinelerdeki aktif işler, fasonYetkisi verilen
// operatörlere kim başlatmış olursa olsun görünür ve onlar tarafından kapatılabilir.
function isFasonMachine(makineLabel){
  const code = String(makineLabel||'').split(' · ')[0];
  return !!fasonMachines[code];
}
function toggleMachineFason(code){
  if(!session || !(session.isSuperAdmin || session.isSef)){ toast('Bu işlem için yetkin yok'); return; }
  DB.ref('machines_fason/'+code).set(!fasonMachines[code]);
}
function toggleFasonYetkisi(code){
  const op = STATE.operators[code] || {};
  DB.ref('operators/'+code+'/fasonYetkisi').set(!op.fasonYetkisi);
}
// Makineleri "İmalat Atölye" / "Tadilat Atölye" olarak ikiye ayırmak için (Firebase 'machines_atolye').
// Belirtilmemiş makineler varsayılan olarak İmalat Atölye sayılır.
let machineAtolye = {};
function machineAtolyeOf(code){ return machineAtolye[code]==='tadilat' ? 'tadilat' : 'imalat'; }
function setMachineAtolye(code, val){
  if(!session || !(session.isSuperAdmin || session.isSef)){ toast('Bu işlem için yetkin yok'); return; }
  DB.ref('machines_atolye/'+code).set(val);
}
// Personeli (hem sıradan operatörleri hem tadilat açabilen yönetici/şef hesaplarını) İmalat/Tadilat
// Atölye'ye ata — artık ikili (ya bu ya o) değil, çoklu seçim: hiçbiri/biri/ikisi de işaretlenebilir
// (0-1-2 durumu). Bir kullanıcının hem Bekleyen listesi hem Yeni Talep formundaki atölye seçeneği
// buradan türetiliyor. Hiçbiri işaretli değilse (ve eski tekil "atolye" alanı da yoksa) varsayılan
// İmalat Atölye sayılır ki kimse yanlışlıkla erişimsiz kalmasın.
function getUserAtolyeler(code){
  const op = STATE.operators[code] || {};
  if(op.isSuperAdmin) return ['imalat','tadilat']; // SuperAdmin her zaman her iki atölyeyi de görür/yönetir
  if(op.atolyeImalat===undefined && op.atolyeTadilat===undefined){
    return op.atolye==='tadilat' ? ['tadilat'] : ['imalat']; // eski tekil alan / hiç ayarlanmamış
  }
  const list = [];
  if(op.atolyeImalat) list.push('imalat');
  if(op.atolyeTadilat) list.push('tadilat');
  return list.length>0 ? list : ['imalat'];
}
function toggleUserAtolye(code, which){
  if(!session || !(session.isSuperAdmin || session.isSef)){ toast('Bu işlem için yetkin yok'); return; }
  const cur = getUserAtolyeler(code);
  const isImalat = cur.includes('imalat'), isTadilat = cur.includes('tadilat');
  DB.ref('operators/'+code).update({
    atolyeImalat: which==='imalat' ? !isImalat : isImalat,
    atolyeTadilat: which==='tadilat' ? !isTadilat : isTadilat
  });
}

     kendi kalan boyu var (ör. 2344 Ø18'den 2000mm'lik ve 1500mm'lik iki ayrı çubuk). Tüketirken
     operatör HANGİ çubuktan kesileceğini seçer, kestiği mm'yi girer, o çubuğun boyu düşer.
*/

function uzunDurusluKayitlar(){
  // Normal imalat/tadilat rota kayıtları (entries) + devam eden tadilat operasyonları, birleşik liste.
  if(!uzunDurusUyariEnabled()) return [];
  const esik = uzunDurusEsikMs();
  const sonuc = [];
  entriesArray().forEach(e=>{
    if(e.status==='duruş' && e.duruşTs && e.duruşNedeni!==GUN_SONU_REASON){
      const ms = nowTick - e.duruşTs;
      if(ms>=esik) sonuc.push({ tur:'entry', makine:e.makine, isEmriNo:e.isEmriNo||e.talepNo, operatorName:e.operatorName, operatorUsername:e.operatorUsername, neden:e.duruşNedeni, ms, ref:e });
    }
  });
  tadilatArray().forEach(t=>{
    tadilatOperasyonlarArray(t).forEach(op=>{
      if(op.status==='duruş' && op.duruşTs && op.duruşNedeni!==GUN_SONU_REASON){
        const ms = nowTick - op.duruşTs;
        if(ms>=esik) sonuc.push({ tur:'tadilat', makine:op.makine, isEmriNo:t.uKodu, operatorName:op.operatorName, operatorUsername:op.operatorUsername, neden:op.duruşNedeni, ms, ref:op });
      }
    });
  });
  return sonuc.sort((a,b)=>b.ms-a.ms);
}

        <div class="table-wrap" style="padding:0"><table><thead><tr><th>Makine</th><th>İş Emri</th><th>Operatör</th><th>Neden</th><th>Süre</th></tr></thead><tbody>
          ${list.map(r=>`<tr><td class="mono" style="color:var(--accent)">${esc((r.makine||'').split(' · ')[0]||'—')}</td><td class="mono">${esc(r.isEmriNo||'—')}</td><td>${esc(r.operatorName||r.operatorUsername||'—')}</td><td style="color:var(--warn)">${esc(r.neden||'—')}</td><td style="font-weight:700;color:var(--danger)">${fmtDur(r.ms)}</td></tr>`).join('')}
        </tbody></table></div>`}
      </div>
    </div>
  </div>`;
}
function stockItemsArray(){ return Object.entries(stockItems).map(([id,v])=>({id, ...v})).sort((a,b)=>(a.kod||'').localeCompare(b.kod||'')); }
function lotsArray(item){ return Object.entries(item.lots||{}).map(([id,v])=>({id, ...v})).sort((a,b)=>(b.boy||0)-(a.boy||0)); }
// Bir isEmriNo için daha önce hiç kayıt açılmamışsa "ilk operasyon"dur — hammadde tüketimi
// sadece bu noktada sorulur, rotanın sonraki adımlarında tekrar sorulmaz.
function isFirstOperationFor(isEmriNo){
  if(!isEmriNo) return true;
  return !entriesArray().some(e => e.isEmriNo === isEmriNo);
}
/* ===================== KISMİ AKTARIM (FAZ 5 / MADDE 7) =====================
   Bir iş emrinin, mevcut operasyonu tam bitmeden ELİNDEKİ HAZIR ADEDİ bir sonraki operasyona
   aktarabilme özelliği. Mantık: mevcut kayıttan bir "parti" (kısmi adet) koparılıp AYRI bir
   kayıt olarak "tamamlandi, son operasyon değil" şeklinde işaretlenir; orijinal kayıt kalan
   adetle çalışmaya devam eder. Biri o iş emrini tekrar açtığında (aynı Talep No ile), bekleyen
   parti varsa otomatik olarak ona bağlanır (parentEntryId) — ayrı bir "bekleyen partiler" ekranı
   AÇMADAN, mevcut "Talep No'yu tekrar gir" akışına sessizce entegre olur.
   partiRootId: aynı soydan gelen TÜM kayıtların (orijinal + tüm parçaları) paylaştığı ortak kök
   id — Tamamlanan Kodlar/Excel/Rapor'da hepsi TEK bir iş emri olarak gruplanabilsin diye.
   parentEntryId: bu kayıt hangi kayıttan koptu/devam ediyor (soy ağacı, sadece iç mantık için).
*/
let kismiAktarId = null;
function openKismiAktar(id){
  const e = STATE.entries[id]; if(!e) return;
  if(e.sonOperasyon){ toast('Son operasyon olarak işaretli işlerde kısmi aktarım yapılmaz — bu, rotayı kapatan adımdır.'); return; }
  kismiAktarId = id;
  render();
}
function cancelKismiAktar(){ kismiAktarId = null; render(); }
// Bu iş emri (isEmriNo) için "tamamlanmış ama son operasyon değil VE henüz kimse devam etmemiş"
// bekleyen bir parti var mı? Varsa, yeni açılan kayıt otomatik olarak ona (parentEntryId ile) bağlanır.
function findPendingParti(isEmriNo){
  if(!isEmriNo) return null;
  const all = entriesArray();
  const claimedParentIds = new Set(all.filter(e=>e.parentEntryId).map(e=>e.parentEntryId));
  return all.find(e => e.isEmriNo===isEmriNo && e.partiRootId && e.status==='tamamlandi' && !e.sonOperasyon && !claimedParentIds.has(e.id)) || null;
}
// Rapor ekranında "unutulmasın" diye gösterilecek — hiç kimsenin henüz devralmadığı, bekleyen
// TÜM partileri döner (Tadilat modülündeki "gölgede kalan iş" uyarısıyla aynı mantık).
function pendingPartiList(){
  const all = entriesArray();
  const claimedParentIds = new Set(all.filter(e=>e.parentEntryId).map(e=>e.parentEntryId));
  return all.filter(e => e.partiRootId && e.status==='tamamlandi' && !e.sonOperasyon && !claimedParentIds.has(e.id));
}
function confirmKismiAktar(id){
  const e = STATE.entries[id]; if(!e) return;
  const miktarRaw = (document.getElementById('kismi-aktar-adet')?.value||'').trim();
  const miktar = Number(miktarRaw);
  const mevcut = Number(e.adet)||0;
  if(!miktarRaw || !Number.isFinite(miktar) || miktar<=0){ toast('Geçerli bir adet girin'); return; }
  if(!Number.isInteger(miktar)){ toast('Adet tam sayı olmalı'); return; }
  if(miktar>=mevcut){ toast(`Kalan adedin tamamını (${mevcut}) aktaracaksan "Bitir" kullan — Kısmi Aktar sadece BİR KISMINI ayırmak içindir.`); return; }
  const now = Date.now();
  const rootId = e.partiRootId || e.id; // ilk kez bölünüyorsa bu kayıt kendisi kök olur
  const kalan = mevcut - miktar;
  const childId = uid();
  const childEntry = {
    isEmriNo: e.isEmriNo, talepNo: e.talepNo||'', makine: e.makine,
    malzemeCinsi: e.malzemeCinsi||'', capBoy: e.capBoy||'', not: e.not||'',
    adet: String(miktar), sonOperasyon:false,
    operatorUsername: e.operatorUsername, operatorName: e.operatorName,
    startedByUsername: e.startedByUsername||e.operatorUsername, startedByName: e.startedByName||e.operatorName,
    startTs: e.startTs, endTs: now, status:'tamamlandi',
    duruşToplamMs:0, excludedMs:0,
    partiRootId: rootId, parentEntryId: e.id
  };
  const updates = {};
  updates['entries/'+childId] = childEntry;
  updates['entries/'+id+'/adet'] = String(kalan);
  updates['entries/'+id+'/partiRootId'] = rootId;
  DB.ref().update(updates).then(()=>{
    kismiAktarId = null;
    bigToast(`${miktar} adet bir sonraki operasyona aktarıldı — ${kalan} adet ile burada devam ediyorsun.`);
    render();
  }).catch(err=>{ console.error(err); toast('Aktarılamadı: '+(err&&err.message||'hata')); });
}
function renderKismiAktarModal(){
  const e = STATE.entries[kismiAktarId];
  if(!e){ kismiAktarId=null; return ''; }
  return `<div class="modal-overlay" onclick="if(event.target===this) cancelKismiAktar()">
    <div class="modal-box" style="max-width:400px">
      <div class="modal-header">
        <div><div class="modal-title" style="font-size:18px">${ico('shuffle',14)} Kısmi Aktar</div><div class="modal-sub">${esc(e.talepNo||e.isEmriNo)} · Mevcut adet: ${esc(e.adet)}</div></div>
        <button class="icon-btn" onclick="cancelKismiAktar()">${ico('x',14)}</button>
      </div>
      <div class="modal-body">
        <div class="field"><label>Kaç adet hazır, bir sonraki operasyona aktarılsın?</label><input id="kismi-aktar-adet" inputmode="numeric" placeholder="ör. 200" oninput="this.value=this.value.replace(/\\D/g,'')" autofocus></div>
        <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:14px">Bu miktar mevcut kayıttan düşülür ve ayrı, bekleyen bir parti olarak işaretlenir. Aynı Talep No ile yeni bir kayıt açan (bir sonraki operasyonu yapacak) kişi otomatik olarak bu partiye bağlanır. Sen kalan adetle burada çalışmaya devam edersin.</div>
        <div style="display:flex;gap:10px">

          <button class="btn-ghost" onclick="cancelKismiAktar()">${ico('x',14)} Vazgeç</button>
        </div>
      </div>
    </div>
  </div>`;
}
// Forma tek bir düz liste olarak basılacak seçenekler: adet kalemleri tek seçenek, boy kalemleri
// HER LOT ayrı bir seçenek olarak (operatör hangi çubuğu kullanacağını doğrudan seçsin).
function stockConsumableOptions(){
  const opts = [];
  stockItemsArray().forEach(it=>{
    if(it.tur==='boy'){
      lotsArray(it).forEach(lot=>{
        opts.push({
          value: it.id+'::'+lot.id, itemId: it.id, lotId: lot.id, tur:'boy',
          label: `${it.kod}${it.cap?' '+it.cap:''} · ${lot.boy}${it.birim||'mm'} kaldı`,
          remaining: lot.boy, birim: it.birim||'mm'
        });
      });
    } else {
      opts.push({
        value: it.id, itemId: it.id, lotId: null, tur:'adet',
        label: `${it.kod}${it.isim?' — '+it.isim:''} (mevcut: ${it.miktar} ${it.birim||'adet'})`,
        remaining: it.miktar, birim: it.birim||'adet', mode: it.mode
      });
    }
  });
  return opts;
}
function stockOptionByValue(val){ return stockConsumableOptions().find(o=>o.value===val) || null; }
function consumeStock(itemId, lotId, miktar, meta){
  if(!itemId || !miktar) return;
  const item = stockItems[itemId]; if(!item) return;
  if(item.tur==='boy' && lotId){
    const lot = (item.lots||{})[lotId]; if(!lot) return;
    const yeniBoy = (Number(lot.boy)||0) - Number(miktar);
    DB.ref(`stockItems/${itemId}/lots/${lotId}/boy`).set(yeniBoy);
    const hid = uid();
    DB.ref('stockHareketleri/'+hid).set({
      itemId, lotId, itemKod: item.kod||'', itemIsim: `${item.cap||''} (${lot.boy}${item.birim||'mm'} çubuk)`, miktar: -Number(miktar), birim: item.birim||'mm',
      isEmriNo: meta.isEmriNo||'', talepNo: meta.talepNo||'', operatorUsername: session.username, operatorName: session.displayName, ts: Date.now()
    });
  } else {
    const yeniMiktar = (Number(item.miktar)||0) - Number(miktar);
    DB.ref('stockItems/'+itemId+'/miktar').set(yeniMiktar);
    const hid = uid();
    DB.ref('stockHareketleri/'+hid).set({
      itemId, itemKod: item.kod||'', itemIsim: item.isim||'', miktar: -Number(miktar), birim: item.birim||'',
      isEmriNo: meta.isEmriNo||'', talepNo: meta.talepNo||'', operatorUsername: session.username, operatorName: session.displayName, ts: Date.now()
    });
  }
}
let stokAddTurState = 'adet';
function addStockItem(){
  if(!canManageStock()) return;
  const tur = stokAddTurState;
  const kod = (document.getElementById('stok-kod')?.value||'').trim();
  if(!kod){ toast('Stok kodu girin'); return; }
  const id = uid();
  if(tur==='boy'){
    const cap = (document.getElementById('stok-cap')?.value||'').trim();
    const birim = document.getElementById('stok-birim-boy')?.value||'mm';
    const ilkBoy = Number(document.getElementById('stok-ilk-boy')?.value||0);
    if(ilkBoy<=0){ toast('İlk boy (mm) girin'); return; }
    const lotId = uid();
    DB.ref('stockItems/'+id).set({ kod, tur:'boy', cap, birim, lots: { [lotId]: { boy: ilkBoy } } }).then(()=>{
      toast('Boy takipli stok kalemi eklendi (1 çubuk ile)');
      ['stok-kod','stok-cap','stok-ilk-boy'].forEach(fid=>{ const el=document.getElementById(fid); if(el) el.value=''; });
    });
  } else {
    const isim = (document.getElementById('stok-isim')?.value||'').trim();
    const birim = document.getElementById('stok-birim')?.value||'adet';
    const miktar = Number(document.getElementById('stok-miktar')?.value||0);
    const mode = document.getElementById('stok-mode')?.value||'oto';
    DB.ref('stockItems/'+id).set({ kod, tur:'adet', isim, birim, miktar, mode }).then(()=>{
      toast('Stok kalemi eklendi');
      ['stok-kod','stok-isim','stok-miktar'].forEach(fid=>{ const el=document.getElementById(fid); if(el) el.value=''; });
    });
  }
}

function deleteStockLot(itemId, lotId){

/* ===================== TADİLAT (REWORK) MODÜLÜ =====================
   Yöneticiler (Şef/SuperAdmin, veya izin verilen diğer admin hesapları) tadilat talebi açar
   (hangi U kodundan kaç adetin, hangi bölümün talebiyle, ne işlem için tadilata alınacağı).
   Operatör üretim işini "Tadilat" duruş sebebiyle durdurunca Tadilat sekmesine düşer, bekleyen
   taleplerden birini alır, bitirince otomatik olarak üretim işi "Tadilat Sonrası Ayar" duruşuna
   geçer — operatör kaldığı yerden devam edebilir.

   Çok operasyonlu yapı: Her tadilat talebi, üretim rotası gibi birden fazla "operasyon" adımından
   oluşabilir (tadilatlar/$id/operasyonlar/$opId). Bir operatör bir talebi alıp "Son Operasyon" tikini
   İŞARETLEMEDEN bitirirse, talep tekrar "bekleyen" listesine düşer — bir sonraki operatör (aynı ya da
   farklı kişi) devam eder. Sadece sonOperasyon=true olan bir operasyon tamamlanınca talep gerçekten
   kapanır. Talebin durumu (bekliyor/aktif/tamamlandı) hep operasyonlardan TÜRETİLİR, ayrı bir
   "status" alanı tutmuyoruz — tek doğruluk kaynağı operasyon listesi.
*/

// Tadilat için detaylı analiz: toplam süre, atölye kırılımı, kişi bazlı ve günlük dakika.
// G DÜZELTMESİ (iki nokta):
// 1) Artık isteğe bağlı bir [fromDate, toDate] tarih aralığı kabul ediyor (dönem karşılaştırması
//    yapılabilsin diye) — ikisi de boş bırakılırsa eskisi gibi TÜM geçmişi hesaplar.
// 2) Süre artık ham (bitisTs-baslamaTs) değil, entryDurationBreakdown() ile duruş süresi
//    DÜŞÜLMÜŞ net süre — bir tadilat operasyonu status:'duruş' olabiliyor (ör. malzeme
//    beklerken), eskiden bu bekleme süresi de "çalışma" gibi sayılıyordu.
function computeTadilatAnaliz(fromDate, toDate){
  const ops = [];
  let gecisToplamMs = 0;
  const gecisByPerson = {};
  tadilatArray().forEach(t=>{
    tadilatOperasyonlarArray(t).forEach(o=>{
      if(o.baslamaTs && o.bitisTs){
        const dk = dateKey(o.baslamaTs);
        if((!fromDate || dk>=fromDate) && (!toDate || dk<=toDate)){
          ops.push({ ...o, uKodu:t.uKodu, atolye:(t.atolye||'imalat'), _netMs: entryDurationBreakdown(o).netMs });
        }
      }
      // Kesinti sırasında "hangi işi alacağım" kararı verilirken geçen süre — duruşa sayılmıyor,
      // ayrı takip ediliyor (sadece SuperAdmin'in gördüğü bu Analiz ekranında).
      if(o.gecisSureToplamMs){
        gecisToplamMs += o.gecisSureToplamMs;
        gecisByPerson[o.operatorUsername] = (gecisByPerson[o.operatorUsername]||0) + o.gecisSureToplamMs;
      }
    });
  });
  const toplamMs = ops.reduce((s,o)=>s+o._netMs,0);
  const byAtolye = { imalat:{ms:0,count:0}, tadilat:{ms:0,count:0} };
  ops.forEach(o=>{ byAtolye[o.atolye].ms += o._netMs; byAtolye[o.atolye].count++; });
  const byPersonMap = {};
  ops.forEach(o=>{
    const k = o.operatorUsername;
    if(!byPersonMap[k]) byPersonMap[k] = { username:o.operatorUsername, name:o.operatorName, ms:0, count:0, imalatMs:0, tadilatMs:0 };
    byPersonMap[k].ms += o._netMs;
    byPersonMap[k].count++;
    byPersonMap[k][o.atolye+'Ms'] += o._netMs;
  });
  const byDayMap = {};
  ops.forEach(o=>{
    const dk = dateKey(o.baslamaTs);
    if(!byDayMap[dk]) byDayMap[dk] = { imalatMs:0, tadilatMs:0, count:0 };
    byDayMap[dk][o.atolye+'Ms'] += o._netMs;
    byDayMap[dk].count++;
  });
  const byDay = Object.entries(byDayMap).map(([gun,v])=>({gun, ...v, toplamMs:v.imalatMs+v.tadilatMs})).sort((a,b)=>b.gun.localeCompare(a.gun));
  return {
    opCount: ops.length, toplamMs, byAtolye,
    byPerson: Object.values(byPersonMap).sort((a,b)=>b.ms-a.ms),
    byDay, gecisToplamMs, gecisByPerson
  };
}

let _tadilatArrayCache = null, _tadilatArrayCacheSrc = null;
function tadilatArray(){

// Eski (tek operasyonlu) kayıtlarla geriye dönük uyumluluk: operasyonlar alanı yoksa, eski
// düz alanlardan (baslayanUsername, baslamaTs, status...) tek bir "sonOperasyon" operasyonu türetiyoruz.
function tadilatOperasyonlarArray(t){
  if(t.operasyonlar) return Object.entries(t.operasyonlar).map(([id,v])=>({id, ...v})).sort((a,b)=>a.baslamaTs-b.baslamaTs);
  if(t.baslayanUsername){
    return [{ id:'legacy', operatorUsername:t.baslayanUsername, operatorName:t.baslayanName, baslamaTs:t.baslamaTs||0, bitisTs:t.bitisTs||null, status: t.status==='tamamlandi'?'tamamlandi':'devam', sonOperasyon:true, kaynakEntryId:t.kaynakEntryId||null }];
  }
  return [];
}
function tadilatAktifOperasyon(t){ return tadilatOperasyonlarArray(t).find(o=>o.status==='devam') || null; }
// Bir makinede şu an aktif bir tadilat operasyonu var mı? Makine Matrisi'nde ayrı bir renk/durum
// olarak göstermek için (üretim "entries" tablosunda hiç izi olmasa bile).
function tadilatAktifOnMachine(makineLabel){
  if(!makineLabel) return null;
  for(const t of tadilatArray()){
    const op = tadilatAktifOperasyon(t);
    if(op && op.makine===makineLabel) return { tadilat:t, operasyon:op };
  }
  return null;
}
function tadilatTamamlandiMi(t){ return tadilatOperasyonlarArray(t).some(o=>o.status==='tamamlandi' && o.sonOperasyon); }
function tadilatBekliyorMu(t){ return !tadilatTamamlandiMi(t) && !tadilatOperasyonlarArray(t).some(o=>o.status==='devam'||o.status==='duruş'); }
function tadilatBekleyenler(atolye){
  const list = tadilatArray().filter(t=>tadilatBekliyorMu(t)).sort((a,b)=>a.olusturmaTs-b.olusturmaTs);
  return atolye ? list.filter(t=>(t.atolye||'imalat')===atolye) : list;
}
// Bir kullanıcının erişebildiği TÜM atölyelerdeki bekleyen talepleri birleştirir (tekrarsız).
function tadilatBekleyenlerCombined(code){
  const atolyeler = getUserAtolyeler(code);
  const seen = new Set(); const out = [];
  atolyeler.forEach(a=>{ tadilatBekleyenler(a).forEach(t=>{ if(!seen.has(t.id)){ seen.add(t.id); out.push(t); } }); });
  return out;
}
function myActiveTadilatSession(){
  let paused = null;
  for(const t of tadilatArray()){
    const op = tadilatOperasyonlarArray(t).find(o=>o.status!=='tamamlandi' && o.operatorUsername===session.username);
    if(op){
      if(op.status==='devam') return { tadilat:t, operasyon:op };
      if(op.status==='duruş' && !paused) paused = { tadilat:t, operasyon:op };
    }
  }
  return paused;
}
// Kesinti zinciri yüzünden bir operatörün AYNI ANDA birden fazla yarım tadilatı olabilir (biri
// aktif, diğerleri duraklatılmış) — Makineler listesinde HİÇBİRİ kaybolmasın diye hepsini döner.
function myAllTadilatSessions(){
  const out = [];
  tadilatArray().forEach(t=>{
    tadilatOperasyonlarArray(t).forEach(op=>{
      if(op.status!=='tamamlandi' && op.operatorUsername===session.username) out.push({ tadilat:t, operasyon:op });
    });
  });
  return out.sort((a,b)=>{
    if(a.operasyon.status==='devam' && b.operasyon.status!=='devam') return -1;
    if(b.operasyon.status==='devam' && a.operasyon.status!=='devam') return 1;
    return (b.operasyon.duruşTs||b.operasyon.baslamaTs||0) - (a.operasyon.duruşTs||a.operasyon.baslamaTs||0);
  });
}

  const { tadilat: t, operasyon: op } = sess;
  const isInterrupt = isTadilatReason(reason);
  // Kesinti durumunda (başka bir tadilata geçiş) gerçek duruş sayacı HEMEN başlamıyor — hangi işi
  // alacağına karar verirken geçen süre A'nın duruşuna sayılmasın diye. Bu "seçim süresi" ayrı
  // (gecisBaslangic) tutuluyor; yeni tadilat FİİLEN başladığı an gerçek duruş sayacı da başlıyor
  // (bkz. tadilatAl), o ana kadarki fark ise "gecisSureToplamMs" olarak (sadece SuperAdmin görür) kaydediliyor.
  DB.ref(`tadilatlar/${t.id}/operasyonlar/${op.id}`).update({
    status:'duruş', duruşNedeni: reason,
    duruşTs: isInterrupt ? null : Date.now(),
    gecisBaslangic: isInterrupt ? Date.now() : null
  }).then(()=>{
    tadilatDurusPickerOpen = false; durusReasonSel=''; durusCustom='';
    toast('Duruş kaydedildi');
    if(isInterrupt){
      bigToast('Tadilat duraklatıldı — diğer tadilata geçebilirsin.');
      tadilatForceBekleyen = true;
      view = 'tadilat';
    } else {
      bigToast('Tadilat duraklatıldı.');
    }
    render();
  }).catch(err=>{ console.error(err); toast('Duraklatılamadı: '+(err&&err.message||'hata')); });
}
function devamEtTadilatDurus(){
  const sess = myActiveTadilatSession();
  if(!sess || sess.operasyon.status!=='duruş') return;
  const { tadilat: t, operasyon: op } = sess;
  const extra = op.duruşTs ? Math.max(0, Date.now()-op.duruşTs) : 0;
  const duruşToplamMs = (op.duruşToplamMs||0) + extra;
  const durusLog = (!isNaN(extra) && op.duruşNedeni!==GUN_SONU_REASON) ? appendDurusLog(op.durusLog, op.duruşNedeni, extra) : (op.durusLog||null);
  // GÜN SONU süresini de (durusLog'a benzer şekilde) zaman damgalı ayrı bir listede tutuyoruz —
  // yoksa "hangi gün ne kadarı Gün Sonu'na ait" bilinemiyor, günlere bölünürken bu süre ya hiç
  // düşülmüyor (Özet tablosu şişiyor) ya da yanlış güne düşülüyor (Gantt'ta iş "hiç yapılmamış"
  // gibi sıfırlanıyor) — bkz. renderMachineModal'daki gün-bazlı bölme mantığı.
  const excludedLog = (!isNaN(extra) && op.duruşNedeni===GUN_SONU_REASON) ? appendDurusLog(op.excludedLog, op.duruşNedeni, extra) : (op.excludedLog||null);
  // Hiç gerçek duruş başlamadan (kesinti sonrası "hangi işi alacağım" kararı verilirken) direkt
  // "Devam Ettir"e basılırsa, o karar süresi de geçiş süresine (duruşa değil) ekleniyor.
  const gecisEk = (!op.duruşTs && op.gecisBaslangic) ? Math.max(0, Date.now()-op.gecisBaslangic) : 0;
  const gecisSureToplamMs = (op.gecisSureToplamMs||0) + gecisEk;
  DB.ref(`tadilatlar/${t.id}/operasyonlar/${op.id}`).update({ status:'devam', duruşNedeni:null, duruşTs:null, gecisBaslangic:null, duruşToplamMs, gecisSureToplamMs, durusLog, excludedLog }).then(()=>{
    toast('Duruş kaydedildi');
    render();
  });
}

function tadilatAl(tadilatId, makine){
  const t = tadilatlar[tadilatId]; if(!t || !tadilatBekliyorMu(t)){ toast('Bu talep şu an müsait değil'); return; }
  if(!makine){ toast('Hangi makinede yapacağını seç'); return; }
  // Kaynak önceliği: önce operatörün "Tadilat duruşu" ile duraklattığı BAŞKA bir tadilat var mı
  // bak (iç içe kesinti zinciri) — yoksa madde 3/4'teki gibi duraklattığı bir üretim işine bak.
  const kaynakTad = myActiveTadilatSession();
  const kaynakTadGecerli = kaynakTad && kaynakTad.operasyon.status==='duruş' && isTadilatReason(kaynakTad.operasyon.duruşNedeni);
  const kaynak = !kaynakTadGecerli ? entriesArray().find(e => e.operatorUsername===session.username && e.status==='duruş' && isTadilatReason(e.duruşNedeni)) : null;
  const opId = uid();
  const now = Date.now();
  // Duraklattığı tadilat (kaynakTad) için gerçek duruş sayacı ŞİMDİ başlıyor — o ana kadar (hangi
  // işi alacağına karar verirken) geçen süre duruşa hiç sayılmıyor, ayrı bir alanda toplanıyor.
  if(kaynakTadGecerli){
    const kOp = kaynakTad.operasyon;
    const gecisSuresi = kOp.gecisBaslangic ? Math.max(0, now - kOp.gecisBaslangic) : 0;
    DB.ref(`tadilatlar/${kaynakTad.tadilat.id}/operasyonlar/${kOp.id}`).update({
      duruşTs: now, gecisBaslangic: null,
      gecisSureToplamMs: (kOp.gecisSureToplamMs||0) + gecisSuresi
    });
  }
  DB.ref(`tadilatlar/${tadilatId}/operasyonlar/${opId}`).set({
    operatorUsername: session.username, operatorName: session.displayName, makine,
    baslamaTs: now, bitisTs: null, status:'devam', sonOperasyon: false,
    kaynakEntryId: kaynak ? kaynak.id : null,
    kaynakTadilatRef: kaynakTadGecerli ? { tadilatId: kaynakTad.tadilat.id, opId: kaynakTad.operasyon.id } : null
  }).then(()=>{
    activeTadilatId = tadilatId;
    activeTadilatOpId = opId;
    tadilatMakineSecimId = null;
    tadilatForceBekleyen = false;
    render();
  }).catch(err=>{ console.error(err); toast('Tadilat alınamadı: '+(err&&err.message||'hata')); });
}
// Aktif operasyonu bitirir. "Son operasyon mu" kararı artık İŞE BAŞLARKEN değil, İŞİ BİTİRİRKEN
// veriliyor — çünkü operatör çoğu zaman işin tek seferde mi bitecek yoksa devamı mı gelecek
// bunu ancak işin içine girince anlıyor. sonOperasyon true ise talep tamamen kapanır; false ise
// talep tekrar "bekleyen" listesine döner (bir sonraki operasyon için). Kaynak (üretim işi VEYA
// duraklatılmış başka bir tadilat) varsa, bu SADECE bu operatörün kendi duraklattığı şeyi geri
// getirir — talebin genel kapanma durumundan bağımsız çalışır.
function tadilatBitir(tadilatId, opId, sonOperasyon){
  const t = tadilatlar[tadilatId]; if(!t) return;
  const isLegacy = !t.operasyonlar && opId==='legacy';
  const opRefPath = isLegacy ? null : `tadilatlar/${tadilatId}/operasyonlar/${opId}`;
  const op = tadilatOperasyonlarArray(t).find(o=>o.id===opId);
  if(!op){ toast('Operasyon bulunamadı'); return; }
  const bitisTs = Date.now();
  const writeP = isLegacy
    ? DB.ref('tadilatlar/'+tadilatId).update({ status:'tamamlandi', bitisTs }) // eski kayıt formatı
    : DB.ref(opRefPath).update({ status:'tamamlandi', bitisTs, sonOperasyon: !!sonOperasyon });
  writeP.then(()=>{
    let kaynakVarMi = false, kaynakTadilatVarMi = false;
    // Önce iç içe kesinti zinciri: duraklatılmış başka bir tadilat varsa ona dön.
    if(op.kaynakTadilatRef && op.kaynakTadilatRef.tadilatId){
      const kt = tadilatlar[op.kaynakTadilatRef.tadilatId];
      const kop = kt && kt.operasyonlar && kt.operasyonlar[op.kaynakTadilatRef.opId];
      if(kop && kop.status==='duruş'){
        // Duraklatılmış tadilatı olduğu gibi (hâlâ duruşta) bırakıyoruz — operatör "Devam Ettir"e
        // basınca kaldığı yerden sürdürüyor. Burada sadece ekranı ona yönlendiriyoruz.
        activeTadilatId = op.kaynakTadilatRef.tadilatId;
        activeTadilatOpId = op.kaynakTadilatRef.opId;
        kaynakTadilatVarMi = true;
      }
    }
    if(!kaynakTadilatVarMi && op.kaynakEntryId){
      const src = STATE.entries[op.kaynakEntryId];
      if(src && src.status==='duruş'){
        const extra = src.duruşTs ? Math.max(0, Date.now()-src.duruşTs) : 0;
        const duruşToplamMs = (src.duruşToplamMs||0) + extra;
        const durusLog = (src.duruşNedeni!==GUN_SONU_REASON) ? appendDurusLog(src.durusLog, src.duruşNedeni, extra) : (src.durusLog||null);
        const excludedLog = (src.duruşNedeni===GUN_SONU_REASON) ? appendDurusLog(src.excludedLog, src.duruşNedeni, extra) : (src.excludedLog||null);
        DB.ref('entries/'+op.kaynakEntryId).update({ duruşNedeni: TADILAT_SONRASI_REASON, duruşTs: Date.now(), duruşToplamMs, durusLog, excludedLog });
        kaynakVarMi = true;
      }
    }
    if(!kaynakTadilatVarMi) { activeTadilatId = null; activeTadilatOpId = null; }
    if(sonOperasyon){
      bigToast(kaynakTadilatVarMi
        ? 'Tadilat tamamlandı. Duraklattığın önceki tadilata dönüyorsun.'
        : kaynakVarMi
        ? 'Tadilat tamamlandı. Tadilat duruşu devam ettirildi ve tadilat sonrası ayar duruşu başlatıldı.'
        : 'Tadilat tamamlandı.');
    } else {
      bigToast(kaynakTadilatVarMi
        ? 'Bu operasyon tamamlandı, tadilat sıradaki operasyonu bekliyor. Duraklattığın önceki tadilata dönüyorsun.'
        : kaynakVarMi
        ? 'Bu operasyon tamamlandı, tadilat sıradaki operasyonu bekliyor. Tadilat duruşu devam ettirildi ve tadilat sonrası ayar duruşu başlatıldı.'
        : 'Bu operasyon tamamlandı — tadilat sıradaki operasyon için bekleyenler listesine döndü.');
    }
    if(!kaynakTadilatVarMi && kaynakVarMi) activeDetailId = op.kaynakEntryId;
    view = kaynakTadilatVarMi ? 'tadilat' : 'list';
    render();
  }).catch(err=>{ console.error(err); toast('Tadilat bitirilemedi: '+(err&&err.message||'hata')); });
}

/* ===================== PUSH BİLDİRİMİ (FCM) =====================
   Firebase Console → Project Settings → Cloud Messaging → Web Push certificates'ten
   ürettiğin VAPID public key'i buraya yapıştır. Boş bırakılırsa bildirim özelliği
   sessizce devre dışı kalır (hata vermez), uygulamanın geri kalanı normal çalışır. */
const VAPID_KEY = 'BCzH63ol7xwko9kjQRuDHDXK8IwyD5E3vq4TaP5Pd3W6bUay1BzR1J2lTcn1x4FRXoM6SsaLiT5ZCAGz7pMyIZs';

function pushConfigured(){ return VAPID_KEY && VAPID_KEY.indexOf('BURAYA')<0; }
let pushPermissionState = (typeof Notification!=='undefined') ? Notification.permission : 'unsupported'; // 'default' | 'granted' | 'denied' | 'unsupported'

/* Bu cihaz için sabit bir kimlik — tarayıcının localStorage'ında kalıcı olarak saklanıyor.
   Token'lar artık bu ID'ye göre kaydediliyor (fcmTokens/{deviceId}: token), token değeri
   kendisine göre değil — böylece aynı cihazda "Bildirimleri Aç"a tekrar basılsa ya da FCM
   token'ı arka planda yenilense bile, HEP AYNI YUVAYA yazılır, eski token'lar birikip aynı

function pushDeviceId(){

/* Uygulama ÖN PLANDAYKEN (sekme/uygulama açık ve odaklanmış) gelen mesajlar, service worker'ın
   onBackgroundMessage'ından GEÇMEZ — Firebase bunu bilerek böyle tasarlamış, "zaten kullanıcı
   uygulamanın içinde, gerek yok" varsayımıyla. Ama masaüstünde/laptop'ta insanlar genelde
   sekmeyi hep açık/odaklı tutuyor, telefonda da uygulama içindeyken aynı durum oluyor — yani
   pratikte KULLANICI HİÇBİR ZAMAN bildirim görmüyordu. Bu yüzden ön plan mesajlarını da AYRICA
   burada elle yakalayıp, arka plandakiyle aynı şekilde (service worker üzerinden) gösteriyoruz.
   Sadece bir kere kurulması yeterli, VAPID key olmasa bile hata vermez (mesaj hiç gelmez). */
function setupForegroundPushListener(){
  if(!pushConfigured() || typeof firebase.messaging!=='function') return;
  try{
    const messaging = firebase.messaging();
    messaging.onMessage((payload) => {
      const title = payload.data?.title || 'Rota Takip';
      const body = payload.data?.body || '';
      const tag = payload.data?.tag || 'rota-takip-uyari';
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistration().then(reg=>{
          if(reg) reg.showNotification(title, { body, icon:'/icon-192.png', badge:'/icon-192.png', tag, data: payload.data||{} });
          else toast(title+': '+body); // service worker hiç kayıtlı değilse en azından uygulama içi bildirim göster
        });
      } else {
        toast(title+': '+body);
      }
    });
  }catch(err){ console.warn('Ön plan push dinleyicisi kurulamadı:', err); }
}

async function enablePushNotifications(){
  if(!session) return;
  if(typeof Notification==='undefined' || !('serviceWorker' in navigator)){
    toast('Bu tarayıcı bildirim desteklemiyor'); return;
  }
  if(!pushConfigured()){ toast('Bildirim sistemi henüz kurulmadı (VAPID key eksik)'); return; }
  try{
    const reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
    const perm = await Notification.requestPermission();
    pushPermissionState = perm;
    if(perm !== 'granted'){ toast('Bildirim izni verilmedi'); render(); return; }
    const messaging = firebase.messaging();
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if(token){
      DB.ref('operators/'+session.username+'/fcmTokens/'+pushDeviceId()).set(token);
      toast('Bildirimler açıldı ✓');
    }
  }catch(err){
    console.error('Push kayıt hatası:', err);
    toast('Bildirim açılamadı: '+(err.message||'bilinmeyen hata'));
  }
  render();
}

async function doLogin(){
  const uname = (document.getElementById('login-username').value||'').trim().toUpperCase();
  const pass = document.getElementById('login-password').value||'';
  const remember = !!document.getElementById('login-remember')?.checked;
  const op = STATE.operators[uname];
  const hash = pass ? await sha256Hex(pass) : '';
  const legacyPlaintextMatch = !!op && op.password === pass && op.password !== hash;
  const passOk = !!op && (op.password === hash || legacyPlaintextMatch);
  if(!op || !passOk){
    loginError = 'Kullanıcı adı veya şifre hatalı';
    toast(loginError);
    render();
    return;
  }
  if(legacyPlaintextMatch){ DB.ref('operators/'+uname+'/password').set(hash); } // sessiz göç
  loginError = '';
  session = { username: uname, displayName: op.displayName, isAdmin: !!op.isAdmin, isSuperAdmin: !!op.isSuperAdmin, isSef: !!op.isSef, isUretimSef: !!op.isUretimSef };
  if(remember){ save('rota_remember', true); save('rota_session', session); }
  else { save('rota_remember', false); save('rota_session', null); }
  view = session.isAdmin ? ((session.isSef || session.isUretimSef) ? 'matrix' : 'report') : 'list';
  if(!session.isAdmin) newForm.makine = op.defaultMachine || '';
  render();
}

async function changePassword(){
  const cur = document.getElementById('pw-current').value||'';
  const next = (document.getElementById('pw-next').value||'').replace(/\D/g,'').slice(0,8);
  const conf = (document.getElementById('pw-confirm').value||'').replace(/\D/g,'').slice(0,8);
  if(!/^\d{1,8}$/.test(next)){ toast('Yeni şifre en fazla 8 haneli rakam olmalı'); return; }
  if(next!==conf){ toast('Yeni şifreler eşleşmiyor'); return; }
  const op = STATE.operators[session.username];
  const curHash = cur ? await sha256Hex(cur) : '';
  const curOk = !!op && (op.password === curHash || op.password === cur); // eski düz metin kayıtları için de kabul
  if(!op || !curOk){ toast('Mevcut şifre yanlış'); return; }
  const nextHash = await sha256Hex(next);
  DB.ref('operators/'+session.username+'/password').set(nextHash);
  toast('Şifre güncellendi');
  setView('list');
}

function getAllowedMachines(){

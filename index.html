const DEFAULT_DURUS_REASONS = ["Arıza / Bakım","Malzeme Bekleniyor","Kalıp/Takım Değişimi","Program/Ayar Değişimi","Kalite Kontrol Bekleniyor","Elektrik/Basınçlı Hava Kesintisi","Operatör Molası","Farklı İş Emrine Geçiş","Tuvalet"];
const GUN_SONU_REASON = "Gün Sonu (Mesai Bitti, yarın devam edilecek)";
const TADILAT_REASON = "Tadilat";
const TADILAT_SONRASI_REASON = "Tadilat Sonrası Ayar";
function getDurusReasons(){
  const custom = (STATE.durusReasons && STATE.durusReasons.length>0) ? STATE.durusReasons : DEFAULT_DURUS_REASONS;
  const hasTadilat = custom.some(r=>isTadilatReason(r));
  return [...custom, ...(hasTadilat?[]:[TADILAT_REASON]), GUN_SONU_REASON, "Diğer"];
}
// Admin'in Duruş Nedenleri listesine "Tadilat", "Tadilat Duruşu" gibi kendi yazdığı bir metin

function isTadilatReason(r){
  if(!r) return false;
  const s = String(r).toLowerCase();
  return s.includes('tadilat') && r!==TADILAT_SONRASI_REASON;
}
// Stil amaçlı: hem "Tadilat" hem "Tadilat Sonrası Ayar" için (ikisi de tadilatla ilgili duruş).
function isTadilatRelated(r){ return !!r && String(r).toLowerCase().includes('tadilat'); }
function effectiveDurusMs(e){
  let d = e.duruşToplamMs||0;
  if(e.status==='duruş' && e.duruşTs && e.duruşNedeni!==GUN_SONU_REASON) d += Math.max(0, nowTick - e.duruşTs);
  return d;
}
function effectiveExcludedMs(e){
  let d = e.excludedMs||0;
  if(e.status==='duruş' && e.duruşTs && e.duruşNedeni===GUN_SONU_REASON) d += Math.max(0, nowTick - e.duruşTs);
  return d;
}
function effectiveDurusReason(e){
  // Duraklatılmış bir işin en son nedeni Gün Sonu olabilir ama duruşToplamMs'de daha
  // önceki (Gün Sonu'ndan önceki) GERÇEK bir duruştan kalma süre birikmiş olabilir.
  // Bu durum sadece "şu an duraklı" iken değil, iş sonradan devam edip bitse bile
  // kalıcı olarak veride kalıyor — o yüzden statüden bağımsız olarak düzeltiyoruz.
  if(e.duruşNedeni===GUN_SONU_REASON && (e.duruşToplamMs||0)>0) return 'Belirtilmemiş (önceki duraklama)';

}

/* ===================== BİLEŞEN (KOVAN/KARBÜR) AYRIMI =====================
   Bazı malzemelerde kalıp iki farklı yarı mamulden oluşuyor (kovan/sıkma çemberi ve karbür),
   bunlar farklı rotalarda ayrı ayrı işlenip sonra shrink-fit ile birleşiyor. ERP (Canias)
   bu iki yarı mamulü _ZARF (kovan) ve _ELMAS (karbür) ekleriyle ayırıyor; aynı mantığı
   burada da kullanıyoruz ki rotalar birbirine karışmasın. */
const BILESEN_SUFFIX = { ZARF: '_ZARF', ELMAS: '_ELMAS' };
const BILESEN_LABEL = { ZARF: 'Çelik', ELMAS: 'Karbür' };
function baseIsEmriNo(code){
  const s = String(code||'').trim().toUpperCase();
  for(const suf of Object.values(BILESEN_SUFFIX)){ if(s.endsWith(suf)) return s.slice(0, -suf.length); }
  return s;
}
function bilesenOfCode(code){
  const s = String(code||'').trim().toUpperCase();
  for(const key of Object.keys(BILESEN_SUFFIX)){ if(s.endsWith(BILESEN_SUFFIX[key])) return key; }
  return null;
}
function isEmriValid(code){
  if(Object.keys(STATE.validIsEmri||{}).length===0) return true; // liste boşsa doğrulama yapılmaz
  const upper = String(code||'').trim().toUpperCase();
  if(STATE.validIsEmri[upper]) return true;
  const base = baseIsEmriNo(upper);
  return base !== upper && !!STATE.validIsEmri[base];
}
// Girilen İş Emri No (Talep No) için, ERP listesinden eşleşen malzeme kodu/adı bilgisini döner
// (varsa) — operatöre/şefe "bu talep no hangi malzemeye ait" bilgisini anında göstermek için.
function getTalepInfo(code){
  if(!code) return null;
  const upper = String(code||'').trim().toUpperCase();
  let v = STATE.validIsEmri && STATE.validIsEmri[upper];
  if(!v){ const base = baseIsEmriNo(upper); if(base!==upper) v = STATE.validIsEmri && STATE.validIsEmri[base]; }
  return (v && typeof v === 'object') ? v : null;
}

function stockConsumableOptions(){
  const opts = [];
  stockItemsArray().forEach(it=>{
    if(it.tur==='boy'){
      lotsArray(it).forEach(lot=>{
        opts.push({
          value: it.id+'::'+lot.id, itemId: it.id, lotId: lot.id, tur:'boy',

          remaining: lot.boy, birim: it.birim||'mm'
        });
      });
    } else {
      opts.push({
        value: it.id, itemId: it.id, lotId: null, tur:'adet',
        label: `${it.kod}${it.isim?' — '+it.isim:''} (mevcut: ${it.miktar} ${it.birim||'adet'})`,
        remaining: it.miktar, birim: it.birim||'adet', mode: it.mode

    });
  }
}

/* ===================== TADİLAT (REWORK) MODÜLÜ =====================
   Yöneticiler (Şef/SuperAdmin, veya izin verilen diğer admin hesapları) tadilat talebi açar
   (hangi U kodundan kaç adetin, hangi bölümün talebiyle, ne işlem için tadilata alınacağı).
   Operatör üretim işini "Tadilat" duruş sebebiyle durdurunca Tadilat sekmesine düşer, bekleyen
   taleplerden birini alır, bitirince otomatik olarak üretim işi "Tadilat Sonrası Ayar" duruşuna
   geçer — operatör kaldığı yerden devam edebilir.

   Çok operasyonlu yapı: Her tadilat talebi, üretim rotası gibi birden fazla "operasyon" adımından
   oluşabilir (tadilatlar/$id/operasyonlar/$opId). Bir operatör bir talebi alıp "Son Operasyon" tikini
   İŞARETLEMEDEN bitirirse, talep tekrar "bekleyen" listesine düşer — bir sonraki operatör (aynı ya da
   farklı kişi) devam eder. Sadece sonOperasyon=true olan bir operasyon tamamlanınca talep gerçekten
   kapanır. Talebin durumu (bekliyor/aktif/tamamlandı) hep operasyonlardan TÜRETİLİR, ayrı bir
   "status" alanı tutmuyoruz — tek doğruluk kaynağı operasyon listesi.
*/
let tadilatlar = {};
let activeTadilatId = null;   // operatörün şu an üzerinde çalıştığı tadilat talebinin id'si
let activeTadilatOpId = null; // o talebin hangi operasyon kaydı üzerinde çalışıyor
let tadilatExpandedIds = new Set(); // sadeleştirilmiş "Bekleyen" kartlarından hangileri detaylı gösteriliyor
let tadilatSubTab = 'talepler'; // 'talepler' | 'analiz'
function setTadilatSubTab(v){ tadilatSubTab = v; render(); }
// Tadilat için detaylı analiz: toplam süre, atölye kırılımı, kişi bazlı ve günlük dakika.
function computeTadilatAnaliz(){
  const ops = [];
  tadilatArray().forEach(t=>{
    tadilatOperasyonlarArray(t).forEach(o=>{
      if(o.baslamaTs && o.bitisTs) ops.push({ ...o, uKodu:t.uKodu, atolye:(t.atolye||'imalat') });
    });
  });
  const toplamMs = ops.reduce((s,o)=>s+(o.bitisTs-o.baslamaTs),0);
  const byAtolye = { imalat:{ms:0,count:0}, tadilat:{ms:0,count:0} };
  ops.forEach(o=>{ byAtolye[o.atolye].ms += (o.bitisTs-o.baslamaTs); byAtolye[o.atolye].count++; });
  const byPersonMap = {};
  ops.forEach(o=>{
    const k = o.operatorUsername;
    if(!byPersonMap[k]) byPersonMap[k] = { username:o.operatorUsername, name:o.operatorName, ms:0, count:0, imalatMs:0, tadilatMs:0 };
    byPersonMap[k].ms += (o.bitisTs-o.baslamaTs);
    byPersonMap[k].count++;
    byPersonMap[k][o.atolye+'Ms'] += (o.bitisTs-o.baslamaTs);
  });
  const byDayMap = {};
  ops.forEach(o=>{
    const dk = dateKey(o.baslamaTs);
    if(!byDayMap[dk]) byDayMap[dk] = { imalatMs:0, tadilatMs:0, count:0 };
    byDayMap[dk][o.atolye+'Ms'] += (o.bitisTs-o.baslamaTs);
    byDayMap[dk].count++;
  });
  const byDay = Object.entries(byDayMap).map(([gun,v])=>({gun, ...v, toplamMs:v.imalatMs+v.tadilatMs})).sort((a,b)=>b.gun.localeCompare(a.gun));
  return {
    opCount: ops.length, toplamMs, byAtolye,
    byPerson: Object.values(byPersonMap).sort((a,b)=>b.ms-a.ms),
    byDay
  };
}

function tadilatArray(){ return Object.entries(tadilatlar).map(([id,v])=>({id, ...v})); }
// Eski (tek operasyonlu) kayıtlarla geriye dönük uyumluluk: operasyonlar alanı yoksa, eski
// düz alanlardan (baslayanUsername, baslamaTs, status...) tek bir "sonOperasyon" operasyonu türetiyoruz.
function tadilatOperasyonlarArray(t){
  if(t.operasyonlar) return Object.entries(t.operasyonlar).map(([id,v])=>({id, ...v})).sort((a,b)=>a.baslamaTs-b.baslamaTs);
  if(t.baslayanUsername){
    return [{ id:'legacy', operatorUsername:t.baslayanUsername, operatorName:t.baslayanName, baslamaTs:t.baslamaTs||0, bitisTs:t.bitisTs||null, status: t.status==='tamamlandi'?'tamamlandi':'devam', sonOperasyon:true, kaynakEntryId:t.kaynakEntryId||null }];
  }
  return [];
}
function tadilatAktifOperasyon(t){ return tadilatOperasyonlarArray(t).find(o=>o.status==='devam') || null; }
// Bir makinede şu an aktif bir tadilat operasyonu var mı? Makine Matrisi'nde ayrı bir renk/durum
// olarak göstermek için (üretim "entries" tablosunda hiç izi olmasa bile).
function tadilatAktifOnMachine(makineLabel){
  if(!makineLabel) return null;
  for(const t of tadilatArray()){
    const op = tadilatAktifOperasyon(t);
    if(op && op.makine===makineLabel) return { tadilat:t, operasyon:op };
  }
  return null;
}
function tadilatTamamlandiMi(t){ return tadilatOperasyonlarArray(t).some(o=>o.status==='tamamlandi' && o.sonOperasyon); }
function tadilatBekliyorMu(t){ return !tadilatTamamlandiMi(t) && !tadilatAktifOperasyon(t); }
function tadilatBekleyenler(atolye){
  const list = tadilatArray().filter(t=>tadilatBekliyorMu(t)).sort((a,b)=>a.olusturmaTs-b.olusturmaTs);
  return atolye ? list.filter(t=>(t.atolye||'imalat')===atolye) : list;
}
// Bir kullanıcının erişebildiği TÜM atölyelerdeki bekleyen talepleri birleştirir (tekrarsız).
function tadilatBekleyenlerCombined(code){
  const atolyeler = getUserAtolyeler(code);
  const seen = new Set(); const out = [];
  atolyeler.forEach(a=>{ tadilatBekleyenler(a).forEach(t=>{ if(!seen.has(t.id)){ seen.add(t.id); out.push(t); } }); });
  return out;
}

// Aktif operasyonu bitirir. "Son operasyon mu" kararı artık İŞE BAŞLARKEN değil, İŞİ BİTİRİRKEN
// veriliyor — çünkü operatör çoğu zaman işin tek seferde mi bitecek yoksa devamı mı gelecek
// bunu ancak işin içine girince anlıyor. sonOperasyon true ise talep tamamen kapanır; false ise
// talep tekrar "bekleyen" listesine döner (bir sonraki operasyon için). Kaynak üretim işi varsa
// (madde 3+4), bu SADECE bu operatörün kendi duraklattığı işi geri getirir — talebin genel kapanma
// durumundan bağımsız çalışır.
function tadilatBitir(tadilatId, opId, sonOperasyon){
  const t = tadilatlar[tadilatId]; if(!t) return;
  const isLegacy = !t.operasyonlar && opId==='legacy';
  const opRefPath = isLegacy ? null : `tadilatlar/${tadilatId}/operasyonlar/${opId}`;
  const op = tadilatOperasyonlarArray(t).find(o=>o.id===opId);
  if(!op){ toast('Operasyon bulunamadı'); return; }
  const bitisTs = Date.now();
  const writeP = isLegacy
    ? DB.ref('tadilatlar/'+tadilatId).update({ status:'tamamlandi', bitisTs }) // eski kayıt formatı
    : DB.ref(opRefPath).update({ status:'tamamlandi', bitisTs, sonOperasyon: !!sonOperasyon });
  writeP.then(()=>{
    let kaynakVarMi = false;
    if(op.kaynakEntryId){
      const src = STATE.entries[op.kaynakEntryId];
      if(src && src.status==='duruş'){
        const extra = src.duruşTs ? Math.max(0, Date.now()-src.duruşTs) : 0;
        const duruşToplamMs = (src.duruşToplamMs||0) + extra;
        DB.ref('entries/'+op.kaynakEntryId).update({ duruşNedeni: TADILAT_SONRASI_REASON, duruşTs: Date.now(), duruşToplamMs });
        kaynakVarMi = true;
      }
    }
    activeTadilatId = null; activeTadilatOpId = null;
    if(sonOperasyon){
      bigToast(kaynakVarMi
        ? 'Tadilat tamamlandı. Tadilat duruşu devam ettirildi ve tadilat sonrası ayar duruşu başlatıldı.'
        : 'Tadilat tamamlandı.');
    } else {
      bigToast(kaynakVarMi
        ? 'Bu operasyon tamamlandı, tadilat sıradaki operasyonu bekliyor. Tadilat duruşu devam ettirildi ve tadilat sonrası ayar duruşu başlatıldı.'
        : 'Bu operasyon tamamlandı — tadilat sıradaki operasyon için bekleyenler listesine döndü.');
    }
    if(kaynakVarMi) activeDetailId = op.kaynakEntryId;
    view = 'list';
    render();
  }).catch(err=>{ console.error(err); toast('Tadilat bitirilemedi: '+(err&&err.message||'hata')); });
}

function saveEditActive(id){
  const before = STATE.entries[id] || {};
  const isEmriNo = (document.getElementById('edit-isemri').value||'').trim();
  const malzemeCinsi = (document.getElementById('edit-malzeme-cinsi').value||'').trim();
  const capBoy = (document.getElementById('edit-cap-boy').value||'').trim();
  const adet = (document.getElementById('edit-adet').value||'').trim();
  const not = (document.getElementById('edit-not').value||'').trim();
  const sonOperasyon = !!document.getElementById('edit-son-operasyon')?.checked;
  if(!isEmriNo){ toast('İş Emri No (U kodu) boş olamaz'); return; }
  if(!adet){ toast('Adet boş olamaz'); return; }
  if(!/^\d+$/.test(adet)){ toast('Adet sadece rakam olmalı'); return; }

  const fieldLabels = { isEmriNo:'İş Emri No (U kodu)', malzemeCinsi:'Malzeme Cinsi', capBoy:'Çap ve Boy', adet:'Adet', not:'Not', sonOperasyon:'Son Operasyon' };
  const after = { isEmriNo, malzemeCinsi, capBoy, adet, not, sonOperasyon };
  const changes = [];
  Object.keys(fieldLabels).forEach(f=>{
    const oldV = f==='sonOperasyon' ? (before[f]?'Evet':'Hayır') : (before[f]||'');
    const newV = f==='sonOperasyon' ? (after[f]?'Evet':'Hayır') : (after[f]||'');
    if(oldV !== newV) changes.push({ field: fieldLabels[f], oldValue: oldV||'—', newValue: newV||'—' });
  });

  DB.ref('entries/'+id).update(after);

  if(changes.length>0){
    const mid = uid();
    DB.ref('messages/'+mid).set({
      type: 'edit', isEmriNo: before.isEmriNo, operatorUsername: session.username, operatorName: session.displayName,
      makine: before.makine||'', changes, ts: Date.now(), read: false
    });
  }

  toast('Güncellendi');
  editingActiveId = null;
  render();
}

// Girilen İş Talep No'yu gerçek takip koduna (U kodu + varsa bileşen eki) çevirir.
// Rota takibi (isEmriNo/tur/zincir hesapları) tarihten beri U kodu üzerinden çalıştığı için
// bunu koruyoruz; operatör sadece talep no giriyor, sistem arka planda U koduna çeviriyor.
// Bir talep no altında _ZARF/_ELMAS olarak ayrı ayrı işlenen dallardan hangileri henüz
// gerçekten bitmemiş (son operasyon işaretlenmemiş)? Ana/Tek Parça (birleştirme) işini
// başlatmadan önce bunu kontrol ediyoruz, çünkü shrink-fit birleşimi ancak her iki dal da
// gerçekten tamamlanınca mantıklı.
function incompleteBilesenBranches(talepNoRaw){
  const talepNo = String(talepNoRaw||'').trim().toUpperCase();
  if(!talepNo) return [];
  const out = [];
  ['ZARF','ELMAS'].forEach(suf=>{
    const branchEntries = entriesArray().filter(e => (e.talepNo||'').toUpperCase()===talepNo && bilesenOfCode(e.isEmriNo)===suf);
    if(branchEntries.length===0) return;
    const last = branchEntries.slice().sort((a,b)=>b.startTs-a.startTs)[0];
    const done = last.status==='tamamlandi' && !!last.sonOperasyon;
    if(!done){
      const durum = (last.status==='devam'||last.status==='duruş') ? 'aktif' : 'tamamlanmamış (son operasyon işaretlenmemiş)';
      out.push({ suf, durum });
    }
  });
  return out;
}
function resolveTrackingCode(talepNoRaw, bilesenSel){
  const talepNo = String(talepNoRaw||'').trim().toUpperCase();
  const info = getTalepInfo(talepNo);
  const uKodu = (info && info.malzemeKodu) ? info.malzemeKodu.trim().toUpperCase() : talepNo; // eşleşme yoksa talep no'yu kendisi takip kodu olsun
  const isEmriNo = uKodu + (bilesenSel ? BILESEN_SUFFIX[bilesenSel] : '');
  return { isEmriNo, talepNo };
}
function baslat(){
  const makine = document.getElementById('nf-makine').value||'';
  const malzemeCinsi = (document.getElementById('nf-malzeme-cinsi').value||'').trim();
  const capBoy = (document.getElementById('nf-cap-boy').value||'').trim();
  const not = (document.getElementById('nf-not').value||'').trim();
  const sonOperasyon = !!document.getElementById('nf-son-operasyon')?.checked;
  const canCoklu = !!(STATE.operators[session.username]||{}).cokluIsEmri;

  if(!getAllowedMachines().includes(makine)){ toast('Listeden geçerli bir makine seçin'); return; }

  if(canCoklu && newForm.cokluMode){
    // Çoklu İş Emri: aynı makinede, aynı anda birden fazla İş Emri No — her birinin kendi adediyle
    const items = newForm.cokluItems.map((it,i)=>{
      const raw = (document.getElementById('nf-coklu-isemri-'+i)?.value||'').trim();
      const bilesen = document.getElementById('nf-coklu-bilesen-'+i)?.value||'';
      return {
        talepNoRaw: raw,
        bilesen,
        adet: (document.getElementById('nf-coklu-adet-'+i)?.value||'').trim(),
        stockItemId: document.getElementById('nf-coklu-stok-'+i)?.value||'',
        stockMiktar: (document.getElementById('nf-coklu-stok-miktar-'+i)?.value||'').trim()
      };
    });
    if(items.length===0){ toast('En az bir İş Emri No girin'); return; }
    for(const it of items){
      if(!it.talepNoRaw){ toast('Tüm İş Emri No alanlarını doldurun'); return; }
      if(!it.adet){ toast('Tüm Adet alanlarını doldurun'); return; }
      if(!/^\d+$/.test(it.adet)){ toast('Adet sadece rakam olmalı'); return; }
      if(!isEmriValid(it.talepNoRaw)){
        toast(`"${it.talepNoRaw}" bulunamadı, lütfen kodunuzu kontrol edin`); return;
      }
      if(!it.bilesen){
        const incomplete = incompleteBilesenBranches(it.talepNoRaw);
        if(incomplete.length>0){
          const msg = incomplete.map(x=>`_${x.suf} (${BILESEN_LABEL[x.suf]}) operasyonu ${x.durum}`).join(' ve ');
          toast(`"${it.talepNoRaw}": Tamamlanmamış ${msg} — bu iş emrine (birleştirme) önce onlar bitmeden başlanamaz.`); return;
        }
      }
    }
    const groupId = uid();
    items.forEach(it=>{
      const id = uid();
      const { isEmriNo, talepNo } = resolveTrackingCode(it.talepNoRaw, it.bilesen);
      const wasFirst = isFirstOperationFor(isEmriNo);
      const entry = { isEmriNo, talepNo, makine, malzemeCinsi, capBoy, adet: it.adet, not, sonOperasyon, operatorUsername:session.username, operatorName:session.displayName, startedByUsername:session.username, startedByName:session.displayName, startTs:Date.now(), endTs:null, status:'devam', duruşToplamMs:0, excludedMs:0, groupId };
      DB.ref('entries/'+id).set(entry);
      if(stockEnabled() && wasFirst && it.stockItemId){
        const [selItemId, selLotId] = it.stockItemId.split('::');
        const stItem = stockItems[selItemId];
        const miktar = selLotId ? (Number(it.stockMiktar)||0) : (stItem && stItem.mode==='oto' ? Number(it.adet)||0 : Number(it.stockMiktar)||0);
        if(miktar>0) consumeStock(selItemId, selLotId||null, miktar, { isEmriNo, talepNo });
      }
    });
    toast(`${items.length} iş emri birlikte başlatıldı`);
    newForm = { isEmriNo:'', bilesen:'', makine: (STATE.operators[session.username]||{}).defaultMachine || '', malzemeCinsi:'', capBoy:'', adet:'', not:'', sonOperasyon:false, stockItemId:'', stockMiktar:'', cokluMode:false, cokluItems:[{isEmriNo:'',bilesen:'',adet:'',stockItemId:'',stockMiktar:''},{isEmriNo:'',bilesen:'',adet:'',stockItemId:'',stockMiktar:''}] };
    activeGroupId = groupId;
    activeDetailId = null;
    view = 'list';
    render();
    return;
  }

  // Tekli mod (varsayılan)
  const isEmriNoRaw = (document.getElementById('nf-isemri').value||'').trim();
  const bilesenSel = document.getElementById('nf-bilesen')?.value||'';
  const adet = (document.getElementById('nf-adet').value||'').trim();
  const allowMulti = !!(STATE.operators[session.username]||{}).multiJob;
  if(!allowMulti && myActiveEntries().length>0){ toast('Bu hesap aynı anda tek iş açabilir. Önce mevcut işi bitirmelisin.'); return; }
  if(!isEmriNoRaw){ toast('İş Emri No girin'); return; }
  if(!adet){ toast('Adet girin'); return; }
  if(!/^\d+$/.test(adet)){ toast('Adet sadece rakam olmalı'); return; }
  if(!isEmriValid(isEmriNoRaw)){
    toast('Bu iş emri bulunamadı, lütfen kodunuzu kontrol edin'); return;
  }
  if(!bilesenSel){
    const incomplete = incompleteBilesenBranches(isEmriNoRaw);
    if(incomplete.length>0){
      const msg = incomplete.map(x=>`_${x.suf} (${BILESEN_LABEL[x.suf]}) operasyonu ${x.durum}`).join(' ve ');
      toast(`Tamamlanmamış ${msg} — bu iş emrine (birleştirme) önce onlar bitmeden başlanamaz.`); return;
    }
  }
  const machineBusy = !isFasonMachine(makine) && entriesArray().some(e => e.makine === makine && e.status === 'devam');
  if(machineBusy){ toast('Bu makinede zaten aktif bir iş var. Önce o iş bitirilmeli ya da duraklatılmalı.'); return; }
  const { isEmriNo, talepNo } = resolveTrackingCode(isEmriNoRaw, bilesenSel);
  const wasFirst = isFirstOperationFor(isEmriNo);
  let stockItemIdSel = '', stockLotIdSel = null, stockMiktarSel = 0;
  if(stockEnabled() && wasFirst){
    const rawVal = document.getElementById('nf-stok-item')?.value||'';
    if(rawVal){

      } else {
        stockMiktarSel = Number(adet)||0;
      }
    }
  }
  const id = uid();
  const entry = { isEmriNo, talepNo, makine, malzemeCinsi, capBoy, adet, not, sonOperasyon, operatorUsername:session.username, operatorName:session.displayName, startedByUsername:session.username, startedByName:session.displayName, startTs:Date.now(), endTs:null, status:'devam', duruşToplamMs:0, excludedMs:0 };
  DB.ref('entries/'+id).set(entry);

  toast('Operasyon başlatıldı');
  newForm = { isEmriNo:'', bilesen:'', makine: (STATE.operators[session.username]||{}).defaultMachine || '', malzemeCinsi:'', capBoy:'', adet:'', not:'', sonOperasyon:false, stockItemId:'', stockMiktar:'', cokluMode:false, cokluItems:[{isEmriNo:'',bilesen:'',adet:'',stockItemId:'',stockMiktar:''},{isEmriNo:'',bilesen:'',adet:'',stockItemId:'',stockMiktar:''}] };
  activeDetailId = id;
  view = 'list';
  render();
}
function bitir(id){
  const e = STATE.entries[id] || {};
  let extra = 0;
  if(e.status==='duruş' && e.duruşTs) extra = Date.now() - e.duruşTs;
  const isGunSonu = e.duruşNedeni===GUN_SONU_REASON;

function groupMembersOf(groupId){ return entriesArray().filter(e=>e.groupId===groupId && (e.status==='devam'||e.status==='duruş')); }
function duraklatGrup(groupId){
  const reason = durusReasonSel==='Diğer' ? (document.getElementById('durus-custom')?.value||'').trim() : durusReasonSel;
  if(!reason){ toast('Duruş nedeni seçmelisin'); return; }

  });

  durusOpen=false; durusReasonSel=''; durusCustom='';
}
function devamGrup(groupId){
  const members = groupMembersOf(groupId);
  if(members.length===0) return;
  const makine = members[0].makine;
  const machineBusy = !isFasonMachine(makine) && entriesArray().some(o => o.groupId!==groupId && o.makine===makine && o.status==='devam');
  if(machineBusy){ toast('Bu makinede zaten aktif başka bir iş var. Önce onu bitir ya da duraklat.'); return; }
  const now = Date.now();
  members.forEach(e=>{
    const extra = e.duruşTs ? (now - e.duruşTs) : 0;
    const isGunSonu = e.duruşNedeni===GUN_SONU_REASON;
    const duruşToplamMs = (e.duruşToplamMs||0) + (isGunSonu?0:extra);
    const excludedMs = (e.excludedMs||0) + (isGunSonu?extra:0);
    DB.ref('entries/'+e.id).update({ status:'devam', duruşToplamMs, excludedMs });
  });
  toast('Tüm iş emirleri devam ediyor');
}
function bitirGrup(groupId){
  const members = groupMembersOf(groupId);
  if(members.length===0) return;
  const now = Date.now();
  // Duraklatılmışsa önce ortak duruş süresini kapat (Gün Sonu hariç tutma kuralı aynı şekilde uygulanır).
  const withDurus = members.map(e=>{
    let extra = 0;
    if(e.status==='duruş' && e.duruşTs) extra = now - e.duruşTs;
    const isGunSonu = e.duruşNedeni===GUN_SONU_REASON;
    return { e, duruşToplamMs: (e.duruşToplamMs||0) + (isGunSonu?0:extra), excludedMs: (e.excludedMs||0) + (isGunSonu?extra:0) };
  });
  const totalAdet = withDurus.reduce((s,x)=>s+(Number(x.e.adet)||0), 0);
  const n = withDurus.length;
  withDurus.forEach(x=>{
    const share = totalAdet>0 ? (Number(x.e.adet)||0)/totalAdet : 1/n;
    const wallMs = now - x.e.startTs;
    const allocatedWallMs = Math.round(wallMs*share);
    const allocatedDurusMs = Math.round(x.duruşToplamMs*share);
    const allocatedExcludedMs = Math.round(x.excludedMs*share);
    DB.ref('entries/'+x.e.id).update({
      endTs: x.e.startTs + allocatedWallMs,
      status: 'tamamlandi',
      duruşToplamMs: allocatedDurusMs,
      excludedMs: allocatedExcludedMs,
      finishedByUsername: session.username,
      finishedByName: session.displayName
    });
  });
  toast('Tüm iş emirleri tamamlandı');
  activeGroupId = null; view='list'; render();
}

function normalizeTalepCode(v){
  if(v==null) return '';
  let s = String(v).trim();
  s = s.replace(/\.0$/, ''); // Excel'in tam sayıları bazen "....0" ondalıklı verebiliyor
  s = s.replace(/^[^0-9A-Za-zÇĞİÖŞÜçğıöşü]+|[^0-9A-Za-zÇĞİÖŞÜçğıöşü]+$/g, ''); // baştaki/sondaki başıboş işaretler ("! 123 ?")
  return s.toUpperCase();
}
function uploadIsEmriListesi(){
  if(!canManageIsEmriList()) return;
  const fileInput = document.getElementById('isemri-file-input');
  const file = fileInput?.files?.[0];
  const statusEl = document.getElementById('isemri-upload-status');
  const colName = (document.getElementById('isemri-col-name')?.value||'İş Talep No').trim().toLowerCase();
  if(!file){ toast('Bir dosya seçin'); return; }
  if(statusEl) statusEl.textContent = 'Okunuyor…';
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheetName = wb.SheetNames.find(n => n.toUpperCase().includes('İŞ EMRİ') || n.toUpperCase().includes('IS EMRI')) || wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      if(rows.length===0){ if(statusEl) statusEl.textContent='Dosya boş görünüyor.'; return; }
      const header = rows[0].map(h=>String(h||'').trim().toLowerCase());
      let colIdx = header.findIndex(h => h===colName);
      if(colIdx===-1) colIdx = header.findIndex(h => h.includes(colName));
      if(colIdx===-1){ if(statusEl) statusEl.textContent = `"${colName}" başlıklı sütun bulunamadı (sayfa: ${sheetName}). Sütun adını kontrol edin.`; return; }
      // Malzeme kodu / Malzeme adı sütunlarını da yakalayalım ki İş Talep No girildiğinde hangi
      // malzemeye ait olduğu operatöre/şefe otomatik gösterilebilsin (iki alan birbirine bağlı çünkü).
      const malzKoduIdx = header.findIndex(h => h.includes('malzeme kod'));
      const malzAdiIdx = header.findIndex(h => h.includes('malzeme ad'));
      const codes = {};
      for(let i=1;i<rows.length;i++){
        const s = normalizeTalepCode(rows[i][colIdx]);
        if(!s) continue;
        const malzemeKodu = malzKoduIdx!==-1 ? String(rows[i][malzKoduIdx]||'').trim() : '';
        const malzemeAdi = malzAdiIdx!==-1 ? String(rows[i][malzAdiIdx]||'').trim() : '';
        codes[s] = (malzemeKodu || malzemeAdi) ? { malzemeKodu, malzemeAdi } : true;
      }
      const codeCount = Object.keys(codes).length;
      if(codeCount===0){ if(statusEl) statusEl.textContent = 'Sütunda hiç veri bulunamadı.'; return; }
      DB.ref('validIsEmri').set(codes).then(()=>{
        toast(`${codeCount} İş Talep No yüklendi`);
        if(statusEl) statusEl.textContent = `${codeCount} kayıt başarıyla yüklendi (sayfa: ${sheetName})${malzKoduIdx!==-1?' · malzeme bilgisi de eşleştirildi':''}.`;
        fileInput.value = '';
      });
    } catch(err){
      console.warn(err);
      if(statusEl) statusEl.textContent = 'Dosya okunamadı, .xlsx formatında olduğundan emin olun.';
    }
  };
  reader.readAsArrayBuffer(file);
}

function computeAnalizData(fromDate, toDate, atolyeFilter){
  // Tadilat Atölye makineleri çoğunlukla "entries" tablosunda hiç iz bırakmaz (orada sadece
  // üretim işleri var) — bu yüzden tadilat operasyonlarını da senkron "iş" kaydı gibi katıyoruz,
  // yoksa Tadilat Atölye filtresinde makineler hep "0 dk / hiç kayıt yok" görünür.
  const tadilatSynthetic = [];
  tadilatArray().forEach(t=>{
    tadilatOperasyonlarArray(t).forEach(o=>{
      if(!o.makine || !o.baslamaTs) return;
      tadilatSynthetic.push({
        makine: o.makine, startTs: o.baslamaTs, endTs: o.bitisTs || null,
        status: o.status==='tamamlandi' ? 'tamamlandi' : 'devam',
        duruşToplamMs: 0, excludedMs: 0,
        operatorUsername: o.operatorUsername, operatorName: o.operatorName,
        isEmriNo: t.uKodu, talepNo: t.uKodu, adet: null
      });
    });
  });
  const rangeEntries = [...entriesArray(), ...tadilatSynthetic].filter(e => {
    const dk = dateKey(e.startTs);
    if(dk<fromDate || dk>toDate) return false;
    if(atolyeFilter && atolyeFilter!=='tumu'){
      const code = String(e.makine||'').split(' · ')[0];
      if(machineAtolyeOf(code)!==atolyeFilter) return false;
    }
    return true;
  });
  const isSingleDay = fromDate===toDate;
  const dayStartMs = isSingleDay ? new Date(fromDate+'T00:00:00').getTime() : null;

  const byMachine = {};
  rangeEntries.forEach(e=>{
    const dk = dateKey(e.startTs);
    if(!byMachine[e.makine]) byMachine[e.makine] = { entries: [], operators: new Set(), byDay: {} };
    byMachine[e.makine].entries.push(e);
    byMachine[e.makine].operators.add(`${e.operatorUsername} · ${e.operatorName}`);
    (byMachine[e.makine].byDay[dk] ||= []).push(e);
  });

  const overtimeList = [];
  const perMachine = Object.entries(byMachine).map(([label, data])=>{
    let workMs = 0, durusMs = 0, overtimeMs = 0, availMs = 0;
    Object.entries(data.byDay).forEach(([dk, dayList])=>{
      const dStartMs = new Date(dk+'T00:00:00').getTime();
      const cutoffMs = dStartMs + WORKDAY_END_MINUTE*60000;
      let dayOvertimeMs = 0;
      dayList.forEach(e=>{
        const endClip = e.endTs || nowTick;
        const wallMs = Math.max(0, endClip - e.startTs);
        let eDurusMs = e.duruşToplamMs || 0;
        let eExcludedMs = e.excludedMs || 0;
        // Şu an hâlâ duraklatılmış durumdaysa (henüz "Devam Et"e basılmadıysa), bu ANLIK
        // bekleme süresini de canlı olarak duruş/hariç tutulan süreye ekle — yoksa devam
        // ettirilene kadar geçen her saat yanlışlıkla "çalışma süresi" sayılıyordu.
        if(e.status==='duruş' && e.duruşTs){
          const liveExtra = Math.max(0, nowTick - e.duruşTs);
          if(e.duruşNedeni===GUN_SONU_REASON) eExcludedMs += liveExtra;
          else eDurusMs += liveExtra;
        }
        workMs += Math.max(0, wallMs - eDurusMs - eExcludedMs);
        durusMs += eDurusMs;
        // Şu an duraklatılmış (ör. gün sonu bekleyen) bir iş "hâlâ çalışıyor" sayılıp
        // fazla mesai üretmesin — mesai aşımı sadece fiilen devam eden işler için hesaplanır.
        if(e.status!=='duruş' && endClip > cutoffMs){
          const otMs = endClip - Math.max(cutoffMs, e.startTs);
          if(otMs > 0){
            dayOvertimeMs += otMs;
            overtimeList.push({ makine: label, operatorUsername: e.operatorUsername, operatorName: e.operatorName, isEmriNo: e.isEmriNo, overtimeMin: Math.round(otMs/60000), tarih: dk });
          }
        }
      });
      overtimeMs += dayOvertimeMs;
      availMs += WORKDAY_MINUTES*60000 + dayOvertimeMs; // her kullanılan gün için 540 dk + o günün fazla mesaisi
    });
    const workMin = Math.round(workMs/60000);
    const durusMin = Math.round(durusMs/60000);
    const overtimeMin = Math.round(overtimeMs/60000);
    const availMin = Math.round(availMs/60000);
    const verimlilik = availMin>0 ? Math.min(100, Math.round((workMin/availMin)*100)) : 0;
    return { label, code: label.split(' · ')[0], name: label.split(' · ')[1]||'', operators: [...data.operators], entries: data.entries, workMin, durusMin, overtimeMin, availMin, verimlilik, daysUsed: Object.keys(data.byDay).length };
  }).sort((a,b)=>b.workMin-a.workMin);

  const totals = perMachine.reduce((t,m)=>({
    workMin: t.workMin+m.workMin, durusMin: t.durusMin+m.durusMin, overtimeMin: t.overtimeMin+m.overtimeMin, availMin: t.availMin+m.availMin
  }), {workMin:0, durusMin:0, overtimeMin:0, availMin:0});
  totals.verimlilik = totals.availMin>0 ? Math.min(100, Math.round((totals.workMin/totals.availMin)*100)) : 0;
  totals.bostaMin = Math.max(0, totals.availMin - totals.workMin - totals.durusMin);

  return { perMachine, totals, overtimeList, isSingleDay, dayStartMs, fromDate, toDate };
}

// Aynı İş Emri No tekrar geldiğinde eski "tamamlandı" durumunun sızmaması için:
// her İş Emri No'nun kayıtlarını kronolojik sırayla "tur"lara bölüyoruz. Bir tur,
// sonOperasyon=true VE status='tamamlandi' olan kayıtla kapanır. Kapanan turdaki
// tüm kayıtlar "tamamlanmış rota" sayılır; o turdan SONRA gelen yeni kayıtlar
// otomatik olarak yepyeni, boş bir tur başlatır — eskisinden bağımsız kalır.
function computeCompletedRoutes(){
  const byIsEmri = {};
  entriesArray().forEach(e=>{ (byIsEmri[e.isEmriNo] ||= []).push(e); });
  const routes = [];
  Object.entries(byIsEmri).forEach(([isEmriNo,list])=>{
    list.sort((a,b)=>a.startTs-b.startTs);
    let segment = [];
    list.forEach(e=>{
      segment.push(e);
      if(e.sonOperasyon && e.status==='tamamlandi'){
        routes.push({ isEmriNo, entries: segment.slice(), finishedAt: e.endTs, startedAt: segment[0].startTs });
        segment = [];
      }
    });
  });
  routes.sort((a,b)=> b.finishedAt - a.finishedAt); // en son tamamlanan üstte
  return routes;
}
// _ZARF (Çelik) ve _ELMAS (Karbür) olarak ayrı ayrı takip edilen iki yarı mamulü, aynı taban
// İş Emri No altında eşleştirip "shrink fit" ile gerçekte ne zaman birleştiklerini gösterir.
function computeBirlesmeGroups(){
  const completedBySuffix = {}; // base -> { ZARF: route, ELMAS: route }
  computeCompletedRoutes().forEach(r=>{
    const bl = bilesenOfCode(r.isEmriNo);
    if(!bl) return;
    const base = baseIsEmriNo(r.isEmriNo);
    (completedBySuffix[base] ||= {})[bl] = r;
  });
  const runningBySuffix = {}; // base -> Set('ZARF'|'ELMAS') henüz tamamlanmamış ama kayıtlı
  entriesArray().forEach(e=>{
    const bl = bilesenOfCode(e.isEmriNo);
    if(!bl) return;
    const base = baseIsEmriNo(e.isEmriNo);
    const finishedHere = completedBySuffix[base] && completedBySuffix[base][bl] &&
      completedBySuffix[base][bl].entries.some(x=>x.id===e.id);
    if(!finishedHere) (runningBySuffix[base] ||= new Set()).add(bl);
  });
  const bases = new Set([...Object.keys(completedBySuffix), ...Object.keys(runningBySuffix)]);
  const groups = [];
  bases.forEach(base=>{
    const zarf = completedBySuffix[base]?.ZARF || null;
    const elmas = completedBySuffix[base]?.ELMAS || null;
    const zarfRunning = !zarf && !!runningBySuffix[base]?.has('ZARF');
    const elmasRunning = !elmas && !!runningBySuffix[base]?.has('ELMAS');
    if(!zarf && !elmas && !zarfRunning && !elmasRunning) return;
    const bothDone = !!(zarf && elmas);
    groups.push({
      base, zarf, elmas, zarfRunning, elmasRunning, bothDone,
      birlesmeTs: bothDone ? Math.max(zarf.finishedAt, elmas.finishedAt) : null
    });
  });
  groups.sort((a,b)=>{
    if(a.bothDone !== b.bothDone) return a.bothDone ? -1 : 1;
    const at = a.bothDone ? a.birlesmeTs : Math.max(a.zarf?.finishedAt||0, a.elmas?.finishedAt||0);
    const bt = b.bothDone ? b.birlesmeTs : Math.max(b.zarf?.finishedAt||0, b.elmas?.finishedAt||0);
    return bt - at;
  });
  return groups;
}
function renderDurusBreakdown(entries){
  const byReason = {};
  entries.forEach(e=>{
    const ms = effectiveDurusMs(e);
    if(ms <= 0) return;
    const r = effectiveDurusReason(e);
    byReason[r] = (byReason[r]||0) + ms;
  });
  const rows = Object.entries(byReason).sort((a,b)=>b[1]-a[1]);
  if(rows.length===0) return '';
  return `<div style="margin-bottom:16px">
    <div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Duruş Nedenlerine Göre Dağılım</div>

      ${rows.map(([reason,ms])=>`<div class="chip" style="color:var(--warn);border-color:var(--warn-border);background:var(--warn-soft)">${esc(reason)}: <b>${fmtDur(ms)}</b></div>`).join('')}
    </div>
  </div>`;
}
function computeCompletedRouteIds(){
  const ids = new Set();
  computeCompletedRoutes().forEach(r=>r.entries.forEach(e=>ids.add(e.id)));
  return ids;
}

  const m = allMachines().find(x=>x.code===machineModal);

  // Tüm günler için toplam süre/iş sayısı (zaman çizelgesi bunun üzerine kurulur)
  const byDayAll = {};
  allRows.forEach(e=>{
    const dk = dateKey(e.startTs);
    const dur = e.endTs ? (e.endTs-e.startTs) : (e.status==='devam' ? (nowTick-e.startTs) : 0);
    if(!byDayAll[dk]) byDayAll[dk] = {count:0, ms:0, jobs:new Set()};
    byDayAll[dk].count++; byDayAll[dk].ms += dur; byDayAll[dk].jobs.add(e.isEmriNo);
  });
  const allDays = Object.keys(byDayAll).sort(); // eskiden yeniye, timeline soldan sağa akar
  const maxMs = Math.max(1, ...allDays.map(d=>byDayAll[d].ms));

  const timelineHtml = `<div class="timeline-strip">
    <div class="timeline-all ${!modalDateFilter?'selected':''}" onclick="setModalDateFilter('')" title="Tüm tarihler">
      <div class="timeline-all-icon">⟷</div><div class="timeline-day-label">Tümü</div>
    </div>
    ${allDays.map(d=>{
      const pct = Math.max(6, Math.round((byDayAll[d].ms/maxMs)*100));
      const [, mm, dd] = d.split('-'); const label = `${dd}.${mm}`; // DD.MM
      return `<div class="timeline-day ${modalDateFilter===d?'selected':''}" onclick="setModalDateFilter('${d}')" title="${d} · ${fmtDur(byDayAll[d].ms)} · ${byDayAll[d].jobs.size} iş">
        <div class="timeline-bar-track"><div class="timeline-bar-fill" style="height:${pct}%"></div></div>
        <div class="timeline-day-label">${label}</div>
      </div>`;
    }).join('')}
  </div>`;

  let rows = allRows;
  if(modalDateFilter) rows = rows.filter(e=>dateKey(e.startTs)===modalDateFilter);
  modalVisibleIds = rows.map(e=>e.id);

  const totalMs = rows.reduce((sum,e)=> sum + (e.endTs ? (e.endTs-e.startTs) : (e.status==='devam' ? (nowTick-e.startTs) : 0)), 0);
  const totalDurusMs = rows.reduce((sum,e)=> sum + effectiveDurusMs(e), 0);
  const jobCount = new Set(rows.map(e=>e.isEmriNo)).size;
  const recordCount = rows.length;

  let dailyTable = '';
  if(!modalDateFilter){
    const days = allDays.slice().reverse();
    dailyTable = `<div style="font-size:13px;font-weight:600;margin-bottom:8px">Günlere Göre Özet</div>
      <table style="margin-bottom:20px"><thead><tr><th>Tarih</th><th>Kayıt Sayısı</th><th>İş Sayısı</th><th>Toplam Süre</th></tr></thead><tbody>
      ${days.map(d=>`<tr><td>${d}</td><td>${byDayAll[d].count}</td><td>${byDayAll[d].jobs.size}</td><td>${fmtDur(byDayAll[d].ms)}</td></tr>`).join('')}
      </tbody></table>`;
  }

  return `<div class="modal-overlay" onclick="if(event.target===this) closeMachineDetail()">
    <div class="modal-box">
      <div class="modal-header">
        <div><div class="modal-title">${m.code}</div><div class="modal-sub">${esc(m.name)}</div></div>
        <button class="icon-btn" onclick="closeMachineDetail()">✕</button>
      </div>
      <div class="modal-body">
        ${timelineHtml}
        <div class="modal-filter-row">
          ${canDeleteReport() && modalSelectedIds.size>0 ? `<button class="btn-ghost" style="border-color:var(--danger);color:var(--danger)" onclick="deleteModalSelected()">🗑 Seçilenleri Sil (${modalSelectedIds.size})</button>` : ''}
          <button class="btn-primary" style="width:auto;margin-left:auto;padding:8px 16px" onclick="exportMachineExcel('${machineModal}')">⬇ Excel'e Aktar (${rows.length})</button>
        </div>
        <div class="modal-stats">
          <div class="modal-stat-box"><div class="modal-stat-num">${recordCount}</div><div class="modal-stat-label">Kayıt</div></div>
          <div class="modal-stat-box"><div class="modal-stat-num">${jobCount}</div><div class="modal-stat-label">Farklı İş Emri</div></div>
          <div class="modal-stat-box"><div class="modal-stat-num">${fmtDur(totalMs)}</div><div class="modal-stat-label">Toplam Süre</div></div>
          <div class="modal-stat-box"><div class="modal-stat-num" style="color:var(--warn)">${fmtDur(totalDurusMs)}</div><div class="modal-stat-label">Toplam Duruş</div></div>
        </div>
        ${totalDurusMs>0 ? renderDurusBreakdown(rows) : ''}
        ${dailyTable}
        <div style="font-size:13px;font-weight:600;margin-bottom:8px">${modalDateFilter ? modalDateFilter+' — Detay' : 'Tüm Kayıtlar — Detay (eskiden yeniye)'}</div>
        <table><thead><tr>
          ${canDeleteReport() ? `<th style="width:26px"><input type="checkbox" ${modalVisibleIds.length>0 && modalVisibleIds.every(id=>modalSelectedIds.has(id))?'checked':''} onchange="toggleModalSelectAll()"></th>` : ''}
          <th>Tarih</th><th>İş Emri No</th><th>Malzeme</th><th>Operatör</th><th>Başlangıç</th><th>Bitiş</th><th>Süre</th><th>Durum</th>${canDeleteReport() ? `<th style="width:36px"></th>` : ''}
        </tr></thead><tbody>
        ${rows.length===0 ? `<tr><td colspan="${canDeleteReport()?10:8}" style="text-align:center;color:var(--text-muted);padding:20px">Kayıt yok.</td></tr>` : rows.map(e=>{
          const isDone = computeCompletedRouteIds().has(e.id);
          const statusColor = isDone ? 'var(--success)' : e.status==='devam'?'var(--accent)':e.status==='duruş'?'var(--warn)':'var(--success-soft)';
          const statusLabel = e.status==='devam'?'Devam Ediyor':e.status==='duruş'?'Duruşta':'Tamamlandı';
          const dur = e.endTs ? fmtDur(e.endTs-e.startTs) : (e.status==='devam' ? fmtElapsed(nowTick-e.startTs)+' (sürüyor)' : '—');
          const malzAdi = getTalepInfo(e.talepNo)?.malzemeAdi || e.malzemeCinsi || '—';
          return `<tr style="${isDone?'background:var(--success-row)':''}">
            ${canDeleteReport() ? `<td><input type="checkbox" ${modalSelectedIds.has(e.id)?'checked':''} onchange="toggleModalSelect('${e.id}')"></td>` : ''}
            <td>${dateKey(e.startTs)}</td><td class="mono" style="color:var(--accent)">${esc(e.talepNo || e.isEmriNo)} ${isDone?'✓':''}</td><td style="font-size:12.5px">${esc(malzAdi)}</td><td>${esc(e.operatorUsername)} · ${esc(e.operatorName)}</td><td>${fmtDT(e.startTs)}</td><td>${e.endTs?fmtDT(e.endTs):'—'}</td><td>${dur}</td><td><span style="color:${statusColor};font-weight:600">${isDone?'Rota Tamamlandı':statusLabel}</span></td>
            ${canDeleteReport() ? `<td><button class="del-btn" onclick="deleteModalRecord('${e.id}')" title="Sil">🗑</button></td>` : ''}
          </tr>`;
        }).join('')}
        </tbody></table>
      </div>
    </div>
  </div>`;
}
function renderRouteModal(){
  const tabDefs = [
    { key:'ANA', label:'Ana' },
    { key:'ZARF', label:'_ZARF (Çelik)' },
    { key:'ELMAS', label:'_ELMAS (Karbür)' }
  ].map(t=>({ ...t, list: routesForBaseSuffix(routeModal.base, t.key) })).filter(t=>t.list.length>0);
  if(tabDefs.length===0){ routeModal=null; return ''; }
  let activeTab = tabDefs.find(t=>t.key===routeModal.activeSuffix) || tabDefs[0];
  let route = routeModal.finishedAt ? activeTab.list.find(r=>r.finishedAt===routeModal.finishedAt) : activeTab.list[0];
  if(!route) route = activeTab.list[0];
  if(!route){ routeModal=null; return ''; }

  const malz = route.entries.find(e=>e.malzemeCinsi||e.capBoy) || {};
  const malzText = [malz.malzemeCinsi, malz.capBoy].filter(Boolean).join(' · ');
  const talepNo = route.entries.find(e=>e.talepNo)?.talepNo || '';
  const uKodu = baseIsEmriNo(route.isEmriNo);

  const grandTotalMs = route.entries.reduce((s,e)=>s+(e.endTs?(e.endTs-e.startTs):0),0);
  const grandDurusMs = route.entries.reduce((s,e)=>s+(e.duruşToplamMs||0),0);
  const grandExcludedMs = route.entries.reduce((s,e)=>s+(e.excludedMs||0),0);
  const grandNetMs = grandTotalMs - grandDurusMs - grandExcludedMs;

  const stepsHtml = route.entries.map((e,i)=>{
    const wallMs = e.endTs ? (e.endTs-e.startTs) : 0;
    const durusMs = e.duruşToplamMs||0;
    const netMs = Math.max(0, wallMs - durusMs - (e.excludedMs||0));
    return `<div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:700;font-size:13px">${i+1}. ${esc((e.makine||'').split(' · ')[0]||'—')}</span>
        <span style="color:var(--text-muted);font-size:12px">${esc((e.makine||'').split(' · ')[1]||'')}</span>
      </div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:8px">${esc(e.operatorUsername)} · ${esc(e.operatorName)} &nbsp;·&nbsp; ${fmtDT(e.startTs)} → ${e.endTs?fmtDT(e.endTs):'—'}</div>
      <div style="display:flex;gap:20px;flex-wrap:wrap">
        <div><span style="color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px">Üretim Süresi</span><div style="font-family:'JetBrains Mono',monospace;font-weight:700">${fmtDur(netMs)}</div></div>
        <div><span style="color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px">Duruş Süresi</span><div style="font-family:'JetBrains Mono',monospace;font-weight:700;color:${durusMs>0?'var(--warn)':'var(--text-muted)'}">${fmtDur(durusMs)}</div></div>
        <div><span style="color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px">Toplam (Geçen Zaman)</span><div style="font-family:'JetBrains Mono',monospace;font-weight:700">${fmtDur(wallMs)}</div></div>
      </div>
      ${e.not?`<div style="font-size:12px;color:var(--text-muted);font-style:italic;margin-top:8px">"${esc(e.not)}"</div>`:''}
    </div>`;
  }).join('');

  return `<div class="modal-overlay" onclick="if(event.target===this) closeRouteDetail()">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <div class="modal-title">${esc(talepNo || route.isEmriNo)}</div>
          <div class="modal-sub mono">U kodu: ${esc(uKodu)}${malzText?' · '+esc(malzText):''}</div>
          <div class="modal-sub">Tamamlandı: ${fmtDT(route.finishedAt)}</div>
        </div>
        <button class="icon-btn" onclick="closeRouteDetail()">✕</button>
      </div>
      ${tabDefs.length>1 ? `<div style="display:flex;gap:6px;padding:0 20px;margin-top:10px">
        ${tabDefs.map(t=>`<button class="tab-btn ${t.key===activeTab.key?'active':''}" style="flex:1;font-size:12.5px" onclick="setRouteModalTab('${t.key}')">${t.label}</button>`).join('')}
      </div>` : ''}
      <div class="modal-body">
        <div class="modal-stats">
          <div class="modal-stat-box"><div class="modal-stat-num">${fmtDur(grandNetMs)}</div><div class="modal-stat-label">Toplam Üretim Süresi</div></div>
          <div class="modal-stat-box"><div class="modal-stat-num" style="color:var(--warn)">${fmtDur(grandDurusMs)}</div><div class="modal-stat-label">Toplam Duruş</div></div>
          <div class="modal-stat-box"><div class="modal-stat-num">${route.entries.length}</div><div class="modal-stat-label">Adım</div></div>
        </div>
        <div style="font-size:13px;font-weight:600;margin-bottom:10px">Operasyon Operasyon Detay</div>
        ${stepsHtml}
      </div>
    </div>
  </div>`;
}

  const header = `

  } else {

      <div class="durus-chip-row">
        ${getDurusReasons().map((r,i)=>{
          const isGunSonu = r===GUN_SONU_REASON;
          const isTad = !isGunSonu && isTadilatRelated(r);

          const style = isGunSonu
            ? `border-color:var(--gunsonu);color:var(--gunsonu);background:${isActive?'var(--gunsonu-active-bg)':'var(--gunsonu-med)'};font-weight:700`

    <div style="margin-top:20px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:8px;text-align:left">

      ${groupMembers.map(e=>`
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px">
          <div>

            <div style="font-size:11.5px;color:var(--text-muted)">Adet: ${esc(e.adet||'—')}${e.status==='duruş'?' · Duruşta':''}</div>

            <button class="btn-ghost" onclick="cancelEditActive()">✕ Vazgeç</button>

        <div class="durus-reason-box" style="${active.duruşNedeni===GUN_SONU_REASON?'color:var(--gunsonu);background:var(--gunsonu-soft);border-color:var(--gunsonu-border)':isTadilatRelated(active.duruşNedeni)?'color:var(--tadilat-info);background:var(--tadilat-soft);border-color:var(--tadilat-border)':''}">${active.duruşNedeni===GUN_SONU_REASON?'🌙 ':isTadilatRelated(active.duruşNedeni)?'🔧 ':''}"${esc(active.duruşNedeni)}"</div>
        <div style="display:flex;gap:10px;margin-top:28px">
          <button class="btn-start" style="width:auto;padding:13px 26px" onclick="devamEt('${active.id}')">▶ Devam Ettir</button>
        </div>
        ${editButton}
        ${editBlock}
      </div></div>`;
  }

  let durusBlock;
  if(!durusOpen){
    durusBlock = `<div style="display:flex;gap:10px;margin-top:28px">
      <button class="chip" style="padding:13px 22px" onclick="toggleDurus(true)">⏱ Duruşa Al</button>
      <button class="btn-primary" style="width:auto;padding:13px 22px" onclick="bitir('${active.id}')">■ Bitir</button>
    </div>`;
  } else {
    durusBlock = `<div style="display:flex;flex-direction:column;gap:12px;margin-top:28px;width:100%;max-width:320px">
      <div class="durus-chip-row">
        ${getDurusReasons().map((r,i)=>{
          const isGunSonu = r===GUN_SONU_REASON;
          const isTad = !isGunSonu && isTadilatRelated(r);
          const active = durusReasonSel===r;
          const style = isGunSonu
            ? `border-color:var(--gunsonu);color:var(--gunsonu);background:${active?'var(--gunsonu-active-bg)':'var(--gunsonu-med)'};font-weight:700`
            : isTad
            ? `border-color:var(--tadilat-info);color:var(--tadilat-info);background:${active?'var(--tadilat-active-bg)':'var(--tadilat-med)'};font-weight:700`
            : '';
          return `<button class="chip ${active&&!isGunSonu&&!isTad?'active':''}" style="${style}" onclick="pickDurusReason(${i})">${isGunSonu?'🌙 ':isTad?'🔧 ':''}${esc(r)}</button>`;

      ${durusReasonSel==='Diğer' ? `<input id="durus-custom" placeholder="Nedeni yaz…" value="${esc(durusCustom)}" oninput="durusCustom=this.value">` : ''}
      <div style="display:flex;gap:10px">
        <button class="chip" style="border-color:var(--warn);color:var(--warn)" onclick="confirmDurus('${active.id}')">✓ Duruşu Onayla</button>
        <button class="btn-ghost" onclick="toggleDurus(false)">✕ Vazgeç</button>
      </div>
    </div>`;
  }

  return `<div class="root-mobile theme-${theme}">${header}
    <div class="lock-screen">
      <div class="lock-label">AKTİF OPERASYON</div>
      <div class="lock-id">${esc(active.talepNo || active.isEmriNo)}</div>
      ${active.talepNo ? `<div style="font-size:12px;color:var(--text-muted);margin-top:-4px" class="mono">U kodu: ${esc(active.isEmriNo)}</div>` : ''}
      <div class="lock-machine">${esc(active.makine)}</div>
      <div class="lock-timer">${fmtElapsed(nowTick-active.startTs)}</div>
      <div class="lock-meta">${fmtDT(active.startTs)} itibarıyla devam ediyor</div>
      ${active.adet ? `<div class="lock-meta">Adet: ${esc(active.adet)}</div>` : ''}
      ${active.not ? `<div class="lock-note">"${esc(active.not)}"</div>` : ''}
      ${durusBlock}
      ${editButton}
      ${editBlock}
    </div></div>`;
}

        </div>
        ${(() => {
          const info = getTalepInfo(newForm.isEmriNo);
          const lines = [];
          if(newForm.isEmriNo){
            if(info) lines.push(`<div style="font-size:11.5px;color:var(--success)">✓ ${esc(info.malzemeKodu||'')}${info.malzemeKodu&&info.malzemeAdi?' · ':''}${esc(info.malzemeAdi||'')}</div>`);
            else if(Object.keys(STATE.validIsEmri||{}).length>0) lines.push(`<div style="font-size:11.5px;color:var(--warn)">⚠ Bu talep no listede bulunamadı</div>`);
          }
          if(newForm.bilesen) lines.push(`<div style="font-size:11.5px;color:var(--text-muted)">Kaydedilecek kod: <b class="mono" style="color:var(--accent)">${esc(newForm.isEmriNo||'…')}${BILESEN_SUFFIX[newForm.bilesen]}</b></div>`);
          if(!newForm.bilesen && newForm.isEmriNo){
            const incomplete = incompleteBilesenBranches(newForm.isEmriNo);
            if(incomplete.length>0){
              const msg = incomplete.map(x=>`_${x.suf} (${BILESEN_LABEL[x.suf]}) ${x.durum}`).join(' ve ');
              lines.push(`<div style="font-size:11.5px;color:var(--danger)">⛔ Tamamlanmamış: ${esc(msg)} — birleştirme başlatılamaz</div>`);
            }
          }
          return lines.length ? `<div style="margin:-8px 0 12px 2px;display:flex;flex-direction:column;gap:3px">${lines.join('')}</div>` : '';
        })()}
        ${(() => {
          if(!stockEnabled() || !newForm.isEmriNo) return '';
          const { isEmriNo: previewCode } = resolveTrackingCode(newForm.isEmriNo, newForm.bilesen);
          if(!isFirstOperationFor(previewCode)) return '';
          const opts = stockConsumableOptions();
          if(opts.length===0) return '';
          const selOpt = stockOptionByValue(newForm.stockItemId);
          const isManualInput = selOpt && (selOpt.tur==='boy' || selOpt.mode==='manuel');
          return `<div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px">
            <div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">📦 İlk Operasyon — Kullanılan Hammadde (opsiyonel)</div>
            <select id="nf-stok-item" onchange="newForm.stockItemId=this.value; render()" style="margin-bottom:${isManualInput?'8px':'0'}">
              <option value="">Hammadde tüketilmiyor</option>
              ${opts.map(o=>`<option value="${o.value}" ${newForm.stockItemId===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
            </select>
            ${selOpt ? (isManualInput
              ? `<input id="nf-stok-miktar" type="number" placeholder="${selOpt.tur==='boy'?`Kesilen boy (${esc(selOpt.birim||'mm')})`:`Kullanılan miktar (${esc(selOpt.birim||'')})`}" value="${esc(newForm.stockMiktar)}" oninput="newForm.stockMiktar=this.value">`
              : `<div style="font-size:11.5px;color:var(--text-muted)">Otomatik: Adet kadar (${esc(newForm.adet||'?')} ${esc(selOpt.birim||'')}) düşülecek</div>`) : ''}
          </div>`;
        })()}
      `}
      <div class="field"><label>Çalışılan Makine</label>
        <div style="display:flex;gap:8px">
          <input id="nf-makine" list="makine-options" placeholder="Yazmaya başla… ör. TES" value="${esc(newForm.makine)}" oninput="newForm.makine=this.value" onblur="render()" onfocus="this.select()" style="flex:1">
          <button type="button" class="btn-ghost" title="Temizle" onclick="newForm.makine=''; render(); const el=document.getElementById('nf-makine'); if(el){el.focus();}">✕</button>
        </div>
        <datalist id="makine-options">${allowed.map(m=>`<option value="${esc(m)}">`).join('')}</datalist>
      </div>
      ${(() => {
        const cand = machineHandoffCandidate(newForm.makine);
        if(!cand) return '';
        const groupCount = cand.groupId ? entriesArray().filter(x=>x.groupId===cand.groupId && (x.status==='devam'||x.status==='duruş')).length : 1;
        const durumTxt = cand.status==='duruş' ? `Duruşta: "${esc(cand.duruşNedeni||'')}"` : `${fmtElapsed(nowTick-cand.startTs)} çalışıyor`;
        return `<div style="background:var(--warn-soft);border:1px solid var(--warn-border);border-radius:10px;padding:14px;margin-bottom:14px">
          <div style="font-size:12.5px;color:var(--warn);font-weight:600;margin-bottom:6px">⚠ Bu makinede yarım kalmış ${groupCount>1?`${groupCount} iş emri`:'bir iş'} var</div>
          <div style="font-size:13px;margin-bottom:2px"><span class="mono" style="color:var(--accent)">${esc(cand.talepNo || cand.isEmriNo)}</span>${groupCount>1?` +${groupCount-1} daha`:''} · ${esc(cand.operatorUsername)} · ${esc(cand.operatorName)}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">${durumTxt}${cand.adet?` · Adet: ${esc(cand.adet)}`:''}</div>
          <button type="button" class="btn-ghost" style="border-color:var(--warn);color:var(--warn)" onclick="devralIs('${cand.id}')">↺ ${groupCount>1?'Tümünü Devral':'Bu İşi Devral'} (Kaldığı Yerden Devam Et)</button>
        </div>`;
      })()}
      <div class="field"><label>Malzeme Cinsi (opsiyonel)</label><input id="nf-malzeme-cinsi" placeholder="ör. 4Mo1 ıslahlı" value="${esc(newForm.malzemeCinsi)}" oninput="newForm.malzemeCinsi=this.value"></div>
      <div class="field"><label>Çap ve Boy (opsiyonel)</label><input id="nf-cap-boy" placeholder="ör. Ø26 x 200" value="${esc(newForm.capBoy)}" oninput="newForm.capBoy=this.value"></div>
      ${!newForm.cokluMode ? `<div class="field"><label>Adet</label><input id="nf-adet" inputmode="numeric" placeholder="ör. 120" value="${esc(newForm.adet)}" oninput="this.value=this.value.replace(/\\D/g,''); newForm.adet=this.value" onblur="render()"></div>` : ''}
      <div class="field"><label>Not (opsiyonel)</label><textarea id="nf-not" style="min-height:60px" placeholder="Serbest not" oninput="newForm.not=this.value">${esc(newForm.not)}</textarea></div>
      <label style="display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px;cursor:pointer">
        <input id="nf-son-operasyon" type="checkbox" ${newForm.sonOperasyon?'checked':''} onchange="newForm.sonOperasyon=this.checked" style="width:auto">
        <span style="font-size:13px">Son Operasyon <span style="color:var(--text-muted);font-size:11.5px">(bu adım tamamlanınca iş rotası kapanır)</span></span>
      </label>
      <button class="btn-start" onclick="baslat()">▶ Başla (saat otomatik)</button>
    </div>`;
  } else if(view==='gecmis'){
    const myEntries = entriesArray()
      .filter(e => e.operatorUsername===session.username)
      .filter(e => (!gecmisFrom || dateKey(e.startTs)>=gecmisFrom) && (!gecmisTo || dateKey(e.startTs)<=gecmisTo))
      .filter(e => !gecmisSearch || e.isEmriNo.toLowerCase().includes(gecmisSearch.toLowerCase()) || (e.talepNo||'').toLowerCase().includes(gecmisSearch.toLowerCase()))
      .sort((a,b)=>b.startTs-a.startTs);
    body = `<div class="body-pad">
      <div class="field"><label>İş Emri No / Talep No Ara</label><input id="gecmis-search" class="mono" placeholder="ör. 2607140006" value="${esc(gecmisSearch)}" oninput="setGecmisSearch(this.value)"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <input type="date" class="filter-input" style="flex:1;min-width:130px" value="${esc(gecmisFrom)}" onchange="setGecmisFrom(this.value)" title="Başlangıç">
        <input type="date" class="filter-input" style="flex:1;min-width:130px" value="${esc(gecmisTo)}" onchange="setGecmisTo(this.value)" title="Bitiş">
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
        <button class="chip" onclick="setGecmisPreset(7)">Son 7 Gün</button>
        <button class="chip" onclick="setGecmisPreset(30)">Son 30 Gün</button>
        ${(gecmisFrom||gecmisTo||gecmisSearch) ? `<button class="btn-ghost" onclick="clearGecmisFilter()">✕ Temizle</button>` : ''}
      </div>
      ${myEntries.length===0 ? `<div style="text-align:center;color:var(--text-muted);padding:40px 0">Bu aralıkta kayıt yok.</div>` : myEntries.map(e=>{
        const statusColor = e.status==='devam'?'var(--accent)':e.status==='duruş'?'var(--warn)':'var(--success)';
        const statusLabel = e.status==='devam'?'Devam Ediyor':e.status==='duruş'?'Duruşta':'Tamamlandı';
        const dur = e.endTs ? fmtDur(e.endTs-e.startTs) : (e.status==='devam' ? fmtElapsed(nowTick-e.startTs)+' (sürüyor)' : '—');
        return `<div class="card" style="cursor:pointer" onclick="openEntryDetail('${e.id}')">
          <div class="card-header"><span class="card-id">${esc(e.talepNo || e.isEmriNo)}</span><span class="card-meta">${dateKey(e.startTs)}</span></div>
          ${e.talepNo ? `<div style="font-size:11.5px;color:var(--text-muted);margin:-4px 0 4px" class="mono">U kodu: ${esc(e.isEmriNo)}</div>` : ''}
          <div class="op-top"><span class="op-code">${esc(e.makine||'—')}</span></div>
          <div class="op-foot">🕐 ${fmtDT(e.startTs)} → ${e.endTs?fmtDT(e.endTs):'—'} · ${dur}</div>
          <div style="margin-top:6px;font-size:12px;font-weight:600;color:${statusColor}">${statusLabel}</div>
        </div>`;
      }).join('')}
      ${entryDetailId ? renderEntryDetailModal() : ''}
    </div>`;
  } else if(view==='settings'){
    body = `<div class="body-pad">
      <div class="badge" style="margin-bottom:14px">${esc(session.username)} · ${esc(session.displayName)}</div>
      <div class="field"><label>Mevcut Şifre</label><input id="pw-current" type="password" placeholder="••••"></div>
      <div class="field"><label>Yeni Şifre (max 8 hane, sadece rakam)</label><input id="pw-next" type="password" inputmode="numeric" maxlength="8" placeholder="ör. 4821"></div>
      <div class="field"><label>Yeni Şifre (tekrar)</label><input id="pw-confirm" type="password" inputmode="numeric" maxlength="8" placeholder="ör. 4821"></div>
      <button class="btn-primary" onclick="changePassword()">✓ Şifreyi Güncelle</button>
    </div>`;
  } else {
    const mine = myActiveEntries();
    // Aynı groupId'ye sahip kayıtları TEK kart olarak göster (çoklu iş emri).
    const groups = [];
    const seenGroups = new Set();
    mine.forEach(e=>{
      if(e.groupId){
        if(seenGroups.has(e.groupId)) return;
        seenGroups.add(e.groupId);
        groups.push({ groupId: e.groupId, members: mine.filter(x=>x.groupId===e.groupId) });
      } else {
        groups.push({ groupId: null, members: [e] });
      }
    });
    body = `<div class="body-pad">`;
    // Madde 3+4 ile ilgili "gölgede kalan iş" riskine karşı: tadilat sonrası ayar bekleyen
    // işler sadece arka planda durmasın, operatör buraya her girdiğinde göze çarpsın.
    const bekleyenAyar = mine.filter(e => e.status==='duruş' && e.duruşNedeni===TADILAT_SONRASI_REASON);
    if(bekleyenAyar.length>0){
      body += `<div style="background:var(--tadilat-soft);border:2px solid var(--tadilat-info);border-radius:12px;padding:14px 16px;margin-bottom:16px">
        <div style="font-size:13.5px;font-weight:700;color:var(--tadilat-info);margin-bottom:8px">🔧 Devam Etmeyi Bekleyen ${bekleyenAyar.length} Duraklatılmış İş Var</div>
        ${bekleyenAyar.map(e=>`
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border-radius:8px;padding:8px 12px;margin-top:6px;cursor:pointer" onclick="openActiveDetail('${e.id}')">
            <div><span class="mono" style="color:var(--accent);font-weight:700">${esc(e.talepNo || e.isEmriNo)}</span> <span style="font-size:11.5px;color:var(--text-muted)">${esc(e.makine)}</span></div>
            <span style="font-size:11.5px;color:var(--tadilat-info)">Tadilat sonrası ayar →</span>
          </div>
        `).join('')}
      </div>`;
    }
    // Bir operatör aynı anda birden fazla iş açık bırakıp (ör. çoklu iş izni olan biri tadilatı
    // kapattım sanıp üstüne yeni bir üretim işi de açarsa) birini unutabiliyor — hepsini tek
    // bakışta gösteren bir uyarı + tadilatı da bu listeye dahil ediyoruz, sadece Tadilat
    // sekmesinde gizli kalmasın.
    const myTadilatSess = myActiveTadilatSession();
    const totalActiveCount = groups.length + (myTadilatSess ? 1 : 0);
    if(totalActiveCount>1){
      body += `<div style="background:var(--warn-soft);border:2px solid var(--warn);border-radius:12px;padding:14px 16px;margin-bottom:16px">
        <div style="font-size:13.5px;font-weight:700;color:var(--warn);margin-bottom:6px">⚠️ Aynı anda ${totalActiveCount} aktif işin var</div>
        <div style="font-size:12.5px;color:var(--text-muted)">${groups.length>0?`🏭 ${groups.length} üretim işi`:''}${groups.length>0 && myTadilatSess?' · ':''}${myTadilatSess?`🔧 1 tadilat`:''}</div>
      </div>`;
    }
    if(groups.length===0 && !myTadilatSess) body += `<div style="text-align:center;color:var(--text-muted);padding:40px 0">Henüz aktif işlem yok.<br><span style="font-size:12px">"+ Yeni Kayıt" ile bir makine başlat.</span></div>`;
    if(myTadilatSess){
      const { tadilat: mt, operasyon: mop } = myTadilatSess;
      body += `<div class="card" style="cursor:pointer;border-color:var(--tadilat-info);border-left:4px solid var(--tadilat-info)" onclick="setView('tadilat')">
        <div class="card-header"><span class="card-id" style="color:var(--tadilat-info)">🔧 ${esc(mt.uKodu)}</span><span class="matrix-dot" style="background:var(--tadilat-info);width:9px;height:9px;border-radius:50%;display:inline-block"></span></div>
        <div class="op-top" style="margin-bottom:6px"><span class="op-code">${esc(mop.makine||'—')}</span></div>
        <div class="op-foot">${fmtElapsed(nowTick-mop.baslamaTs)} çalışıyor · Tadilat${mt.adet?` · Adet: ${esc(mt.adet)}`:''}</div>
      </div>`;
    }
    groups.forEach(g=>{
      if(g.members.length===1){
        const e = g.members[0];
        const dotColor = e.status==='duruş'?'var(--warn)':'var(--success)';
        const subInfo = e.status==='duruş' ? `Duruşta: "${esc(e.duruşNedeni)}"` : `${fmtElapsed(nowTick-e.startTs)} çalışıyor`;
        body += `<div class="card" style="cursor:pointer" onclick="openActiveDetail('${e.id}')">
          <div class="card-header"><span class="card-id">${esc(e.talepNo || e.isEmriNo)}</span><span class="matrix-dot" style="background:${dotColor};width:9px;height:9px;border-radius:50%;display:inline-block"></span></div>
          ${e.talepNo ? `<div style="font-size:11px;color:var(--text-muted);margin:-4px 0 4px" class="mono">U kodu: ${esc(e.isEmriNo)}</div>` : ''}
          <div class="op-top" style="margin-bottom:6px"><span class="op-code">${esc(e.makine)}</span></div>
          <div class="op-foot">${subInfo}${e.adet?` · Adet: ${esc(e.adet)}`:''}</div>
        </div>`;
      } else {
        const makine = g.members[0].makine;
        const anyDurus = g.members.some(m=>m.status==='duruş');
        const dotColor = anyDurus ? 'var(--warn)' : 'var(--success)';
        body += `<div class="card" style="cursor:pointer" onclick="openGroupDetail('${g.groupId}')">
          <div class="card-header"><span class="card-id">${g.members.length} İş Emri Aktif</span><span class="matrix-dot" style="background:${dotColor};width:9px;height:9px;border-radius:50%;display:inline-block"></span></div>
          <div class="op-top" style="margin-bottom:6px"><span class="op-code">${esc(makine)}</span></div>
          <div class="op-foot">${g.members.map(m=>`${esc(m.talepNo || m.isEmriNo)} (${m.status==='duruş'?'duruşta':fmtElapsed(nowTick-m.startTs)})`).join(', ')}</div>
        </div>`;
      }
    });
    body += `</div>`;
  }

  return `<div class="root-mobile theme-${theme}">${header}${body}${messagesModalOpen ? renderMessagesModal() : ''}${sendMsgOpen ? renderSendMessageModal() : ''}</div>`;
}

        <button class="sub-tab-btn ${settingsSubTab==='access'?'active':''}" onclick="setSettingsSubTab('access')">Makine Erişimi</button>
        <button class="sub-tab-btn ${settingsSubTab==='multiJob'?'active':''}" onclick="setSettingsSubTab('multiJob')">Çoklu İş İzni</button>
        <button class="sub-tab-btn ${settingsSubTab==='cokluIsEmri'?'active':''}" onclick="setSettingsSubTab('cokluIsEmri')">Çoklu İş Emri İzni</button>
        <button class="sub-tab-btn ${settingsSubTab==='fasonMachines'?'active':''}" onclick="setSettingsSubTab('fasonMachines')">Fason Makineleri</button>
        <button class="sub-tab-btn ${settingsSubTab==='fasonYetkisi'?'active':''}" onclick="setSettingsSubTab('fasonYetkisi')">Fason Yetkisi</button>
        <button class="sub-tab-btn ${settingsSubTab==='atolyeAyarlari'?'active':''}" onclick="setSettingsSubTab('atolyeAyarlari')">Atölye Ayarları (Makine)</button>
        <button class="sub-tab-btn ${settingsSubTab==='personelAtolye'?'active':''}" onclick="setSettingsSubTab('personelAtolye')">Atölye Ayarları (Personel)</button>

        <button class="sub-tab-btn ${settingsSubTab==='durusReasons'?'active':''}" onclick="setSettingsSubTab('durusReasons')">Duruş Nedenleri</button>` : ''}
        <button class="sub-tab-btn ${settingsSubTab==='isEmriListesi'?'active':''}" onclick="setSettingsSubTab('isEmriListesi')">İş Emri Listesi</button>
        <button class="sub-tab-btn ${settingsSubTab==='stok'?'active':''}" onclick="setSettingsSubTab('stok')">Malzeme Stoğu</button>

        <button class="sub-tab-btn ${settingsSubTab==='addMachine'?'active':''}" onclick="setSettingsSubTab('addMachine')">+ Makine Ekle</button>` : ''}
      </div>`;
    if(settingsSubTab==='default'){
      body += `<div style="font-size:16px;font-weight:600;margin-bottom:6px">Operatör Varsayılan Makineleri</div>

      operatorEntries.forEach(([code,v])=>{

          </select></div>`;

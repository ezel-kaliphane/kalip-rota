<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>
    body{margin:0;background:#0F1214;color:#EDF1F3;font-family:'Inter',system-ui,sans-serif;font-size:14px}
    *{box-sizing:border-box}
    a{color:#FF9046;text-decoration:none} a:hover{color:#FFA766}
    .mono{font-family:'JetBrains Mono',monospace}
    .ic{flex:none;vertical-align:-3px}
    button{cursor:pointer;font-family:'Inter',sans-serif;border:none;background:none;color:inherit}
    /* Mobilde .tab-btn ve .sub-tab-btn min-height 40-44px (ui/styles.css:302,316) */
    .t1{display:flex;align-items:center;gap:5px;padding:10px 14px;border-radius:9px;border:1px solid #293138;background:transparent;font-size:12.5px;font-weight:500;color:#8B959D;white-space:nowrap;min-height:44px}
    .t1.on{background:#FF904618;border-color:#FF9046;color:#FF9046}
    .t3{padding:10px 16px;border-radius:8px;border:1px solid #293138;background:transparent;font-size:12.5px;font-weight:500;color:#8B959D;white-space:nowrap;min-height:44px}
    .t3.on{background:#FF904618;border-color:#FF9046;color:#FF9046;font-weight:600}
    .kart{background:#171C20;border:1px solid #293138;border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.32)}
    .modsec{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#171C20;border:1px solid #293138;border-radius:14px;padding:13px 15px;min-height:56px}
  </style>
</helmet>

<div style="display:flex;flex-direction:column;width:390px;height:844px;background:#0F1214;overflow:hidden">

  <!-- Gerçek cihaz durum çubuğu üstte kendi çiziliyor — buraya sahte bir tane koymuyoruz -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;border-bottom:1px solid #293138;flex:none;gap:10px">
    <div style="display:flex;align-items:center;gap:8px;min-width:0">
      <span style="width:8px;height:8px;border-radius:50%;background:#46D07F;flex:none"></span>
      <span style="font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:1.2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">ROTA TAKİP</span>
    </div>
    <div style="display:flex;gap:8px;flex:none">
      <div style="background:#1F262C;border:1px solid #293138;border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#8B959D">
        <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </div>
      <div style="background:#1F262C;border:1px solid #293138;border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#8B959D">
        <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </div>
    </div>
  </div>

  <!-- Seviye 1 — yatay kaydırılabilir (mobilde uygulamada da böyle) -->
  <div style="display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto;flex:none;-webkit-overflow-scrolling:touch">
    <div class="t1">Rapor</div>
    <div class="t1">Matris</div>
    <div class="t1 on"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8l-9-5-9 5v8l9 5 9-5z"></path><path d="M3.3 7L12 12l8.7-5"></path><path d="M12 22V12"></path></svg>Stok</div>
    <div class="t1">Tadilat</div>
  </div>

  <div style="flex:1;min-height:0;overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px">

    <!-- Seviye 2 — telefonda ray sığmıyor: modül SEÇİCİ olarak tek satır.
         Nerede olduğun her zaman yazılı, ikinci bir yatay sekme satırı yok. -->
    <button class="modsec" onClick="{{listeAcKapa}}">
      <span style="{{aktif.ikonStil}}">
        <svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8l-9-5-9 5v8l9 5 9-5z"></path><path d="M3.3 7L12 12l8.7-5"></path><path d="M12 22V12"></path></svg>
      </span>
      <span style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
        <span style="font-size:10.5px;color:#8B959D;text-transform:uppercase;letter-spacing:.6px;font-weight:600">Stok Modülü</span>
        <span style="font-size:15px;font-weight:600;color:#FF9046">{{aktif.label}}</span>
      </span>
      <sc-if value="{{aktif.rozetVar}}" hint-placeholder-val="{{true}}">
        <span class="mono" style="font-size:11.5px;font-weight:700;color:#F4726A;background:#F4726A22;border:1px solid #F4726A55;border-radius:20px;padding:4px 9px;flex:none">{{aktif.rozet}}</span>
      </sc-if>
      <span style="{{okStil}}">
        <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </span>
    </button>

    <sc-if value="{{listeAcik}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;flex-direction:column;gap:6px;background:#171C20;border:1px solid #293138;border-radius:14px;padding:8px">
        <sc-for list="{{moduller}}" as="m" hint-placeholder-count="4">
          <button style="{{m.stil}}" onClick="{{m.sec}}">
            <span style="display:flex;flex-direction:column;gap:2px;align-items:flex-start;flex:1;min-width:0">
              <span style="{{m.labelStil}}">{{m.label}}</span>
              <span style="font-size:11px;color:#8B959D">{{m.alt}}</span>
            </span>
            <sc-if value="{{m.rozetVar}}" hint-placeholder-val="{{true}}">
              <span class="mono" style="font-size:11px;font-weight:700;color:#F4726A;background:#F4726A22;border:1px solid #F4726A55;border-radius:20px;padding:3px 8px;flex:none">{{m.rozet}}</span>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </sc-if>

    <!-- Seviye 3 — yatay kaydırılabilir bölüm satırı, her modülde aynı fiiller -->
    <div style="display:flex;gap:8px;overflow-x:auto;flex:none;-webkit-overflow-scrolling:touch">
      <sc-for list="{{bolumler}}" as="b" hint-placeholder-count="4">
        <button class="{{b.sinif}}" onClick="{{b.sec}}">{{b.label}}</button>
      </sc-for>
    </div>

    <div style="font-size:12.5px;color:#8B959D;line-height:1.55">{{panel.altYazi}}</div>

    <sc-if value="{{panel.uyariVar}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:#F4726A;background:#F4726A12;border:1px solid #F4726A44;border-radius:12px;padding:12px 14px">
        <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
        <span style="line-height:1.55">{{panel.uyari}}</span>
      </div>
    </sc-if>

    <!-- Mobilde geniş tablo yerine kart — uygulamanın operatör ekranlarındaki .card deseni -->
    <sc-for list="{{panel.kartlar}}" as="k" hint-placeholder-count="4">
      <div class="kart">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px">
          <span class="mono" style="font-size:13.5px;font-weight:700;color:#FF9046">{{k.kod}}</span>
          <span style="{{k.rozetStil}}">{{k.rozet}}</span>
        </div>
        <div style="font-size:14px;margin-bottom:10px;line-height:1.4">{{k.ad}}</div>
        <div style="display:flex;gap:18px;flex-wrap:wrap">
          <sc-for list="{{k.alanlar}}" as="f" hint-placeholder-count="3">
            <span style="display:flex;flex-direction:column;gap:2px">
              <span style="font-size:10.5px;color:#8B959D;text-transform:uppercase;letter-spacing:.5px;font-weight:600">{{f.ad}}</span>
              <span class="mono" style="{{f.stil}}">{{f.deger}}</span>
            </span>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <sc-if value="{{panel.anahtarVar}}" hint-placeholder-val="{{true}}">
      <sc-for list="{{panel.anahtarlar}}" as="sw" hint-placeholder-count="2">
        <div style="display:flex;align-items:center;gap:13px;background:#171C20;border:1px solid #293138;border-radius:14px;padding:14px 15px;min-height:56px">
          <span style="{{sw.kutuStil}}"><span style="width:18px;height:18px;border-radius:50%;background:#0F1214;display:block"></span></span>
          <span style="display:flex;flex-direction:column;gap:3px;flex:1;min-width:0">
            <span style="font-size:13.5px;font-weight:600">{{sw.baslik}}</span>
            <span style="font-size:11.5px;color:#8B959D;line-height:1.5">{{sw.alt}}</span>
          </span>
        </div>
      </sc-for>
    </sc-if>
  </div>
</div>
</x-dc>

class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { modul:'takim', bolum:'durum', listeAcik:false };
  }

  renderVals(){
    var self = this;
    var modul = this.state.modul;
    var bolum = this.state.bolum;
    var acik = this.state.listeAcik;

    var aktifTanim = MODULLER.filter(function(m){ return m.key === modul; })[0] || MODULLER[0];

    var moduller = MODULLER.map(function(m){
      var secili = m.key === modul;
      var temel = 'display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:12px 13px;border-radius:10px;border:1px solid #293138;min-height:56px;';
      return {
        label: m.label,
        alt: m.alt,
        rozetVar: !!m.rozet,
        rozet: m.rozet || '',
        stil: secili ? temel + 'background:#FF904618;border-color:#FF9046' : temel + 'background:#0F1214',
        labelStil: secili ? 'font-size:14px;font-weight:600;color:#FF9046' : 'font-size:14px;font-weight:500;color:#EDF1F3',
        sec: function(){ self.setState({ modul: m.key, bolum: VARSAYILAN[m.key] || 'durum', listeAcik: false }); }
      };
    });

    var bolumler = (MODUL_BOLUM[modul] || []).map(function(k){
      return {
        label: BOLUM_ADI[k],
        sinif: k === bolum ? 't3 on' : 't3',
        sec: function(){ self.setState({ bolum: k }); }
      };
    });

    var ham = PANELLER[modul + ':' + bolum] || { altYazi:'', kartlar:[] };

    return {
      aktif: {
        label: aktifTanim.label,
        rozetVar: !!aktifTanim.rozet,
        rozet: aktifTanim.rozet || '',
        ikonStil: 'display:inline-flex;line-height:0;flex:none;color:#FF9046'
      },
      okStil: 'display:inline-flex;line-height:0;flex:none;color:#8B959D;transform:' + (acik ? 'rotate(180deg)' : 'rotate(0deg)'),
      listeAcik: acik,
      listeAcKapa: function(){ self.setState({ listeAcik: !acik }); },
      moduller: moduller,
      bolumler: bolumler,
      panel: {
        altYazi: ham.altYazi || '',
        uyariVar: !!ham.uyari,
        uyari: ham.uyari || '',
        kartlar: (ham.kartlar || []).map(function(k){
          return {
            kod: k.kod,
            ad: k.ad,
            rozet: k.rozet,
            rozetStil: 'font-size:11px;font-weight:700;color:' + k.ton + ';background:' + k.ton + '1f;border:1px solid ' + k.ton + '55;border-radius:20px;padding:4px 9px;white-space:nowrap;flex:none',
            alanlar: k.alanlar
          };
        }),
        anahtarVar: !!ham.anahtarlar,
        anahtarlar: (ham.anahtarlar || []).map(function(sw){
          return {
            baslik: sw.baslik,
            alt: sw.alt,
            kutuStil: 'width:42px;height:24px;border-radius:20px;flex:none;display:flex;align-items:center;padding:3px;background:' + (sw.acik ? '#46D07F' : '#293138') + ';justify-content:' + (sw.acik ? 'flex-end' : 'flex-start')
          };
        })
      }
    };
  }
}
</script>
